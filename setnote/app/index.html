<script>
/* Installable web build of index.html (scripts/build-web.mjs). SETNOTE_WEB turns on the install
   guide, the back-button handling and file backups; the claude.ai page never sets it.
   The saved theme is applied here so a dark choice doesn't flash light on launch. */
window.SETNOTE_WEB = true;
try { var t = localStorage.getItem('setnote:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<title>세트노트</title>

<style>
/* Palette: neutral ink/paper plus one volt accent. The accent is only ever a fill with --accent-ink on top
   (lime text on white is 1.3:1); accent-coloured text uses --accent-text instead. */
:root {
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --surface-2: #F2F3EF;
  --surface-3: #E7E9E3;
  --ink: #0F110E;
  --ink-2: #3B3F38;
  --muted: #6B7066;
  --line: #E4E6E0;
  --line-strong: #CDD1C8;
  --accent: #C8F135;
  --accent-ink: #0F110E;
  --accent-text: #4A6A00;
  --accent-soft: #EEF8CF;
  --done-soft: #F1F9D6;
  --inv: #0F110E;
  --inv-ink: #F4F6F0;
  --inv-soft: rgba(255,255,255,.12);
  --play-bg: #0F110E;
  --play-fg: #C8F135;
  --danger: #D92D20;
  --danger-soft: #FDECEA;
  --pr: #9A5B00;
  --pr-soft: #FFF3D6;
  --pr-fill: #FFC53D;
  --glass: rgba(255,255,255,.78);
  --scrim: rgba(10,12,9,.48);
  --shadow: 0 1px 2px rgba(16,18,14,.05), 0 10px 30px rgba(16,18,14,.08);
  --shadow-lg: 0 12px 40px rgba(16,18,14,.18);
  /* exercise tiles: one tint per body part */
  --cat-chest: #FFE4D6; --cat-chest-ink: #8A3A12; --cat-back: #DCEAFF; --cat-back-ink: #1D4B8F;
  --cat-legs: #E3F5D6; --cat-legs-ink: #2F6A12; --cat-shoulders: #EFE3FF; --cat-shoulders-ink: #5B2E99;
  --cat-arms: #FFF0C7; --cat-arms-ink: #7A5300; --cat-core: #D5F3EF; --cat-core-ink: #145F57;
  --font-num: "Barlow Condensed", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  /* Text sizes are written as N × --fs so they follow the reader's text-size setting: 1px at the default size,
     at most 1.35px (iOS "xxxLarge"; bigger settings stop there so the set table still fits a 320px phone).
     Display numbers of 20px and up use --fs-lg, which grows half as fast, so they stay inside their boxes. */
  --fs: clamp(.88px, calc(1rem / 16), 1.35px);
  --fs-lg: clamp(.94px, calc(.5px + 1rem / 32), 1.18px);
  /* motion: three durations and one curve for the whole app */
  --dur-fast: 150ms;
  --dur-base: 250ms;
  --dur-slow: 400ms;
  --ease-standard: cubic-bezier(.2, 0, 0, 1);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 22px;
  --tabbar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  font-size: 100%;
  color-scheme: light;
}
/* The dark palette has to be written twice: once for the system setting and once for an explicit dark choice
   (the app's own theme setting, or claude.ai's), so either can win. scripts/build-web.mjs stops if the two copies differ. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0A0B09; --surface: #151713; --surface-2: #1D201B; --surface-3: #272A23; --ink: #F3F5EF; --ink-2: #C9CDC3;
    --muted: #8F948A; --line: #242720; --line-strong: #363A31; --accent: #D4FF3A; --accent-ink: #0A0B09;
    --accent-text: #D4FF3A; --accent-soft: #232B0E; --done-soft: #1A2109; --inv: #272A23; --inv-ink: #F3F5EF;
    --inv-soft: rgba(255,255,255,.1); --play-bg: #D4FF3A; --play-fg: #0A0B09; --danger: #FF6B5E; --danger-soft: #3A1714;
    --pr: #FFC53D; --pr-soft: #33270C; --pr-fill: #FFC53D; --glass: rgba(29,32,27,.78);
    --scrim: rgba(0,0,0,.62); --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.35); --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
    --cat-chest: #3A2217; --cat-chest-ink: #FFB48F; --cat-back: #182A45; --cat-back-ink: #9CC3FF;
    --cat-legs: #1F3316; --cat-legs-ink: #A6E07C; --cat-shoulders: #2C1D44; --cat-shoulders-ink: #CDA8FF;
    --cat-arms: #3A2E0E; --cat-arms-ink: #FFD66B; --cat-core: #123430; --cat-core-ink: #86E3D6;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0A0B09; --surface: #151713; --surface-2: #1D201B; --surface-3: #272A23; --ink: #F3F5EF; --ink-2: #C9CDC3;
  --muted: #8F948A; --line: #242720; --line-strong: #363A31; --accent: #D4FF3A; --accent-ink: #0A0B09;
  --accent-text: #D4FF3A; --accent-soft: #232B0E; --done-soft: #1A2109; --inv: #272A23; --inv-ink: #F3F5EF;
  --inv-soft: rgba(255,255,255,.1); --play-bg: #D4FF3A; --play-fg: #0A0B09; --danger: #FF6B5E; --danger-soft: #3A1714;
  --pr: #FFC53D; --pr-soft: #33270C; --pr-fill: #FFC53D; --glass: rgba(29,32,27,.78);
  --scrim: rgba(0,0,0,.62); --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.35); --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
  --cat-chest: #3A2217; --cat-chest-ink: #FFB48F; --cat-back: #182A45; --cat-back-ink: #9CC3FF;
  --cat-legs: #1F3316; --cat-legs-ink: #A6E07C; --cat-shoulders: #2C1D44; --cat-shoulders-ink: #CDA8FF;
  --cat-arms: #3A2E0E; --cat-arms-ink: #FFD66B; --cat-core: #123430; --cat-core-ink: #86E3D6;
}
/* "Increase contrast" (iOS) / prefers-contrast: grey text, lines and the tab bar get stronger. The light values sit on
   bare :root, which the dark blocks above outrank; the dark values come twice for the same reason as above. */
@media (prefers-contrast: more) {
  :root { --ink-2: #262924; --muted: #4D5249; --line: #B4B9AE; --line-strong: #858B7F; --accent-text: #3A5400; --danger: #B42318; --pr: #7A4800; --glass: rgba(255,255,255,.96); }
}
@media (prefers-contrast: more) and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ink-2: #E4E7DF; --muted: #B6BBB0; --line: #4D5248; --line-strong: #727869; --danger: #FF8E84; --glass: rgba(29,32,27,.96); }
}
@media (prefers-contrast: more) {
  :root[data-theme="dark"] { --ink-2: #E4E7DF; --muted: #B6BBB0; --line: #4D5248; --line-strong: #727869; --danger: #FF8E84; --glass: rgba(29,32,27,.96); }
}
/* iPhone and iPad: Safari shares the Dynamic Type size only through -apple-system-body (17px at the default size),
   so the root takes that font and --fs is measured against 17px. -webkit-touch-callout keeps desktop Safari out.
   Elsewhere Android Chrome scales text by itself, so text-size-adjust stays at its default there. */
@supports (font: -apple-system-body) and (-webkit-touch-callout: none) {
  :root { font: -apple-system-body; -webkit-text-size-adjust: 100%; --fs: clamp(.88px, calc(1rem / 17), 1.35px); --fs-lg: clamp(.94px, calc(.5px + 1rem / 34), 1.18px); }
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: calc(15 * var(--fs)); line-height: 1.5; padding-inline: 16px; word-break: keep-all; overflow-wrap: break-word;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; opacity: .4; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: calc(30 * var(--fs-lg)); line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: calc(20 * var(--fs-lg)); line-height: 1.3; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-fill { fill: currentColor; stroke: none; }

/* the page skeleton (claude.ai, and web/template.html the same way) already pads :root by the safe-area insets */
.app { max-width: 560px; margin: 0 auto; padding-block: 0 calc(var(--tabbar-h) + 124px); }
/* covers the status-bar strip above the sticky header so scrolled cards don't show through it on phones */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 15; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 10px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: calc(17 * var(--fs)); letter-spacing: -.02em; }
.logo { width: 28px; height: 28px; }
.logo .bg { fill: var(--play-bg); }
.logo .o { fill: none; stroke: var(--play-fg); stroke-width: 3.2; }
.logo .h { fill: var(--play-fg); }
.top-actions { display: flex; align-items: center; gap: 6px; }
.sync { position: relative; display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; border-radius: 999px; font-size: calc(12.5 * var(--fs)); font-weight: 600; white-space: nowrap; color: var(--muted); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.sync .ic { width: 16px; height: 16px; }
.sync.cloud { color: var(--accent-text); }
.icon-btn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { background: var(--surface-3); }
.icon-btn.round { border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.icon-btn.sm { border-radius: 10px; }
.icon-btn.sm .ic { width: 18px; height: 18px; }

.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-block: 8px 18px; }
.view-head p { color: var(--muted); font-size: calc(13.5 * var(--fs)); margin-top: 4px; }
.view-head .btn { flex: none; white-space: nowrap; }
.eyebrow { font-size: calc(13 * var(--fs)); font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.sub-h { font-size: calc(13 * var(--fs)); font-weight: 700; color: var(--muted); letter-spacing: .01em; margin: 26px 4px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.empty { color: var(--muted); padding: 18px 4px; }
.empty-state { display: grid; gap: 4px; padding: 22px 4px 8px; }
.empty-state b { font-size: calc(16.5 * var(--fs)); }
.empty-state p { color: var(--muted); font-size: calc(14 * var(--fs)); }
.empty-state .btn { margin-top: 12px; }
.stack { display: grid; gap: 10px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: var(--r-md); font-weight: 700; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink); text-align: center; transition: transform var(--dur-fast) var(--ease-standard), background-color var(--dur-fast); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn .ic { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); box-shadow: none; color: var(--accent-ink); }
.btn-ink { background: var(--play-bg); box-shadow: none; color: var(--play-fg); }
.btn-soft { background: var(--surface-2); box-shadow: none; color: var(--ink-2); }
.btn-ghost { background: transparent; box-shadow: none; border: 1.5px dashed var(--line-strong); color: var(--ink-2); }
.btn-danger { background: var(--danger-soft); box-shadow: none; color: var(--danger); }
.btn-text { box-shadow: none; background: none; color: var(--muted); min-height: 44px; font-weight: 600; }
.btn-text.danger { color: var(--danger); }
.btn-sm { min-height: 44px; padding: 0 14px; font-size: calc(14 * var(--fs)); border-radius: 12px; }
.wide { width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

/* home: featured routine */
.hero { position: relative; overflow: hidden; background: var(--accent); color: var(--accent-ink); border-radius: 26px; padding: 18px 18px 16px; display: grid; gap: 4px; margin-bottom: 8px; }
.hero::after { content: ""; position: absolute; right: -46px; top: -46px; width: 170px; height: 170px; border-radius: 50%; border: 22px solid rgba(15,17,14,.07); pointer-events: none; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: calc(13 * var(--fs)); font-weight: 700; }
.hero-label { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(15,17,14,.1); }
.hero-when { font-weight: 600; opacity: .72; text-align: right; }
.hero-name { font-size: calc(28 * var(--fs-lg)); font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin-top: 8px; text-align: left; overflow-wrap: anywhere; position: relative; z-index: 1; }
.hero-meta { display: flex; gap: 14px; font-size: calc(13.5 * var(--fs)); font-weight: 600; opacity: .78; }
.hero-meta b { font-size: calc(18 * var(--fs)); font-weight: 700; margin-right: 1px; }
.hero-ex { font-size: calc(13.5 * var(--fs)); opacity: .78; margin-top: 2px; }
.hero-go { margin-top: 12px; height: 52px; border-radius: 16px; background: var(--hero-btn, #0F110E); color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: calc(16 * var(--fs)); position: relative; z-index: 1; transition: transform var(--dur-fast) var(--ease-standard); }
.hero-go:active { transform: scale(.98); }
.hero-go .ic { width: 18px; height: 18px; }

/* routine cards */
.rcard { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding-right: 14px; }
.rcard-main { flex: 1; min-width: 0; padding: 16px 4px 16px 18px; display: grid; gap: 3px; }
.rcard-title { font-size: calc(17.5 * var(--fs)); font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; letter-spacing: -.01em; }
.rcard-meta { font-size: calc(13 * var(--fs)); color: var(--muted); }
.rcard-ex { font-size: calc(13.5 * var(--fs)); color: var(--ink-2); margin-top: 4px; }
.play { width: 50px; height: 50px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--play-bg); color: var(--play-fg); transition: transform var(--dur-fast) var(--ease-standard); }
.play:active { transform: scale(.94); }
.play .ic { width: 20px; height: 20px; margin-left: 2px; }
.badge { font-size: calc(11 * var(--fs)); font-weight: 700; letter-spacing: .01em; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.badge.pr { background: var(--pr-soft); color: var(--pr); }
.tpl { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 10px; }
.tpl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tpl-name { font-weight: 700; font-size: calc(17 * var(--fs)); }
.tpl-list { font-size: calc(13.5 * var(--fs)); color: var(--ink-2); }
.tpl-more { margin-top: 18px; }
.tpl-more > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: calc(14 * var(--fs)); min-height: 44px; display: flex; align-items: center; padding: 0 4px; list-style: none; }
.tpl-more > summary::-webkit-details-marker { display: none; }
.tpl-more[open] > summary { margin-bottom: 8px; }
.intro { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 6px; margin-bottom: 14px; }
.intro b { font-size: calc(16.5 * var(--fs)); }
.intro p { color: var(--ink-2); font-size: calc(14 * var(--fs)); }
.intro .row2 { margin-top: 6px; }
.welcome { display: grid; gap: 10px; justify-items: start; padding: 6px 2px 18px; }
.welcome .logo { width: 52px; height: 52px; }
.welcome h2 { font-size: calc(24 * var(--fs-lg)); }
.welcome p { color: var(--ink-2); font-size: calc(14.5 * var(--fs)); }
.after-list { display: grid; gap: 8px; margin-top: 12px; }

/* floating tab bar */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 10px); z-index: 20; width: min(420px, calc(100% - 32px)); border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); box-shadow: inset 0 0 0 1px var(--line), var(--shadow-lg); padding: 6px; }
.tabbar-in { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; height: calc(var(--tabbar-h) - 12px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 999px; font-size: calc(11.5 * var(--fs)); color: var(--muted); font-weight: 600; text-align: center; transition: background-color var(--dur-fast), color var(--dur-fast); }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* resume pill */
.pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + var(--tabbar-h) + 20px); z-index: 21; width: min(420px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 20px; background: var(--inv); color: var(--inv-ink); box-shadow: var(--shadow-lg); text-align: left; }
.pill-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 0 rgba(200,241,53,.6); animation: live 1.6s ease-out infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(200,241,53,.55); } 70%, 100% { box-shadow: 0 0 0 9px rgba(200,241,53,0); } }
.pill-txt { flex: 1; min-width: 0; display: grid; }
.pill-txt b { font-size: calc(14.5 * var(--fs)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-txt span { font-size: calc(12.5 * var(--fs)); opacity: .78; }
.pill-txt .num { font-size: calc(14 * var(--fs)); font-weight: 600; }
.pill-go { flex: none; height: 40px; padding: 0 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: calc(14 * var(--fs)); display: grid; place-items: center; }

/* exercise list */
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
/* never under 16px: iPhone Safari zooms the whole page into a field with smaller text (a small text-size setting would do it) */
.txt { height: 48px; border-radius: var(--r-md); border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); padding: 0 14px; font-size: max(16px, calc(16 * var(--fs))); width: 100%; }
.txt:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ink); }
.search .txt { padding-left: 40px; }
.txt::placeholder { color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px 4px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; row-gap: 8px; }
.chip { position: relative; flex: none; height: 36px; padding: 0 15px; border-radius: 999px; font-size: calc(14 * var(--fs)); font-weight: 600; background: var(--surface); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.exlist { display: grid; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.exrow { display: flex; gap: 12px; align-items: center; padding: 12px 16px 12px 12px; border-top: 1px solid var(--line); width: 100%; }
.exrow:first-child { border-top: 0; }
.exrow:active { background: var(--surface-2); }
.extile { width: 44px; height: 44px; border-radius: 13px; flex: none; display: grid; place-items: center; font-size: calc(12 * var(--fs)); font-weight: 700; letter-spacing: -.02em; background: var(--surface-2); color: var(--ink-2); }
.extile[data-cat="가슴"] { background: var(--cat-chest); color: var(--cat-chest-ink); }
.extile[data-cat="등"] { background: var(--cat-back); color: var(--cat-back-ink); }
.extile[data-cat="하체"] { background: var(--cat-legs); color: var(--cat-legs-ink); }
.extile[data-cat="어깨"] { background: var(--cat-shoulders); color: var(--cat-shoulders-ink); }
.extile[data-cat="팔"] { background: var(--cat-arms); color: var(--cat-arms-ink); }
.extile[data-cat="코어"] { background: var(--cat-core); color: var(--cat-core-ink); }
.exrow-txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.exrow-name { font-weight: 600; }
.exrow-sub { font-size: calc(13 * var(--fs)); color: var(--muted); overflow-wrap: anywhere; }
.exrow-best { text-align: right; flex: none; display: grid; }
.exrow-best .num { font-size: calc(24 * var(--fs-lg)); font-weight: 700; line-height: 1.05; }
.exrow-best small { font-size: calc(11 * var(--fs)); color: var(--muted); }
.last b { font-weight: 600; color: var(--ink-2); }
.last.none { color: var(--muted); }

/* history */
.week { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px 14px 14px; display: grid; gap: 16px; }
/* columns follow their content, so a six-digit weekly volume still fits next to the other two */
.week-sum { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 8px 12px; padding-inline: 4px; }
.wstat { display: grid; gap: 0; min-width: 0; }
/* numbers in the three-across tiles are already display size and fill their tiles, so they keep a fixed size */
.wstat .num { font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: -.01em; white-space: nowrap; }
.wstat .num em { font-style: normal; font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.wstat small { font-size: calc(12 * var(--fs)); color: var(--muted); font-weight: 600; }
.week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wk { display: grid; justify-items: center; gap: 6px; font-size: calc(12 * var(--fs)); color: var(--muted); font-weight: 600; }
.wk-dot { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-num); font-size: calc(15 * var(--fs)); font-weight: 600; color: var(--ink-2); }
.wk.on .wk-dot { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.wk.today .wk-dot { box-shadow: inset 0 0 0 2px var(--ink); }
.wk.today > span:first-child { color: var(--ink); font-weight: 700; }
.month-h { display: flex; justify-content: space-between; font-size: calc(13 * var(--fs)); font-weight: 700; color: var(--muted); letter-spacing: .01em; margin: 26px 4px 10px; }
.scard { width: 100%; display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 14px 16px 14px 14px; text-align: left; }
.scard:active { background: var(--surface-2); }
.scard-date { width: 48px; flex: none; display: grid; justify-items: center; padding: 6px 0 5px; border-radius: 14px; background: var(--surface-2); line-height: 1.1; }
.scard-date b { font-family: var(--font-num); font-size: calc(24 * var(--fs-lg)); font-weight: 700; }
.scard-date small { font-size: calc(11.5 * var(--fs)); color: var(--muted); font-weight: 600; }
.scard-main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.scard-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.scard-title { font-weight: 700; font-size: calc(16.5 * var(--fs)); letter-spacing: -.01em; }
.scard-when { font-size: calc(12.5 * var(--fs)); color: var(--muted); flex: none; }
.scard-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: calc(13 * var(--fs)); color: var(--muted); }
.scard-stats > span { display: inline-flex; align-items: baseline; gap: 2px; }
.scard-stats .num { font-size: calc(17 * var(--fs)); font-weight: 700; color: var(--ink); }
.scard-ex { font-size: calc(13 * var(--fs)); color: var(--muted); }

/* workout overlay */
.wo { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.wo-head { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 0; }
.wo-head-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.wo-title { flex: 1; min-width: 0; }
.wo-name { font-weight: 700; font-size: calc(17 * var(--fs)); overflow-wrap: anywhere; line-height: 1.3; letter-spacing: -.01em; }
.wo-sub { font-size: calc(12.5 * var(--fs)); color: var(--muted); }
.wo-stats { max-width: 560px; margin: 10px auto 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wo-stat { background: var(--surface); border-radius: var(--r-md); box-shadow: inset 0 0 0 1px var(--line); padding: 8px 12px 7px; display: grid; }
.wo-stat .num { font-size: 24px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
.wo-stat .num em { font-style: normal; font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 1px; }
.wo-stat small { font-size: calc(11.5 * var(--fs)); color: var(--muted); font-weight: 600; }
.wo-bar { max-width: 560px; margin: 10px auto 0; height: 4px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.wo-bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width var(--dur-base) var(--ease-standard); }
.wo-head::after { content: ""; display: block; height: 10px; }
.wo-body { max-width: 560px; margin: 0 auto; padding: 6px 16px calc(150px + var(--safe-b)); display: grid; gap: 12px; }
.wo-empty { text-align: center; color: var(--muted); padding: 28px 12px; background: var(--surface); border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); }

.excard { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 14px 12px 10px; transition: box-shadow var(--dur-fast); }
.excard.all-done { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow); }
/* when the name's longest word can't fit beside the tools (big text on a narrow phone), the tools move to a second line
   instead of the word breaking mid-syllable */
.excard-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 10px; padding-left: 4px; }
.ex-idx { width: 30px; height: 30px; margin-top: 2px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--surface-2); font-size: calc(17 * var(--fs)); font-weight: 700; color: var(--ink-2); }
.excard.all-done .ex-idx { background: var(--accent); color: var(--accent-ink); }
.excard-name { position: relative; flex: 1; font-size: calc(17.5 * var(--fs)); font-weight: 700; letter-spacing: -.01em; line-height: 1.3; padding-top: 4px; overflow-wrap: break-word; }
.excard-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.excard-tools { display: flex; flex: none; gap: 12px; margin-left: auto; color: var(--muted); }
.excard-last { margin-top: 6px; padding-left: 4px; font-size: calc(13 * var(--fs)); color: var(--ink-2); display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; }
.tag { font-size: calc(11 * var(--fs)); font-weight: 700; letter-spacing: .01em; padding: 2px 8px; border-radius: 7px; background: var(--surface-2); color: var(--muted); }
.tag.acc { background: var(--accent-soft); color: var(--accent-text); }
.tag.ok { background: var(--accent); color: var(--accent-ink); }
.sets { margin-top: 12px; display: grid; gap: 4px; }
.set-h, .set { display: grid; grid-template-columns: 30px minmax(0, 1fr) 74px 60px 46px; gap: 7px; align-items: center; }
.set-h { font-size: calc(11.5 * var(--fs)); color: var(--muted); font-weight: 700; padding: 0 4px 2px; }
.set-h span { white-space: nowrap; }
/* centred with flex so a label wider than its column (big text, 320px) spills evenly to both sides */
.set-h span:first-child { display: flex; justify-content: center; }
/* starts where the values under it start (.set-prev padding), which also keeps it clear of '세트' */
.set-h span:nth-child(2) { padding-left: 4px; }
.set-h span:nth-child(3), .set-h span:nth-child(4) { text-align: center; }
.set { padding: 4px; border-radius: 14px; transition: background-color var(--dur-fast); }
.set.done { background: var(--done-soft); }
.set-n { width: 28px; height: 28px; justify-self: center; border-radius: 9px; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: calc(16 * var(--fs)); color: var(--ink-2); background: var(--surface-2); }
.set.done .set-n { background: transparent; color: var(--accent-text); }
.set-prev { font-family: var(--font-num); font-size: calc(16 * var(--fs)); color: var(--muted); padding: 6px 4px; border-radius: 9px; min-height: 44px; overflow-wrap: anywhere; word-break: keep-all; line-height: 1.15; display: flex; align-items: center; flex-wrap: wrap; }
.set-prev:not(:disabled):hover { background: var(--surface-2); color: var(--ink-2); }
.set-prev:disabled { opacity: 1; }
.num-in { width: 100%; height: 46px; border-radius: 12px; border: 0; background: var(--surface-2); text-align: center; font-family: var(--font-num); font-size: calc(21 * var(--fs-lg)); font-weight: 700; padding: 0 4px; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow var(--dur-fast), background-color var(--dur-fast); }
.num-in::placeholder { color: var(--muted); opacity: 1; font-weight: 500; }
.num-in:focus { background: var(--surface); outline: none; box-shadow: inset 0 0 0 2px var(--ink); }
.set.done .num-in { background: transparent; }
@media (max-width: 359px) {
  .row2 .btn { padding-inline: 10px; font-size: calc(14 * var(--fs)); }
  .row2 .btn .ic, .row3 .btn .ic { display: none; }
  .rest-btns button { padding-inline: 10px; }
  .excard { padding-inline: 8px; }
  .set-h, .set { grid-template-columns: 24px minmax(0, 1fr) 60px 48px 44px; gap: 5px; }
  .set-n { width: 24px; height: 24px; font-size: calc(15 * var(--fs)); }
  .num-in { font-size: calc(19 * var(--fs-lg)); }
  .wo-stat { padding-inline: 9px; }
  .wo-stat .num { font-size: 21px; }
  .wstat .num { font-size: 25px; }
}
.set-check { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: var(--surface-2); transition: background-color var(--dur-fast), transform var(--dur-fast) var(--ease-standard); }
.set-check:active { transform: scale(.92); }
.set-check .ic { width: 22px; height: 22px; stroke-width: 2.8; }
.set.done .set-check { background: var(--accent); color: var(--accent-ink); }
.set.pop .set-check { animation: tick var(--dur-fast) var(--ease-standard); }
@keyframes tick { from { transform: scale(.86); } to { transform: none; } }
.excard-foot { display: grid; gap: 8px; margin-top: 8px; }
.excard-foot .btns { display: flex; gap: 6px; }
.excard-foot .btns .btn-soft { flex: 1; }
.prog { font-size: calc(13 * var(--fs)); color: var(--muted); padding-left: 4px; }
.prog b { color: var(--ink-2); }
.prog.up b:last-child { color: var(--accent-text); }
.prog .num { font-size: calc(15 * var(--fs)); }

/* rest bar */
.rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 12px); width: min(528px, calc(100% - 24px)); z-index: 35; overflow: hidden; border-radius: 24px; background: var(--inv); color: var(--inv-ink); padding: 16px 14px 14px 20px; box-shadow: var(--shadow-lg); }
.rest-prog { position: absolute; left: 0; top: 0; height: 4px; background: var(--accent); transition: width var(--dur-base) linear; }
.rest-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rest-label { font-size: calc(12.5 * var(--fs)); font-weight: 600; opacity: .75; }
.rest-time { font-size: calc(38 * var(--fs-lg)); font-weight: 700; min-width: 3.4ch; line-height: 1; letter-spacing: -.01em; }
.rest-btns { margin-left: auto; display: flex; gap: 6px; }
.rest-btns button { min-height: 44px; padding: 0 13px; border-radius: 14px; background: var(--inv-soft); font-weight: 700; font-size: calc(14 * var(--fs)); font-family: var(--font-body); }
.rest-btns button:last-child { background: var(--accent); color: var(--accent-ink); }

/* sheets */
.sheet-root { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-root:empty { display: none; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); cursor: pointer; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: calc(100% - 20px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--surface); border-radius: 28px 28px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.sheet.enter { animation: sheet-up var(--dur-base) var(--ease-standard); }
@keyframes sheet-up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 14px 8px 22px; }
.sheet-head .icon-btn { background: var(--surface-2); border-radius: 50%; width: 36px; height: 36px; }
.sheet-head .icon-btn .ic { width: 18px; height: 18px; }
.sheet-body { overflow-y: auto; padding: 6px 22px 20px; overscroll-behavior: contain; flex: 1; }
.sheet-foot { padding: 12px 22px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); display: grid; gap: 8px; }
.sheet .exlist { border-radius: var(--r-md); box-shadow: inset 0 0 0 1px var(--line); }
.confirm-msg { font-size: calc(15 * var(--fs)); color: var(--ink-2); padding-block: 4px 8px; }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: calc(13 * var(--fs)); font-weight: 700; color: var(--ink-2); }
.sheet .txt { background: var(--surface-2); box-shadow: none; }
.sheet .txt:focus { box-shadow: inset 0 0 0 2px var(--ink); background: var(--surface); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-block: 6px 16px; }
.stat { background: var(--surface-2); border-radius: var(--r-md); padding: 11px 13px; display: grid; gap: 1px; }
.stat small { font-size: calc(12 * var(--fs)); color: var(--muted); font-weight: 600; }
.stat .num { font-size: 26px; font-weight: 700; line-height: 1.1; }
.stat .num em { font-style: normal; font-size: 14px; font-weight: 600; margin-left: 2px; color: var(--muted); }

.rd-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.rd-ex { width: 100%; display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); }
.rd-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.rd-name { font-weight: 600; }
.rd-target { font-size: calc(13 * var(--fs)); color: var(--muted); flex: none; }
.rd-last { font-size: calc(13 * var(--fs)); color: var(--ink-2); overflow-wrap: anywhere; }
.kv { font-size: calc(14 * var(--fs)); color: var(--ink-2); }

.ed-list { display: grid; gap: 8px; margin-block: 4px 12px; }
.ed-row { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 10px 12px 14px; display: grid; gap: 6px; }
.ed-top { display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; }
.ed-name { font-weight: 600; padding-top: 6px; overflow-wrap: anywhere; }
.ed-tools { display: flex; flex: none; gap: 12px; }
.ed-last { font-size: calc(12.5 * var(--fs)); color: var(--muted); overflow-wrap: anywhere; }
.ed-fields { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stepper { display: inline-flex; align-items: center; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); height: 44px; }
.stepper button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); }
.stepper .ic { width: 16px; height: 16px; }
.stepper .num { font-size: calc(20 * var(--fs-lg)); font-weight: 700; min-width: 1.6ch; text-align: center; }
.stepper small { font-size: calc(12.5 * var(--fs)); color: var(--muted); margin-right: 2px; }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 44px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); padding: 0 10px 0 4px; }
.mini input { width: 58px; height: 40px; border: 0; background: transparent; text-align: center; font-family: var(--font-num); font-size: calc(19 * var(--fs-lg)); font-weight: 700; }
.mini input:focus { outline: none; }
.mini:focus-within { box-shadow: inset 0 0 0 2px var(--ink); }
.mini small { font-size: calc(12.5 * var(--fs)); color: var(--muted); }

.pk-row { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); width: 100%; }
.pk-row:first-child { border-top: 0; }
.pk-box { width: 26px; height: 26px; border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--line-strong); display: grid; place-items: center; color: transparent; flex: none; }
.pk-box .ic { width: 16px; height: 16px; stroke-width: 3; }
.pk-row.on { background: var(--accent-soft); }
.pk-row.on .pk-box { background: var(--accent); box-shadow: none; color: var(--accent-ink); }
.pk-txt { display: grid; min-width: 0; }
.pk-name { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pk-sub { font-size: calc(12.5 * var(--fs)); color: var(--muted); overflow-wrap: anywhere; }
.pk-new { display: flex; width: 100%; align-items: center; gap: 8px; padding: 12px 14px; margin-bottom: 10px; border-radius: var(--r-md); border: 1.5px dashed var(--line-strong); color: var(--ink); font-weight: 700; }
.pk-create { padding: 12px 14px; margin-bottom: 10px; border-radius: var(--r-md); background: var(--accent-soft); }
.pk-create-t { font-weight: 600; font-size: calc(14 * var(--fs)); overflow-wrap: anywhere; }

.chart { margin-block: 4px 16px; }
.chart-h { display: flex; justify-content: space-between; font-size: calc(12.5 * var(--fs)); color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.chart svg { width: 100%; height: auto; display: block; }
.sp-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
.sp-area { fill: var(--accent); stroke: none; opacity: .28; }
.sp-line { stroke: var(--ink); stroke-width: 2.25; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.sp-dot { fill: var(--accent); stroke: var(--ink); stroke-width: 2; }
.sp-txt { fill: var(--muted); font-family: var(--font-num); font-size: 12px; }
.sp-txt.hi { fill: var(--ink); font-weight: 700; font-size: 13px; }

.hist { display: grid; gap: 8px; }
.hist-row { display: grid; gap: 2px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r-md); }
.hist-top { display: flex; justify-content: space-between; gap: 8px; font-size: calc(12.5 * var(--fs)); color: var(--muted); }
.hist-sets { font-family: var(--font-num); font-size: calc(17 * var(--fs)); font-weight: 600; overflow-wrap: anywhere; }

.sd-ex { padding-block: 10px; border-top: 1px solid var(--line); }
.sd-ex:first-of-type { border-top: 0; }
.sd-name { position: relative; font-weight: 700; }
.sd-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.sd-sets { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.sd-sets li { display: grid; grid-template-columns: 26px auto; gap: 8px; font-family: var(--font-num); font-size: calc(17 * var(--fs)); font-weight: 600; }
.sd-sets li span:first-child { color: var(--muted); }

.done-hero { position: relative; text-align: center; padding-block: 4px 8px; display: grid; justify-items: center; gap: 2px; }
.done-badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); margin-bottom: 8px; animation: pop var(--dur-slow) cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.done-badge .ic { width: 30px; height: 30px; stroke-width: 2.6; }

function exInfo(id, fallbackName) {

function mergeById(a, b) {

function allExercises() {

function sortSessions(arr) { return arr.slice().sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0)); }

/* index of last/best per exercise, rebuilt only when the sessions array changes */
let _idx = null, _idxRef = null;
function idx() {
  if (_idxRef === S.sessions && _idx) return _idx;
  const last = new Map(), best = new Map(), count = new Map(), routineLast = new Map();
  for (const s of S.sessions) {
    if (s.routineId && !routineLast.has(s.routineId)) routineLast.set(s.routineId, s.endedAt);
    for (const ex of (s.exercises || [])) {
      if (!ex.sets || !ex.sets.length) continue;
      if (!last.has(ex.exId)) last.set(ex.exId, { s, ex });
      count.set(ex.exId, (count.get(ex.exId) || 0) + 1);
      const b = best.get(ex.exId) || { e1: 0, maxW: 0, maxR: 0 };
      for (const st of ex.sets) {
        const e = e1rm(st.w, st.r);
        if (e > b.e1) { b.e1 = e; b.e1Set = st; }
        if ((st.w || 0) > b.maxW) { b.maxW = st.w; b.maxWR = st.r; }
        if ((st.r || 0) > b.maxR) b.maxR = st.r;
      }
      best.set(ex.exId, b);
    }
  }
  _idx = { last, best, count, routineLast };
  _idxRef = S.sessions;
  return _idx;
}

function wStr(w, bw) {

function setsStr(sets, bw) {

  if (sets.every(s => (s.w ?? null) === w0)) return `${wStr(w0, bw)} × ${sets.map(s => s.r ?? '-').join(', ')}`;

async function attempt(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 800); return fn(); }
    throw e;
  }
}

function cloudStore(db, uidv) {
  const base = db.doc('data/users/' + uidv + '/profile');
  const rCol = base.collection('routines');
  const sCol = base.collection('sessions');
  const aDoc = base.collection('state').doc('active');
  const queues = new Map();
  const unsubs = {};
  let dead = false;
  const run = (key, fn) => {
    if (dead) return Promise.resolve();
    const p = (queues.get(key) || Promise.resolve()).catch(() => {}).then(() => (dead ? undefined : attempt(fn)));
    queues.set(key, p);
    p.then(() => { S.wroteOk = true; }, onWriteError);
    return p;
  };
  const docData = d => ({ ...clone(d.data()), id: d.id });
  const fresh = m => !(m && m.fromCache);
  const syncKey = 'setnote:active-synced:' + uidv;
  const subs = {
    routines: () => rCol.onSnapshot(snap => setData('routines', snap.docs.filter(d => d.exists).map(docData), fresh(snap.metadata)), e => onSubError('routines', e)),
    sessions: () => sCol.orderBy('endedAt', 'desc').limit(1000).onSnapshot(snap => setData('sessions', snap.docs.filter(d => d.exists).map(docData), fresh(snap.metadata)), e => onSubError('sessions', e)),
    profile: () => base.onSnapshot(d => setData('profile', d.exists ? clone(d.data()) : {}, fresh(d.metadata)), e => onSubError('profile', e)),
  };
  const retried = {};
  function onSubError(which, e) {
    console.warn('subscription error', which, e);
    if (dead) return;
    if (e && e.code === 'revoked') { switchToLocal(tx('클라우드 연결이 끊겼어요. 지금부터는 이 기기에만 저장돼요.', 'Lost the connection to your account. From now on, records are saved on this device only.')); return; }
    if (e && e.code === 'unavailable' && !retried[which]) {
      retried[which] = true;
      setTimeout(() => { if (!dead) unsubs[which] = subs[which](); }, 3000);
      return;
    }
    if (which !== 'profile') S.loaded[which] = true;
    toast(tx('기록을 불러오지 못했어요. 새로고침해 보세요.', "Couldn't load your records. Try refreshing."));
    scheduleRender();
  }
  return {
    kind: 'cloud',
    start() { for (const k in subs) unsubs[k] = subs[k](); },
    async loadActive() {
      try { const d = await aDoc.get(); return d.exists ? clone(d.data()) : null; } catch { return undefined; }
    },
    saveRoutine: r => run('r/' + r.id, () => rCol.doc(r.id).set(clone(r))),
    deleteRoutine: id => run('r/' + id, () => rCol.doc(id).delete()),
    saveSession: s => run('s/' + s.id, () => sCol.doc(s.id).set(clone(s))),
    deleteSession: id => run('s/' + id, () => sCol.doc(id).delete()),
    saveProfile: () => { const body = clone(S.profile); return run('p', () => base.set(body)); },
    saveActive: a => {
      const body = a ? clone(a) : null;
      return run('a', () => body
        ? aDoc.set(body).then(() => { lsSet(syncKey, body.id); })
        : aDoc.delete().then(() => { lsDel(syncKey); }));
    },
    stop() { dead = true; for (const k in unsubs) { try { unsubs[k] && unsubs[k](); } catch {} } },
  };
}

function onWriteError(e) {
  console.warn('write failed', e);
  const code = e && e.code;
  if (store && store.kind === 'cloud' && code === 'invalid_argument' && !S.wroteOk) {
    if (S.uid) { lsSet('setnote:cloud-denied:' + S.uid, '1'); S.deniedUid = S.uid; }
    switchToLocal(tx('이 링크에서는 계정에 저장할 권한이 없어서, 이 기기에만 저장할게요.', "This link can't save to your account, so records will be saved on this device only."));
    return;
  }
  if (code === 'revoked') { switchToLocal(tx('클라우드 연결이 끊겼어요. 지금부터는 이 기기에만 저장돼요.', 'Lost the connection to your account. From now on, records are saved on this device only.')); return; }
  if (code === 'quota_exceeded') { toast(tx('저장 공간이 가득 찼어요. 오래된 기록을 백업한 뒤 지워 주세요.', 'Storage is full. Back up old records, then delete them.')); return; }
  if (code === 'resource_exhausted') { toast(tx('저장 요청이 너무 많아요. 잠시 후 다시 해 주세요.', 'Too many saves at once. Try again in a moment.')); return; }
  toast(tx('저장하지 못했어요. 인터넷 연결을 확인해 주세요.', "Couldn't save. Check your internet connection."));
}

function switchToLocal(msg) {
  if (store && store.kind === 'local') return;
  if (store) store.stop();
  const prevMirror = S.active ? clone(S.active) : null;
  const oldMirror = mirrorKey(), oldOb = obKey();
  const pending = readOb();
  S.mode = 'local';
  S.uid = null;
  if (pending.length) S.sessions = sortSessions(mergeById(S.sessions, pending));
  store = localStore(false);
  store.start();
  if (oldMirror !== mirrorKey()) {
    const m = lsGet(oldMirror);
    if (!prevMirror && m && !lsGet(mirrorKey())) lsSet(mirrorKey(), m);
    lsDel(oldMirror);
  }
  if (oldOb !== obKey()) lsDel(oldOb);
  if (prevMirror) writeMirror(prevMirror);
  S.loaded.routines = true; S.loaded.sessions = true; S.loaded.profile = true;
  S.activeReady = true;
  S.localOnly = null;
  if (msg) toast(msg, 4200);
  scheduleRender();
}

function setData(kind, val, isFresh = true) {
  if (isFresh) S.fresh[kind] = true;
  if (kind === 'routines') { S.routines = sortRoutines(val.filter(r => r && r.id)); S.loaded.routines = true; }
  else if (kind === 'sessions') {
    const ob = readOb().filter(o => !val.some(x => x && x.id === o.id));
    S.sessions = sortSessions([...val, ...ob].filter(x => x && x.id));
    S.loaded.sessions = true;
    if (S.active && S.sessions.some(s => s.id === S.active.id)) {
      // this workout was already finished on another device
      S.active = null; S.workoutOpen = false; S.rest = null; clearMirror(); keepAwake(false);
    }
  } else if (kind === 'profile') { S.profile = val || {}; S.loaded.profile = true; }
  if (S.mode === 'cloud') checkLocalOnly();
  scheduleRender();
}

/* records kept only in this browser (from a visit where the account store was unavailable) */
function checkLocalOnly() {
  if (S.localOnly !== null || !S.fresh.routines || !S.fresh.sessions || !S.fresh.profile) return;
  const d = lsJSON('setnote:v1') || {};
  const rs = (Array.isArray(d.routines) ? d.routines : []).map(cleanRoutine).filter(r => r && !S.routines.some(x => x.id === r.id));
  const ss = (Array.isArray(d.sessions) ? d.sessions : []).map(cleanSession).filter(x => x && !S.sessions.some(y => y.id === x.id));
  const cs = (d.profile && Array.isArray(d.profile.custom) ? d.profile.custom : []).map(cleanCustom).filter(c => c && !prof().custom.some(x => x.id === c.id));
  S.localOnly = { rs, ss, cs, n: rs.length + ss.length + cs.length };
  if (lsGet('setnote:v1')) pruneV1({ r: S.routines.map(x => x.id), s: S.sessions.map(x => x.id), c: prof().custom.map(x => x.id) });
}
async function migrateLocal() {
  const L = S.localOnly;
  if (!L || !L.n || !store || store.kind !== 'cloud') return;
  S.migrateHidden = true;
  render();
  toast(tx('계정으로 옮기는 중…', 'Moving to your account…'), 60000);
  let fail = 0, csOk = !L.cs.length;
  const doneR = new Set(), doneS = new Set();
  if (L.cs.length) {
    S.profile = { ...S.profile, custom: mergeById(prof().custom, L.cs) };
    try { await store.saveProfile(); csOk = true; } catch { fail++; }
  }
  for (const r of L.rs) {
    if (store.kind !== 'cloud') break;
    if (!S.routines.some(x => x.id === r.id)) S.routines = sortRoutines([...S.routines, r]);
    try { await store.saveRoutine(r); doneR.add(r.id); } catch { fail++; }
    await sleep(60);
  }
  for (const x of L.ss) {
    if (store.kind !== 'cloud') break;
    if (!S.sessions.some(y => y.id === x.id)) S.sessions = sortSessions([...S.sessions, x]);
    try { await store.saveSession(x); doneS.add(x.id); } catch { fail++; }
    await sleep(60);
  }
  if (store.kind === 'cloud') {
    const d = lsJSON('setnote:v1') || {};
    d.routines = (Array.isArray(d.routines) ? d.routines : []).filter(r => !(r && doneR.has(r.id)));
    d.sessions = (Array.isArray(d.sessions) ? d.sessions : []).filter(x => !(x && doneS.has(x.id)));
    if (csOk && d.profile && typeof d.profile === 'object') d.profile.custom = [];

  if (store.kind === 'cloud') toast(fail ? tx(`${fail}개는 옮기지 못했어요. 나중에 다시 시도해 주세요.`, `Couldn't move ${fail}. Try again later.`) : tx('계정으로 모두 옮겼어요', 'Everything moved to your account'), 3600);

}

/* active workout persistence: mirror immediately, cloud debounced */
let actTimer = null;
function touchActive() {
  if (!S.active) return;
  S.active.updatedAt = Date.now();
  writeMirror(S.active);
  clearTimeout(actTimer);
  actTimer = setTimeout(flushActive, 900);
}
function flushActive() {
  clearTimeout(actTimer); actTimer = null;
  if (store && store.kind === 'cloud' && S.active) store.saveActive(S.active);
}
function clearActiveEverywhere() {
  clearTimeout(actTimer); actTimer = null;
  clearMirror();
  if (store && store.kind === 'cloud') store.saveActive(null);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && actTimer) flushActive();

/* ---------- boot ---------- */
function use(name) {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') return Promise.resolve(null);
  try { return Promise.resolve(C.use(name)).catch(() => null); } catch { return Promise.resolve(null); }
}
function validActive(a) { return a && typeof a === 'object' && Array.isArray(a.exercises) && typeof a.startedAt === 'number' && typeof a.id === 'string'; }

async function boot() {
  render();
  const [db, user] = await Promise.all([use('db'), use('user')]);
  let uidv = null;
  if (user) { try { uidv = await user.id(); } catch { uidv = null; } }
  if (db && uidv && !lsGet('setnote:cloud-denied:' + uidv)) {
    S.uid = uidv; S.mode = 'cloud';
    store = cloudStore(db, uidv);
  } else {
    if (db && uidv) S.deniedUid = uidv;
    S.mode = 'local';
    store = localStore(true);
  }
  store.start();
  const ob = readOb();
  if (ob.length) { S.sessions = sortSessions(mergeById(S.sessions, ob)); if (store.kind === 'cloud') resendOutbox(); else ob.forEach(sendSession); }
  let mirror = lsJSON(mirrorKey());
  const localMirror = S.mode === 'cloud' ? lsJSON('setnote:active:local') : null;
  const remote = await store.loadActive();
  if (store.kind === 'cloud' && remote === null && mirror && lsGet('setnote:active-synced:' + S.uid) === mirror.id) {
    // finished or discarded on another device after this one last saved it
    clearMirror(); lsDel('setnote:active-synced:' + S.uid); mirror = null;
  }
  const cands = [mirror, remote, localMirror].filter(validActive);
  cands.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const pick = cands[0];
  const v1 = lsJSON('setnote:v1');
  const savedIds = new Set([...S.sessions, ...readOb(), ...(v1 && Array.isArray(v1.sessions) ? v1.sessions : [])].map(x => x && x.id));
  if (!S.active && pick && !savedIds.has(pick.id)) {
    S.active = pick;
    if (pick === localMirror) { lsDel('setnote:active:local'); touchActive(); }
    else writeMirror(pick);
  }
  S.activeReady = true;
  render();
}
window.addEventListener('online', resendOutbox);

/* ---------- rendering ---------- */
let pendingRender = false, rafId = 0, lastSheetKey = '', sheetChangedAt = -1e9, rendering = false;
const isTyping = () => { const a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.type !== 'file'; };
function scheduleRender() {
  if (isTyping()) { pendingRender = true; return; }
  if (!rafId) rafId = requestAnimationFrame(() => { rafId = 0; render(); });
}
document.addEventListener('focusout', () => {
  if (!pendingRender || rendering) return;
  setTimeout(() => { if (pendingRender && !isTyping()) { pendingRender = false; render(); } }, 0);
});

function render() {
  pendingRender = false;
  const ae = document.activeElement;
  const fid = ae && ae.id;
  let s0 = null, s1 = null;
  if (fid && isTyping()) { try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch {} }
  const woEl = $('#wo');
  const woScroll = woEl ? woEl.scrollTop : null;
  const shBody = $('.sheet-body');
  const shScroll = shBody ? shBody.scrollTop : 0;

  const top = topSheet();
  const key = top ? S.sheets.length + ':' + top.kind + ':' + (top.id || '') : '';
  rendering = true;
  try {
    $('#main').innerHTML = headerHtml() + `<div class="view${S.enter.has('view') ? ' enter' : ''}">${viewHtml()}</div>`;
    const tb = $('#tabbar');
    tb.innerHTML = tabbarHtml();
    tb.setAttribute('aria-label', tx('메뉴', 'Menu'));
    tb.hidden = !!(S.active && S.workoutOpen);
    $('#pill-root').innerHTML = S.active && !S.workoutOpen ? pillHtml() : '';
    $('#wo-root').innerHTML = S.active && S.workoutOpen ? workoutHtml() : '';
    $('#sheet-root').innerHTML = top ? sheetHtml(top) : '';
  } finally { rendering = false; }
  const nwo = $('#wo');
  if (nwo && woScroll != null) nwo.scrollTop = woScroll;
  const nsb = $('.sheet-body');
  if (nsb && key === lastSheetKey) nsb.scrollTop = shScroll;
  if (key !== lastSheetKey) sheetChangedAt = performance.now();
  lastSheetKey = key;
  S.sheetEnter = false;
  S.pop = null;
  S.enter.clear();

  if (fid) {
    const el = document.getElementById(fid);
    if (el && el !== document.activeElement) {
      try { el.focus({ preventScroll: true }); if (s0 != null && el.setSelectionRange) el.setSelectionRange(s0, s1); } catch {}
    }
  }
  document.body.classList.toggle('lock', !!(S.active && S.workoutOpen) || S.sheets.length > 0);
  syncBackGuard();
  tickUi();
}

function historyView() {
  const head = `<div class="view-head"><div><h1>${tx('기록', 'History')}</h1><p>${tx('끝낸 운동이 날짜별로 쌓여요', 'Finished workouts, by date')}</p></div></div>`;
  if (!S.loaded.sessions) return head + `<p class="empty">${tx('기록을 불러오는 중…', 'Loading records…')}</p>`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const days = new Map();
  for (const s of S.sessions) { const k = dayKey(s.endedAt); days.set(k, (days.get(k) || 0) + 1); }
  let wkCount = 0, wkVol = 0;
  for (const s of S.sessions) if (s.endedAt >= mon.getTime()) { wkCount++; wkVol += s.volume || 0; }
  const cells = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const on = days.has(dayKey(d.getTime()));
    const isToday = d.getTime() === today.getTime();

  }
  const streak = weekStreak(mon.getTime());
  const week = `<div class="week"><div class="week-sum">
      <div class="wstat"><span class="num">${wkCount}<em>${tx('회', '')}</em></span><small>${tx('이번 주 운동', 'Workouts this week')}</small></div>
      <div class="wstat"><span class="num">${fmtInt(wkVol)}<em>kg</em></span><small>${tx('이번 주 볼륨', 'Volume this week')}</small></div>
      <div class="wstat"><span class="num">${streak}<em>${tx('주', ' wk')}</em></span><small>${tx('연속 운동', 'Streak')}</small></div>
    </div><div class="week-days">${cells.join('')}</div></div>`;
  if (!S.sessions.length) return head + migrateBanner() + week + historyEmpty();
  let html = '', curMonth = '';
  const groups = new Map();
  for (const s of S.sessions) { const d = new Date(s.endedAt); const k = monthLabel(d); groups.set(k, (groups.get(k) || 0) + 1); }
  for (const s of S.sessions) {
    const d = new Date(s.endedAt); const k = monthLabel(d);
    if (k !== curMonth) { if (curMonth) html += '</div>'; curMonth = k; html += `<h3 class="month-h"><span>${k}</span><span>${tx(`${groups.get(k)}회`, pl(groups.get(k), 'workout'))}</span></h3><div class="stack">`; }
    const exs = s.exercises || [];
    html += `<button class="scard" data-act="open-session" data-id="${esc(s.id)}">
      <span class="scard-date" aria-hidden="true"><b>${d.getDate()}</b><small>${dow(d.getDay())}</small></span><span class="sr">${esc(fmtDate(s.endedAt))}</span>
      <span class="scard-main">
        <span class="scard-top"><span class="scard-title">${esc(rName(s.routineName))}</span><span class="scard-when">${relDay(s.endedAt)}</span></span>
        <span class="scard-stats"><span><span class="num">${fmtDur((s.endedAt || 0) - (s.startedAt || 0))}</span></span><span><span class="num">${s.setCount || 0}</span>${tx('세트', s.setCount === 1 ? ' set' : ' sets')}</span><span><span class="num">${fmtInt(s.volume)}</span>kg</span></span>
        <span class="scard-ex">${esc(exs.map(e => `${exName(e)} ${e.sets.length}`).join(' · '))}</span>
      </span>
    </button>`;
  }
  if (curMonth) html += '</div>';
  return head + migrateBanner() + installBanner() + week + html;
}

/* workout */
function pillHtml() {
  const a = S.active;
  const sub = S.rest ? `${tx('휴식', 'Rest')} <span id="pill-time" class="num">${fmtClock((S.rest.end - Date.now()) / 1000)}</span>${tx(' 남음', ' left')}` : `${tx('진행 중', 'In progress')} · <span id="pill-time" class="num">${fmtClock((Date.now() - a.startedAt) / 1000)}</span>`;
  return `<button class="pill" data-act="wo-open"><span class="pill-dot" aria-hidden="true"></span><span class="pill-txt"><b>${esc(rName(a.routineName))}</b><span>${sub}</span></span><span class="pill-go">${tx('이어서 하기', 'Resume')}</span></button>`;
}
function findEx(u) { return S.active && S.active.exercises.find(e => e.u === u); }
/* value a set logs when ✓ is tapped with empty inputs:
   follow last time's set-by-set numbers, unless today's earlier sets moved away from them */
function fillFor(ex, i) {
  const L = idx().last.get(ex.exId);
  const ls = L ? L.ex.sets : [];
  const tail = ls.length ? ls[ls.length - 1] : null;
  const tW = ex.target && ex.target.weight != null ? ex.target.weight : null;
  const tR = firstInt(ex.target && ex.target.reps);
  let effW = null, effR = null;
  for (let j = 0; ; j++) {
    const prev = ls[j] || null;
    let w;
    if (j === 0) w = prev ? prev.w : tail ? tail.w : tW;
    else if (prev && ls[j - 1] && (ls[j - 1].w ?? null) === effW) w = prev.w;
    else w = effW;
    const r = prev ? prev.r : effR != null ? effR : tail ? tail.r : tR;
    if (j >= i || j >= ex.sets.length) return { prev: ls[i] || null, w: w ?? null, r: r ?? null };
    const st = ex.sets[j];
    const typedW = String(st.w ?? '').trim() !== '' ? num(st.w) : null;
    effW = typedW != null ? typedW : (w ?? null);
    effR = int(st.r) > 0 ? int(st.r) : (r ?? null);
  }
}
function placeholders(ex, i) {
  const f = fillFor(ex, i);
  return {
    w: f.w != null ? (ex.bw && f.w === 0 ? '0' : fmtW(f.w)) : (ex.bw ? tx('맨몸', 'BW') : 'kg'),
    r: f.r != null ? String(f.r) : (ex.target && ex.target.reps ? String(ex.target.reps) : tx('회', 'reps')),
  };
}
function validDone(ex, s) {
  return !!s.done && int(s.r) > 0 && (String(s.w).trim() === '' ? !!ex.bw : num(s.w) != null);
}
function progressHtml(ex) {
  const L = idx().last.get(ex.exId);
  const done = ex.sets.filter(s => validDone(ex, s)).map(s => ({ w: num(s.w), r: int(s.r) }));
  if (!done.length || !L) return '';
  const cur = metric(done), prev = metric(L.ex.sets);
  if (cur.vol > 0 && prev.vol > 0) {
    const d = cur.vol - prev.vol;
    return `<span class="prog${d > 0 ? ' up' : ''}">${tx('볼륨', 'Volume')} <b class="num">${fmtInt(cur.vol)}</b> / ${tx('지난번', 'last')} ${fmtInt(prev.vol)}kg${d > 0 ? ` · <b>+${fmtInt(d)}kg</b>` : ''}</span>`;
  }
  const d = cur.reps - prev.reps;
  return `<span class="prog${d > 0 ? ' up' : ''}">${tx('총', '')} <b class="num">${cur.reps}</b>${tx('회', ' reps')} / ${tx('지난번', 'last')} ${prev.reps}${tx('회', '')}${d > 0 ? ` · <b>+${d}${tx('회', '')}</b>` : ''}</span>`;
}
function exCardHtml(ex, k, n) {
  const L = idx().last.get(ex.exId);
  const lastLine = L
    ? `<span class="tag acc">${tx('지난번', 'Last time')}</span><span>${relDay(L.s.endedAt)}</span>`
    : `<span class="tag">${tx('첫 기록', 'First')}</span><span>${tx('이번이 첫 기록이에요', 'Your first time with this one')}</span>`;
  const target = ex.target ? `<span class="muted">· ${tx(`목표 ${ex.target.sets}세트 × ${esc(ex.target.reps || '-')}회`, `Goal ${pl(ex.target.sets, 'set')} × ${esc(ex.target.reps || '-')}`)}${ex.target.weight != null ? ' · ' + fmtW(ex.target.weight) + 'kg' : ''}</span>` : '';
  const rows = ex.sets.map((st, i) => {
    const f = fillFor(ex, i);
    const ph = st.done ? { w: ex.bw ? tx('맨몸', 'BW') : '', r: '' } : placeholders(ex, i);
    const p = f.prev;
    const prevTxt = p ? `${p.w ? (ex.bw ? '+' : '') + fmtW(p.w) : (ex.bw ? tx('맨몸', 'BW') : '—')}×${p.r ?? '-'}` : '—';
    const prevHtml = prevTxt.replace('×', '<wbr>×');
    return `<div class="set${st.done ? ' done' : ''}${S.pop === ex.u + ':' + i ? ' pop' : ''}${S.enter.has('set:' + ex.u + ':' + i) ? ' add' : ''}">
      <span class="set-n">${i + 1}</span>
      <button class="set-prev" data-act="wo-copy-prev" data-u="${ex.u}" data-i="${i}" ${p ? '' : 'disabled'} aria-label="${p ? tx('지난번 값 ' + prevTxt + ' 넣기', 'Use last time: ' + prevTxt) : tx('지난번 기록 없음', 'No previous record')}">${prevHtml}</button>
      <input id="w-${ex.u}-${i}" class="num-in" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-field="w" data-u="${ex.u}" data-i="${i}" value="${esc(st.w)}" placeholder="${esc(ph.w)}" aria-label="${tx(`${i + 1}세트 무게 kg`, `Set ${i + 1} weight kg`)}">
      <input id="r-${ex.u}-${i}" class="num-in" inputmode="numeric" enterkeyhint="done" autocomplete="off" data-field="r" data-u="${ex.u}" data-i="${i}" value="${esc(st.r)}" placeholder="${esc(ph.r)}" aria-label="${tx(`${i + 1}세트 횟수`, `Set ${i + 1} reps`)}">
      <button class="set-check" data-act="wo-check" data-u="${ex.u}" data-i="${i}" aria-pressed="${!!st.done}" aria-label="${tx(`${i + 1}세트 완료`, `Set ${i + 1} done`)}">${I('check')}</button>
    </div>`;
  }).join('');
  const allDone = ex.sets.length > 0 && ex.sets.every(s => s.done);
  return `<section class="excard${allDone ? ' all-done' : ''}${S.enter.has('ex:' + ex.u) ? ' add' : ''}">
    <div class="excard-head">
      <span class="ex-idx num" aria-hidden="true">${k + 1}</span>
      <button class="excard-name" data-act="open-ex" data-id="${esc(ex.exId)}">${esc(exName(ex))}</button>
      <div class="excard-tools">
        <button class="icon-btn sm" data-act="wo-move" data-u="${ex.u}" data-dir="-1" ${k === 0 ? 'disabled' : ''} aria-label="${tx('위로', 'Move up')}">${I('up')}</button>
        <button class="icon-btn sm" data-act="wo-move" data-u="${ex.u}" data-dir="1" ${k === n - 1 ? 'disabled' : ''} aria-label="${tx('아래로', 'Move down')}">${I('dn')}</button>
        <button class="icon-btn sm" data-act="wo-remove-ex" data-u="${ex.u}" aria-label="${tx(`${esc(exName(ex))} 빼기`, `Remove ${esc(exName(ex))}`)}">${I('x')}</button>
      </div>
    </div>
    <div class="excard-last">${lastLine}${target}</div>
    <div class="sets">
      <div class="set-h"><span>${tx('세트', 'Set')}</span><span>${tx('지난번', 'Previous')}</span><span>kg</span><span>${tx('회', 'Reps')}</span><span></span></div>
      ${rows}
    </div>
    <div class="excard-foot">
      <div class="btns"><button class="btn btn-sm btn-soft" data-act="wo-add-set" data-u="${ex.u}">${I('plus')}${tx('세트 추가', 'Add set')}</button>${ex.sets.length > 1 ? `<button class="btn btn-sm btn-text" data-act="wo-del-set" data-u="${ex.u}" aria-label="${tx('마지막 세트 빼기', 'Remove last set')}">${I('minus')}${tx('세트 빼기', 'Remove set')}</button>` : ''}</div>
      ${progressHtml(ex)}
    </div>
  </section>`;
}
function workoutHtml() {

    if (!hist.length) {

    const b = idx().best.get(t.id) || {};
    const useE1 = !(info.bw || hist[0].ex.bw) && (b.e1 || 0) > 0;
    const pts = hist.slice(0, 24).reverse().map(h => ({ t: h.s.endedAt, v: useE1 ? Math.max(...h.ex.sets.map(st => e1rm(st.w, st.r))) : Math.max(...h.ex.sets.map(st => st.r || 0)) }));
    const stats = `<div class="stats">
      <div class="stat"><small>${tx('최근', 'Last')}</small><span class="num">${relDay(hist[0].s.endedAt)}</span></div>
      ${useE1 ? `<div class="stat"><small>${tx('최고 무게', 'Heaviest')}</small><span class="num">${fmtW(b.maxW)}<em>kg × ${b.maxWR}</em></span></div>
      <div class="stat"><small>${tx('추정 1RM', 'Est. 1RM')}</small><span class="num">${fmtW(round1(b.e1))}<em>kg</em></span></div>` : `<div class="stat"><small>${tx('최다 반복', 'Most reps')}</small><span class="num">${b.maxR || 0}<em>${tx('회', '')}</em></span></div>`}
      <div class="stat"><small>${tx('한 횟수', 'Sessions')}</small><span class="num">${hist.length}<em>${tx('번', '')}</em></span></div>
    </div>`;
    const chart = pts.length >= 2 ? `<div class="chart"><div class="chart-h"><span>${useE1 ? tx('세션별 추정 1RM (kg)', 'Est. 1RM per session (kg)') : tx('세션별 최다 반복 (회)', 'Most reps per session')}</span><span>${tx(`최근 ${pts.length}번`, `Last ${pts.length}`)}</span></div>${sparkline(pts, S.sheetEnter)}</div>` : '';
    const list = hist.slice(0, 40).map(h => `<div class="hist-row"><div class="hist-top"><span>${fmtDate(h.s.endedAt)} · ${relDay(h.s.endedAt)}</span><span>${esc(rName(h.s.routineName))}</span></div><div class="hist-sets">${esc(setsStr(h.ex.sets, h.ex.bw))}</div></div>`).join('');
    return {
      title: esc(info.name),
      body: `<p class="muted" style="margin-bottom:8px">${esc(catName(info.cat))} · ${tx('추정 1RM은 Epley 공식(무게 × (1 + 횟수/30))으로 계산해요', 'Est. 1RM uses the Epley formula: weight × (1 + reps/30)')}</p>${stats}${chart}<h3 class="sub-h" style="margin-top:4px">${tx('지난 기록', 'Past sessions')}</h3><div class="hist">${list}</div>${hist.length > 40 ? `<p class="empty">${tx('최근 40번만 보여요.', 'Showing the last 40.')}</p>` : ''}`,
    };

function topEditor() { for (let i = S.sheets.length - 1; i >= 0; i--) if (S.sheets[i].kind === 'editor') return S.sheets[i]; return null; }

/* draw: the exercise sheet just opened. The line draws itself left to right (0.7 s), the area and labels fade in
   under it, and the last dot lands; when the latest session is the best so far, one lime ring spreads from it.
   Only on open (a re-render shows the finished chart). The line moves stroke-dashoffset on one small path,
   which repaints that SVG only, no layout. Reduce Motion shows the finished chart. */
function sparkline(pts, draw) {
  const W = 320, H = 132, pl = 6, pr = 66, pt = 14, pb = 24;
  const vs = pts.map(p => p.v);
  const vmax = Math.max(...vs), vmin = Math.min(...vs);
  let hi = vmax, lo = vmin;
  if (hi - lo < 1) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.12; hi += pad; lo -= pad;
  const n = pts.length;
  const x = i => pl + (i * (W - pl - pr)) / (n - 1);
  const y = v => pt + ((hi - v) * (H - pt - pb)) / (hi - lo);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `M${x(0).toFixed(1)},${(H - pb).toFixed(1)} L${line.split(' ').join(' L')} L${x(n - 1).toFixed(1)},${(H - pb).toFixed(1)} Z`;
  const lastV = pts[n - 1].v;
  const yMax = y(vmax), yMin = y(vmin), yLast = y(lastV);
  const labels = [`<text class="sp-txt hi" x="${W - pr + 8}" y="${(yLast + 4).toFixed(1)}">${fmtW(round1(lastV))}</text>`];
  if (Math.abs(yMax - yLast) > 14) labels.push(`<text class="sp-txt" x="${W - pr + 8}" y="${(yMax + 4).toFixed(1)}">${tx('최고', 'Best')} ${fmtW(round1(vmax))}</text>`);
  if (Math.abs(yMin - yLast) > 14 && Math.abs(yMin - yMax) > 14) labels.push(`<text class="sp-txt" x="${W - pr + 8}" y="${(yMin + 4).toFixed(1)}">${fmtW(round1(vmin))}</text>`);
  const d0 = new Date(pts[0].t), d1 = new Date(pts[n - 1].t);
  const best = vs.slice(0, -1).every(v => v < lastV);
  const lx = x(n - 1).toFixed(1), ly = yLast.toFixed(1);
  return `<svg${draw ? ' class="draw"' : ''} viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx(`최근 ${n}번 기록 추이, 마지막 ${fmtW(round1(lastV))}${best ? ', 지금까지 최고' : ''}`, `Trend over the last ${n} sessions, latest ${fmtW(round1(lastV))}${best ? ', best so far' : ''}`)}">
    <line class="sp-grid" x1="${pl}" x2="${W - pr}" y1="${yMax.toFixed(1)}" y2="${yMax.toFixed(1)}"/>
    <line class="sp-grid" x1="${pl}" x2="${W - pr}" y1="${yMin.toFixed(1)}" y2="${yMin.toFixed(1)}"/>
    <path class="sp-area" d="${area}" opacity=".7"/>
    <path class="sp-line" pathLength="1" d="M${line.split(' ').join(' L')}"/>
    ${draw && best ? `<circle class="sp-ring" cx="${lx}" cy="${ly}" r="4.5"/>` : ''}
    <circle class="sp-dot" cx="${lx}" cy="${ly}" r="4.5"/>
    <g class="sp-labels">${labels.join('')}
    <text class="sp-txt" x="${pl}" y="${H - 6}">${d0.getMonth() + 1}/${d0.getDate()}</text>
    <text class="sp-txt" x="${W - pr}" y="${H - 6}" text-anchor="end">${d1.getMonth() + 1}/${d1.getDate()}</text></g>
  </svg>`;
}

/* ---------- workout logic ---------- */
function mkWoEx(exId, t) {
  const info = exInfo(exId, t && t.name);
  const L = idx().last.get(exId);
  const n = clamp((t && t.sets) || (L ? L.ex.sets.length : 0) || 3, 1, 20);
  const target = t && (t.reps || t.weight != null) ? { sets: t.sets || n, reps: t.reps || '', weight: t.weight ?? null } : null;
  return { u: uid(), exId, name: info.name, bw: !!info.bw, target, sets: Array.from({ length: n }, () => ({ w: '', r: '', done: false })) };
}
function guardStart(fn) {
  if (!S.activeReady) { toast(tx('아직 불러오는 중이에요. 잠시만요.', 'Still loading. One moment.')); return; }

/* Workout-count milestones (1st, 5th, 10th, 25th, 50th, 75th, 100th, then every 50th) get a stamp on the done

   device: the highest one shown is remembered, so deleting old sessions and finishing again doesn't repeat it.

const MILESTONES = [1, 5, 10, 25, 50, 75, 100];
function milestoneFor(n) {

  if (!(MILESTONES.includes(n) || (n > 100 && n % 50 === 0))) return 0;
  const key = 'setnote:milestone:' + (S.uid || 'local');
  if (n <= (parseInt(lsGet(key), 10) || 0)) return 0;
  lsSet(key, String(n));
  return n;
}

/* The total volume rolls up from 0 while the done sheet slides in (0.7 s, ease-out), a value-change reaction.
   The final number is already in the HTML, so Reduce Motion, a hidden tab or a re-render just shows it. */
function countUp(el, to) {
  if (!el || !(to > 0) || document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const DUR = 700, t0 = performance.now();
  const step = now => {
    if (!el.isConnected) return;
    const k = Math.min((now - t0) / DUR, 1);
    el.textContent = fmtInt(Math.round(to * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(step);
  };
  el.textContent = '0';

}

let actx = null, wakeLock = null;

/* ---------- celebrate ---------- */
/* One short confetti burst from the trophy when a finished workout has a new record (t.prs). It only fires on
   record days so it keeps meaning something. Opaque paper bits instead of the practice page's additive glow,
   which vanishes on the white sheet; ink bits keep the lime ones visible on white. About 1.6 s and 80 bits,
   then the canvas removes itself. The canvas lets touches through, so 확인 works mid-burst.
   Reduce Motion gets nothing (the trophy and the 신기록 rows already say it); a hidden tab stops it. */
let confettiStop = null;
function celebrate(el) {
  if (!el || document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = el.getBoundingClientRect();
  if (!box.width) return;
  if (confettiStop) confettiStop();
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const colors = [tok('--accent'), tok('--pr-fill'), tok('--accent'), tok('--pr-fill'), tok('--ink')];
  const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);

  cv.setAttribute('aria-hidden', 'true');
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ox = box.left + box.width / 2, oy = box.top + box.height / 2;
  const bits = [];
  for (let i = 0; i < 80; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.25; // upward fan, about ±110°
    const v = 260 + Math.random() * 440; // px per second
    bits.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 14,
      flip: Math.random() * 6.3, vf: 7 + Math.random() * 9, w: 6 + Math.random() * 5, h: 3.5 + Math.random() * 3,
      round: i % 4 === 0, c: colors[i % colors.length] });
  }
  const DUR = 1.6, FADE = 0.5;
  let raf = 0, t = 0, last = 0;
  const stop = () => {
    cancelAnimationFrame(raf); cv.remove();
    document.removeEventListener('visibilitychange', stop);
    if (confettiStop === stop) confettiStop = null;
  };
  confettiStop = stop;
  document.addEventListener('visibilitychange', stop);
  const frame = now => {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 0;
    last = now; t += dt;
    if (t >= DUR) return stop();
    ctx.clearRect(0, 0, W, H);
    const drag = Math.exp(-2.4 * dt);
    ctx.globalAlpha = t < DUR - FADE ? 1 : (DUR - t) / FADE;
    for (const b of bits) {
      b.vx *= drag; b.vy = b.vy * drag + 900 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.rot += b.vr * dt; b.flip += b.vf * dt;

      ctx.fillStyle = b.c;
      if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.h * 0.8, 0, Math.PI * 2); ctx.fill(); }

    }

  };

}

/* ---------- theme, install, back button ---------- */
/* The claude.ai host may set :root[data-theme] itself. "시스템" hands the attribute back to it,
   and a host change while the user picked light/dark is overridden again. The web build has no host. */
const themes = () => [['system', tx('시스템', 'System')], ['light', tx('밝게', 'Light')], ['dark', tx('어둡게', 'Dark')]];

  const pref = themePref();

  if (ownTheme) rootEl.setAttribute('data-theme', ownTheme); else rootEl.removeAttribute('data-theme');
  /* status bar colour in the installed app follows the chosen theme, not only the phone's */
  const bg = getComputedStyle(rootEl).getPropertyValue('--bg').trim();
