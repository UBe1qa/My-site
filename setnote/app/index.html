  if (start && !S.activeReady) { toast(tx('아직 불러오는 중이에요. 잠시만요.', 'Still loading. One moment.')); return; }
  const now = Date.now();
  const r = { id: uid(), name: t.name, note: t.note, exercises: t.ex.map(([exId, sets, reps]) => ({ exId, sets, reps, weight: null })), createdAt: now, updatedAt: now };
  S.routines = sortRoutines([...S.routines, r]);
  store.saveRoutine(r);
  if (start) guardStart(() => startWorkout(r.name, r.id, r.exercises));
  else { toast(tx(`‘${t.name}’ 루틴을 추가했어요`, `Added “${t.name}”`)); render(); }
}
function saveDraft() {
  const ed = topSheet(); if (!ed || ed.kind !== 'editor') return;
  const d = ed.draft;
  const name = String(d.name || '').trim();
  if (!name) { toast(tx('루틴 이름을 입력해 주세요', 'Enter a routine name')); const el = $('#ed-name'); if (el) el.focus(); return; }
  if (!d.exercises.length) { toast(tx('운동을 하나 이상 넣어 주세요', 'Add at least one exercise')); return; }
  for (let i = 0; i < d.exercises.length; i++) {
    const wv = d.exercises[i].weight;
    if (wv != null && String(wv).trim() !== '' && num(wv) == null) { toast(tx('목표 무게는 숫자로 입력해 주세요', 'Enter the target weight as a number')); const el = document.getElementById('ed-w-' + i); if (el) el.focus(); return; }
  }
  const now = Date.now();
  const r = {
    id: d.id || uid(), name: name.slice(0, 40), note: String(d.note || '').trim().slice(0, 80),
    exercises: d.exercises.map(e => ({ exId: e.exId, sets: clamp(parseInt(e.sets, 10) || 3, 1, 20), reps: String(e.reps ?? '').trim().slice(0, 10) || '10', weight: num(e.weight) })),
    createdAt: d.createdAt || now, updatedAt: now,
  };
  S.routines = sortRoutines([...S.routines.filter(x => x.id !== r.id), r]);
  store.saveRoutine(r);
  S.sheets.pop();
  toast(d.id ? tx('루틴을 저장했어요', 'Routine saved') : tx(`‘${r.name}’ 루틴을 만들었어요`, `Created “${r.name}”`));
  render();
}

function applyPicker() {
  const p = topSheet(); if (!p || p.kind !== 'picker') return;
  const ids = p.sel.slice();
  S.sheets.pop();
  if (p.target === 'editor') {
    const ed = topEditor();
    if (ed) ids.forEach(id => {
      const L = idx().last.get(id);
      ed.draft.exercises.push({ exId: id, sets: L ? clamp(L.ex.sets.length, 1, 20) : 3, reps: L && L.ex.sets[0] && L.ex.sets[0].r ? String(L.ex.sets[0].r) : '10', weight: null });
    });
    render();
  } else if (S.active) {
    ids.forEach(id => { const e = mkWoEx(id, null); S.active.exercises.push(e); S.enter.add('ex:' + e.u); });
    touchActive();
    render();
    const wo = $('#wo'); if (wo) wo.scrollTop = wo.scrollHeight;
  } else render();
}
function createCustom(name, cat) {
  const p = topSheet(); if (!p || p.kind !== 'picker') return;
  name = String(name || '').trim().slice(0, 40);
  if (!name) return;
  if (!profileReady()) return;
  const existing = allExercises().find(e => nameIs(e, name));
  const id = existing ? existing.id : 'c_' + uid();
  if (!existing) {
    S.profile = { ...S.profile, custom: [...prof().custom, { id, name, cat: CATS.includes(cat) ? cat : '기타', bw: false }] };
    store.saveProfile();
  }
  if (!p.sel.includes(id)) p.sel.push(id);
  p.q = ''; p.creating = false; p.cat = '전체';
  toast(tx(`‘${name}’ 운동을 만들었어요`, `Created “${name}”`));
  render();
}

/* ---------- backup ---------- */
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
async function doExport() {
  const data = { app: 'setnote', version: 1, exportedAt: new Date().toISOString(), routines: S.routines, sessions: S.sessions, profile: S.profile };
  const json = JSON.stringify(data, null, 2);
  const filename = `setnote-backup-${ymd(new Date())}.json`;
  if (isWeb()) {
    /* phones: the share sheet lets people keep the file in Files, Drive or a chat; share must run
       before any await or Safari drops the tap. Chrome only shares some file types, so JSON falls to download. */
    try {
      const file = new File([json], filename, { type: 'application/json' });
      if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: tx('세트노트 백업', 'SetNote backup') });
        toast(tx('백업 파일을 보냈어요', 'Backup file sent'));
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      toast(tx('백업 파일을 저장했어요', 'Backup file saved'));
      return;
    } catch {}
  }
  const dl = await use('downloads');
  if (dl) {
    try { await dl.save({ filename, data: json }); toast(tx('백업 파일을 저장했어요', 'Backup file saved')); return; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') return;
      if (c === 'rate_limited') { toast(tx('잠시 후 다시 눌러 주세요', 'Try again in a moment')); return; }
    }
  }
  pushSheet({ kind: 'exportText', json });
}
function cleanRoutine(r) {
  if (!r || typeof r !== 'object' || typeof r.id !== 'string' || !ID_RE.test(r.id) || !Array.isArray(r.exercises)) return null;
  return {
    id: r.id, name: String(r.name || '루틴').slice(0, 40), note: String(r.note || '').slice(0, 80),
    exercises: r.exercises.filter(e => e && typeof e.exId === 'string' && ID_RE.test(e.exId)).slice(0, 40).map(e => ({ exId: e.exId, sets: clamp(parseInt(e.sets, 10) || 3, 1, 20), reps: String(e.reps ?? '10').slice(0, 10), weight: num(e.weight) })),
    createdAt: Number(r.createdAt) || Date.now(), updatedAt: Number(r.updatedAt) || Date.now(),
  };
}
function cleanSession(s) {
  if (!s || typeof s !== 'object' || typeof s.id !== 'string' || !ID_RE.test(s.id) || !Array.isArray(s.exercises) || !isFinite(Number(s.endedAt))) return null;
  const exs = s.exercises.filter(e => e && typeof e.exId === 'string' && ID_RE.test(e.exId) && Array.isArray(e.sets)).slice(0, 40).map(e => ({
    exId: e.exId, name: String(e.name || exInfo(e.exId).name).slice(0, 40), bw: !!e.bw,
    sets: e.sets.slice(0, 50).map(st => ({ w: num(st && st.w), r: int(st && st.r) || 0 })).filter(st => st.r > 0),
  })).filter(e => e.sets.length);
  if (!exs.length) return null;
  const m = exs.reduce((a, e) => { const k = metric(e.sets); a.vol += k.vol; a.n += e.sets.length; return a; }, { vol: 0, n: 0 });
  const endedAt = Number(s.endedAt);
  const startedAt = isFinite(Number(s.startedAt)) && Number(s.startedAt) <= endedAt ? Number(s.startedAt) : endedAt;
  return { id: s.id, routineId: typeof s.routineId === 'string' && ID_RE.test(s.routineId) ? s.routineId : null, routineName: String(s.routineName || '자유 운동').slice(0, 40), startedAt, endedAt, exercises: exs, volume: Math.round(m.vol * 10) / 10, setCount: m.n };
}
function cleanCustom(c) {
  if (!c || typeof c.id !== 'string' || !ID_RE.test(c.id) || !c.name) return null;
  return { id: c.id, name: String(c.name).slice(0, 40), cat: CATS.includes(c.cat) ? c.cat : '기타', bw: !!c.bw };
}
function readImport(file) {
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { toast(tx('파일이 너무 커요', 'The file is too large')); return; }
  const fr = new FileReader();
  fr.onload = () => {
    let d;
    try { d = JSON.parse(String(fr.result)); } catch { toast(tx('백업 파일을 읽지 못했어요. 세트노트에서 내보낸 JSON 파일인지 확인해 주세요.', 'Couldn’t read the backup. Make sure it’s a JSON file exported from SetNote.'), 3600); return; }
    const rs = (Array.isArray(d && d.routines) ? d.routines : []).map(cleanRoutine).filter(Boolean);
    const ss = (Array.isArray(d && d.sessions) ? d.sessions : []).map(cleanSession).filter(Boolean);
    const cust = (d && d.profile && Array.isArray(d.profile.custom) ? d.profile.custom : []).map(cleanCustom).filter(Boolean);
    if (!rs.length && !ss.length && !cust.length) { toast(tx('가져올 루틴이나 기록이 없어요', 'No routines or records to import')); return; }
    confirmSheet({
      title: tx('백업 가져오기', 'Import backup'),
      msg: tx(`루틴 ${rs.length}개, 운동 기록 ${ss.length}개${cust.length ? `, 직접 만든 운동 ${cust.length}개` : ''}를 가져올까요? 같은 항목이 이미 있으면 백업 내용으로 바뀌어요.`,
        `Import ${pl(rs.length, 'routine')}, ${pl(ss.length, 'workout')}${cust.length ? ', ' + pl(cust.length, 'custom exercise') : ''}? Anything already here with the same ID is replaced by the backup.`),
      ok: tx('가져오기', 'Import'),
      onOk: () => importData(rs, ss, cust),
    });
  };
  fr.onerror = () => toast(tx('파일을 읽지 못했어요', 'Couldn’t read the file'));
  fr.readAsText(file);
}
async function importData(rs, ss, cust) {
  if (cust.length && !profileReady()) return;
  const rIds = new Set(rs.map(r => r.id)), sIds = new Set(ss.map(s => s.id));
  S.routines = sortRoutines([...S.routines.filter(r => !rIds.has(r.id)), ...rs]);
  S.sessions = sortSessions([...S.sessions.filter(s => !sIds.has(s.id)), ...ss]);
  if (cust.length) {
    const have = new Map(prof().custom.map(c => [c.id, c]));
    cust.forEach(c => have.set(c.id, c));
    S.profile = { ...S.profile, custom: [...have.values()] };
  }
  S.sheets = [];
  render();
  if (store.kind === 'local') { await store.saveProfile(); toast(tx('백업을 가져왔어요', 'Backup imported')); return; }
  toast(tx('백업을 저장하는 중…', 'Saving backup…'), 60000);
  let fail = 0, n = 0;
  const total = rs.length + ss.length + (cust.length ? 1 : 0);
  const step = async fn => {
    try { await fn(); } catch { fail++; }
    n++;
    if (n % 15 === 0) toast(`${tx('백업 저장 중…', 'Saving backup…')} ${n}/${total}`, 60000);
    await sleep(60);
  };
  if (cust.length) await step(() => store.saveProfile());
  for (const r of rs) { if (store.kind !== 'cloud') break; await step(() => store.saveRoutine(r)); }
  for (const s of ss) { if (store.kind !== 'cloud') break; await step(() => store.saveSession(s)); }
  if (store.kind === 'local') { await store.saveProfile(); toast(tx('백업을 이 기기에 저장했어요', 'Backup saved on this device')); return; }
  toast(fail ? tx(`${total - fail}개 저장, ${fail}개는 저장하지 못했어요`, `Saved ${total - fail}, couldn’t save ${fail}`) : tx('백업을 모두 가져왔어요', 'Backup fully imported'), 3600);
}

  'copy-export': () => {
    const box = $('#export-box'); if (!box) return;
    const text = box.value;
    const fallback = () => { box.focus(); box.select(); toast(tx('선택된 내용을 복사하세요', 'Copy the selected text')); };
    try {
      navigator.clipboard.writeText(text).then(() => toast(tx('복사했어요', 'Copied')), fallback);
    } catch { fallback(); }
  },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (!fn) return;
  e.preventDefault();
  if (performance.now() - sheetChangedAt < 350) return;
  if (!store && !['tab', 'settings', 'sheet-close', 'sheet-bg', 'ex-cat', 'open-ex', 'open-routine', 'open-session', 'set-theme', 'set-lang', 'install', 'install-hide'].includes(t.dataset.act)) { toast(tx('아직 불러오는 중이에요. 잠시만요.', 'Still loading. One moment.')); return; }
  fn(t.dataset, t, e);
});

const FIELDS = {
  'ex-q': el => { S.exQ = el.value; const l = $('#ex-list'); if (l) l.innerHTML = exListHtml(); },
  'pk-q': el => {
    const p = topSheet(); if (!p || p.kind !== 'picker') return;
    p.q = el.value; p.creating = false;
    const l = $('#pk-list'); if (l) l.innerHTML = pickerListHtml(p);
  },
  w: el => { const ex = findEx(el.dataset.u); if (!ex) return; const st = ex.sets[+el.dataset.i]; if (!st) return; st.w = el.value; touchActive(); refreshPlaceholders(ex); },
  r: el => { const ex = findEx(el.dataset.u); if (!ex) return; const st = ex.sets[+el.dataset.i]; if (!st) return; st.r = el.value; touchActive(); refreshPlaceholders(ex); },
  'ed-name': el => { const ed = topSheet(); if (ed && ed.kind === 'editor') ed.draft.name = el.value; },
  'ed-note': el => { const ed = topSheet(); if (ed && ed.kind === 'editor') ed.draft.note = el.value; },
  'ed-reps': el => { const ed = topSheet(); const e = ed && ed.kind === 'editor' && ed.draft.exercises[+el.dataset.i]; if (e) e.reps = el.value; },
  'ed-w': el => { const ed = topSheet(); const e = ed && ed.kind === 'editor' && ed.draft.exercises[+el.dataset.i]; if (e) e.weight = el.value; },
};
document.addEventListener('input', e => {
  const el = e.target;
  const f = el.dataset && el.dataset.field;
  if (f && FIELDS[f]) FIELDS[f](el);
});
/* a completed set keeps a valid value: blank or bad edits revert to what was checked */
document.addEventListener('focusout', e => {
  if (rendering) return;
  const el = e.target, f = el.dataset && el.dataset.field;
  if (f !== 'w' && f !== 'r') return;
  const ex = findEx(el.dataset.u), st = ex && ex.sets[+el.dataset.i];
  if (!st || !st.done) return;
  const okW = v => (String(v ?? '').trim() === '' ? !!ex.bw : num(v) != null);
  const bad = f === 'r' ? !(int(st.r) > 0) : !okW(st.w);
  if (bad) {
    if (f === 'r' && int(st.cr) > 0) st.r = st.cr;
    else if (f === 'w' && st.cw != null && okW(st.cw)) st.w = st.cw;
    else st.done = false;
    toast(st.done ? tx('빈 값은 저장할 수 없어서 원래 값으로 되돌렸어요', 'A set can’t be saved empty, so it went back to its value') : tx('값이 비어 있어서 체크를 해제했어요', 'The value was empty, so the set was unchecked'));
  } else if (f === 'w') { st.w = String(st.w).trim() === '' ? '' : fmtW(num(st.w)); st.cw = st.w; }
  else { st.r = String(int(st.r)); st.cr = st.r; }
  el.value = f === 'r' ? st.r : st.w;
  touchActive();
  setTimeout(() => { if (isTyping()) pendingRender = true; else scheduleRender(); }, 0);
});
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'imp-file') { readImport(e.target.files && e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && (el.dataset.field === 'w' || el.dataset.field === 'r')) {
    e.preventDefault();
    if (el.dataset.field === 'w') focusField('r', el.dataset.u, el.dataset.i);
    else {
      const ex = findEx(el.dataset.u), st = ex && ex.sets[+el.dataset.i];
      el.blur();
      if (st && !st.done) checkSet(el.dataset.u, +el.dataset.i);
    }
    return;
  }
  if (e.key === 'Enter' && el.dataset && el.dataset.field === 'pk-q') { e.preventDefault(); el.blur(); return; }
  if (e.key === 'Escape' && S.sheets.length) { e.preventDefault(); popSheet(); }
});

applyTheme();
boot();
})();
</script>
