<!doctype html>
<!-- 공유 사진(og.png, og-en.png) 원본. 디자인이 바뀌어도 쓸 수 있게 사이트 CSS를 쓰지 않는다.
     다시 찍기: python3 sci-calc/_dev/og.py  (?lang=en 이면 영어판) -->
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:500;src:url(FONTDIR/Pretendard-Medium.woff2)}
@font-face{font-family:P;font-weight:700;src:url(FONTDIR/Pretendard-Bold.woff2)}
@font-face{font-family:P;font-weight:800;src:url(FONTDIR/Pretendard-ExtraBold.woff2)}
html,body{margin:0;width:1200px;height:630px;background:#f7f7fc;color:#15132b;font-family:P,sans-serif}
.card{box-sizing:border-box;width:1200px;height:630px;padding:70px 80px;display:grid;grid-template-columns:1fr 380px;gap:48px;align-items:center}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;margin:0 0 34px}
.brand svg{width:46px;height:46px}
h1{font-size:58px;line-height:1.22;letter-spacing:-.03em;font-weight:800;margin:0}
h1 em{font-style:normal;color:#5b3df5}
.sub{font-size:25px;font-weight:500;color:#4c4870;margin:26px 0 0;line-height:1.45}
.url{font-size:23px;font-weight:700;color:#66638a;margin:30px 0 0}
.screen{background:#1c1a33;color:#f3f1ff;border-radius:28px;padding:40px 36px;box-shadow:0 18px 40px rgba(28,26,51,.28)}
.expr{font-size:34px;color:#b9b3e6;font-family:"Times New Roman",serif;font-style:italic;margin:0 0 26px}
.ans{display:flex;align-items:center;justify-content:flex-end;gap:16px;font-size:62px;font-family:"Times New Roman",serif}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05}
.frac b{font-weight:400;padding:0 8px}
.frac b:first-child{border-bottom:3px solid #f3f1ff;padding-bottom:6px}
.frac b:last-child{padding-top:6px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}
.keys span{height:44px;border-radius:12px;background:#2b2848;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#d9d4ff}
.keys span.eq{background:#5b3df5;color:#fff}
</style></head><body>
<div class="card"><div>
<p class="brand"><svg viewBox="0 0 32 32"><rect x="3" y="2" width="26" height="28" rx="7" fill="#5b3df5"/><rect x="7.5" y="6.5" width="17" height="7" rx="2" fill="#fff"/><g fill="#fff"><circle cx="10.5" cy="19" r="2"/><circle cx="16" cy="19" r="2"/><circle cx="21.5" cy="19" r="2"/><circle cx="10.5" cy="25" r="2"/><circle cx="16" cy="25" r="2"/></g><rect x="19.5" y="23" width="4" height="4" rx="1.2" fill="#ffb020"/></svg><span data-ko="공학용 계산기" data-en="Scientific Calculator"></span></p>
<h1 data-ko="분수·루트가<br><em>교과서처럼</em> 보이는<br>무료 공학용 계산기" data-en="Fractions and roots,<br>shown <em>like a textbook</em>"></h1>
<p class="sub" data-ko="삼각함수 · 로그 · 적분 · 방정식 · 행렬 · 통계" data-en="Trig · Logs · Integrals · Equations · Matrices"></p>
<p class="url">calc.lumenlab.page</p>
</div>
<div class="screen"><p class="expr">sin(45°)</p>
<div class="ans">= <span class="frac"><b>√2</b><b>2</b></span></div>
<div class="keys"><span>sin</span><span>√</span><span>x²</span><span>log</span><span>π</span><span>a/b</span><span>∫</span><span class="eq">=</span></div></div>
</div>
<script>var en=location.search.indexOf('lang=en')>=0;if(en)document.documentElement.lang='en';document.querySelectorAll('[data-ko]').forEach(function(e){e.innerHTML=en?e.dataset.en:e.dataset.ko})</script>
</body></html>
