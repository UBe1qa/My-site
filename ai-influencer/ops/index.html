<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운영 · 대시보드 | AI.Influence</title>
<meta name="description" content="AI 인플루언서 캐릭터 여러 명의 팔로워·참여율·수익을 같은 기준으로 비교하는 운영 대시보드.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .dash{display:grid;gap:16px}
  .dash>*,.row2>*,.row2b>*,.kpis>*{min-width:0}
  /* switcher */
  .switch{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:20px;padding-bottom:2px}
  .switch::-webkit-scrollbar{display:none}
  .sw{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;border:1px solid var(--line2);background:var(--card);font-size:14px;transition:.2s}
  .sw:hover{border-color:var(--muted)}
  .sw.on{border-color:var(--accent);background:rgba(255,92,138,.1)}
  .sw .av{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--card2);display:grid;place-items:center;font-size:15px}
  .sw small{font-size:11px;color:var(--dim)}
  .sw .cdot{width:8px;height:8px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 12px;position:relative;overflow:hidden}
  .kpi .lb{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
  .kpi .v{font-size:32px;font-weight:900;letter-spacing:-1px;margin:4px 0 2px;line-height:1.15}
  .kpi .d{font-size:12.5px;color:var(--muted)}
  .kpi .d b{color:var(--ok)}.kpi .d b.dn{color:var(--bad)}
  .kpi svg{display:block;width:100%;height:34px;margin-top:8px}
  @media(max-width:480px){.kpi .v{font-size:25px}.kpi{padding:14px 14px 10px}}
  .row2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  .row2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.row2,.row2b{grid-template-columns:1fr}}
  .card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

  /* leaderboard */
  .lb-head,.lbr{display:grid;grid-template-columns:minmax(150px,1.3fr) 90px 70px minmax(180px,2fr) 110px 90px;gap:14px;align-items:center}
  .lb-head{font-size:12px;color:var(--dim);padding:0 10px 8px;border-bottom:1px solid var(--line)}
  .lb-head .num,.lbr .num{text-align:right}
  .lbr{padding:12px 10px;border-bottom:1px dashed var(--line);border-radius:10px;cursor:pointer;transition:background .15s;font-size:14px}
  .lbr:hover{background:var(--bg)}
  .lbr:last-child{border-bottom:0}
  .lbr .who{display:flex;align-items:center;gap:10px;min-width:0}
  .lbr .who .av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid var(--c)}
  .lbr .who b{display:block;font-size:14.5px}
  .lbr .num b{font-size:16px}
  .lbr .up{color:var(--ok);font-size:13px}
  .etrack{position:relative;height:22px}
  .etrack .rail{position:absolute;left:0;right:44px;top:8px;height:6px;border-radius:3px;background:#23233a}
  .etrack .fill{position:absolute;left:0;top:8px;height:6px;border-radius:3px;background:var(--c);width:0;transition:width 1s ease;max-width:calc(100% - 44px)}
  .etrack .tk{position:absolute;top:2px;bottom:2px;width:0;border-left:1.5px dashed}
  .etrack .tk.w{border-color:rgba(255,181,71,.7)}.etrack .tk.g{border-color:rgba(61,220,151,.8)}
  .etrack .v{position:absolute;right:0;top:0;font-weight:900;font-size:13.5px}
  .vchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid}
  .vchip.go{color:var(--ok);border-color:rgba(61,220,151,.45)}
  .vchip.watch{color:var(--warn);border-color:rgba(255,181,71,.45)}
  .vchip.stop{color:#ff9d9d;border-color:rgba(255,107,107,.45)}
  .lb-foot{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:10px}
  .lb-foot span{display:inline-flex;align-items:center;gap:6px}
  .lb-foot i{width:0;height:12px;border-left:1.5px dashed}
  @media(max-width:760px){
    .lb-head{display:none}
    .lbr{grid-template-columns:1fr auto;grid-template-areas:"who vd" "et et" "fo mo";gap:8px 12px}
    .lbr .who{grid-area:who}.lbr .vd{grid-area:vd}.lbr .et{grid-area:et}.lbr .fo{grid-area:fo;text-align:left}.lbr .mo{grid-area:mo}.lbr .dl{display:none}
  }

  /* charts */
  .chart{position:relative;width:100%}
  .chart svg{display:block;width:100%}
  .chart .axis{fill:var(--dim);font-size:11.5px;font-family:inherit}
  .chart .grid{stroke:#23233a;stroke-width:1}
  .chart .ev{stroke:var(--warn);stroke-dasharray:4 4;stroke-width:1.2;opacity:.7}
  .chart .evl{fill:var(--warn);font-size:11.5px;font-weight:700;font-family:inherit}
  .chart .avg{stroke:var(--muted);stroke-dasharray:5 5;stroke-width:1.2}
  .chart .avgl{fill:var(--muted);font-size:11.5px;font-family:inherit}
  .chart .xh{stroke:var(--line2);stroke-width:1}
  .chart .hit{fill:transparent;cursor:pointer}
  .chart .lbl{font-size:12.5px;font-weight:900;font-family:inherit;fill:var(--text)}
  .tip .row{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tip .row b{display:inline;margin:0 0 0 auto;padding-left:10px}

  .ins{display:grid;gap:10px}
  .in{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
  .in .e{font-size:20px;line-height:1.3}
  .in small{display:block;color:var(--muted);font-size:12px}
  .in b{color:var(--text)}

  .money .ln{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .money .ln small{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .money .ln .amt{font-weight:900;font-size:16px;text-align:right}
  .money .ln .mbar{grid-column:1/-1;height:6px;border-radius:3px;background:#23233a;overflow:hidden}
  .money .ln .mbar i{display:block;height:100%;border-radius:3px}
  .money .ln.exp .amt{color:var(--bad)}
  .money .net{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:14px 16px;border-radius:12px;background:rgba(61,220,151,.08);border:1px solid rgba(61,220,151,.3)}
  .money .net b{font-size:26px;font-weight:900;color:var(--ok)}

  .week{display:grid;gap:6px}
  .day{border-radius:10px;background:var(--bg);border:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;font-size:13.5px}
  .day .dn{font-weight:900;font-size:13px;color:var(--muted);min-width:18px}
  .day .who{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap}
  .day .tt{font-weight:500;min-width:0}
  .day .ty{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:1px 7px;white-space:nowrap}
  .day .st{font-size:11.5px;font-weight:700;white-space:nowrap}
  .day.done{border-color:rgba(61,220,151,.4)}.day.done .st{color:var(--ok)}
  .day.ready .st{color:#8fd3ff}.day.draft .st{color:var(--warn)}.day.todo .st{color:var(--muted)}
  @media(max-width:520px){.day{flex-wrap:wrap}.day .ty{margin-left:0}}

  .tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
  th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--card2);color:var(--muted);font-weight:500;font-size:12.5px;cursor:pointer;user-select:none}
  th:hover{color:var(--text)}
  th.on{color:var(--accent)}
  th.l,td.l{text-align:left}
  td.t{white-space:normal;min-width:200px}
  tr:last-child td{border-bottom:0}
  tr.top td{background:rgba(255,92,138,.06)}
  td .rt{font-weight:900}
  tr.top .rt{color:var(--accent)}
  .typ{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
  .who-c{display:inline-flex;align-items:center;gap:6px}
  .toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toprow a{font-size:13px;color:var(--accent);font-weight:700;margin-left:auto}
</style>
</head>
<body data-chapter="ops">
<nav id="topnav"></nav>
<div class="subnav"><div class="wrap" id="subnav"></div></div>

<header class="page-head">
  <div class="wrap">
    <div class="crumb"><a href="/">홈</a>›<b>03 운영</b></div>
    <h1>운영 <span class="grad">대시보드</span></h1>
    <p class="lead">캐릭터 여러 명을 같은 기준으로 비교하고, 한 명씩 들어가서 자세히 봐요.</p>
    <div class="switch" id="switch" role="tablist" aria-label="캐릭터 선택"></div>
  </div>
</header>

<div class="wrap dash" id="dash" style="padding-bottom:72px"></div>

<footer id="foot"></footer>

<script src="/characters/data.js"></script>
<script src="/ops/data.js"></script>
<script src="/ops/metrics.js"></script>
<script src="/assets/common.js"></script>
<script>
const O=OPS,W=M.W,ALL='all';
let view=new URLSearchParams(location.search).get('c')||ALL;
if(view!==ALL&&!O.chars[view])view=ALL;
const nameOf=id=>id===ALL?'공용':(charById(id)||{name:id}).name;
const colorOf=id=>(charById(id)||{}).color||'#9a9ab0';
const dot=id=>`<span class="cdot" style="background:${colorOf(id)}"></span>`;
const STI={done:'✅ 완료',ready:'🟢 준비',draft:'✏️ 초안',todo:'⏳ 할 일'};

/* ---------- switcher ---------- */
function switcher(){
  const el=document.getElementById('switch');
  el.innerHTML=`<button class="sw ${view===ALL?'on':''}" data-c="${ALL}" role="tab" aria-selected="${view===ALL}"><span class="av">👥</span><span>전체<br><small>${M.ids.length}명 비교</small></span></button>`+
    M.ids.map(id=>{const c=charById(id);return `<button class="sw ${view===id?'on':''}" data-c="${id}" role="tab" aria-selected="${view===id}"><span class="av">${avatar(AV[id])}</span><span>${c.name}<br><small>${stageOf(c.stage).ic} ${stageOf(c.stage).label}</small></span></button>`;}).join('');
}
document.getElementById('switch').addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b)return;setView(b.dataset.c);});
function setView(v){view=v;const u=new URL(location);if(v===ALL)u.searchParams.delete('c');else u.searchParams.set('c',v);history.replaceState(null,'',u);switcher();render();}

/* ---------- helpers ---------- */
function spark(vals,col){vals=vals.filter(v=>v!=null);if(vals.length<2)vals=[vals[0]||0,vals[0]||0];const w=200,h=34,mx=Math.max(...vals),mn=Math.min(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-4-(v-mn)/r*(h-8)]);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;}
function niceMax(v){const s=[100,200,250,500,1000,2000,2500,5000,10000,20000,50000,100000];for(const x of s){if(v<=x*4)return Math.ceil(v/x)*x;}return v;}
const demoTag=O.demo?'<span class="pill demo" style="padding:1px 7px;font-size:10.5px">샘플</span>':'';
const weekSum=i=>M.all.reduce((s,c)=>s+(c.followers[i]||0),0);

/* ---------- line chart (1+ series) ---------- */
function lineChart(el,series,events){
  const w=el.clientWidth,h=w<500?230:320,l=46,r=w<500?64:96,t=26,b=30;
  const ymax=niceMax(Math.max(...series.flatMap(s=>s.v.filter(x=>x!=null)))*1.1),iw=w-l-r,ih=h-t-b;
  const X=i=>l+i/(W-1)*iw,Y=v=>t+ih-v/ymax*ih;
  const single=series.length===1;
  let s=`<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="주차별 팔로워: ${series.map(se=>se.name+' '+se.v.filter(x=>x!=null).slice(-1)[0]).join(', ')}">`;
  [0,ymax/3,ymax*2/3,ymax].map(Math.round).forEach(v=>{s+=`<line class="grid" x1="${l}" x2="${l+iw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${l-8}" y="${Y(v)+4}" text-anchor="end">${fmt.n(v)}</text>`;});
  O.weeks.forEach((wk,i)=>{if(w<420&&i%2)return;s+=`<text class="axis" x="${X(i)}" y="${h-8}" text-anchor="middle">${wk}</text>`;});
  (events||[]).forEach(e=>{const x=X(e.w-1);s+=`<line class="ev" x1="${x}" x2="${x}" y1="${t}" y2="${t+ih}"/><text class="evl" x="${x-4}" y="${t-8}" text-anchor="end">${e.label}</text>`;});
  const ends=[];
  series.forEach(se=>{
    const pts=se.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;
    const d='M'+pts.map(p=>p.join(',')).join('L');
    if(single)s+=`<path d="${d}L${pts[pts.length-1][0]},${t+ih}L${pts[0][0]},${t+ih}Z" fill="${se.color}" opacity=".14"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lp=pts[pts.length-1];s+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="${se.color}" stroke="var(--card)" stroke-width="2"/>`;
    ends.push({x:lp[0],y:lp[1],txt:(single?'':se.name+' ')+fmt.n(se.v.filter(x=>x!=null).slice(-1)[0]),color:se.color});
  });
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<16)ends[i].y=ends[i-1].y+16;
  ends.forEach(e=>{s+=`<text class="lbl" x="${e.x+9}" y="${e.y+4}">${w<500&&!single?e.txt.split(' ').pop():e.txt}</text>`;});
  s+=`<line class="xh" x1="0" x2="0" y1="${t}" y2="${t+ih}" style="display:none"/>`;
  for(let i=0;i<W;i++){const x0=i?(X(i-1)+X(i))/2:l,x1=i<W-1?(X(i)+X(i+1))/2:l+iw;s+=`<rect class="hit" data-i="${i}" x="${x0}" y="${t}" width="${x1-x0}" height="${ih}"/>`;}
  s+='</svg><div class="tip"></div>';
  el.innerHTML=s;
  const tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
  el.querySelectorAll('.hit').forEach(rc=>{const i=+rc.dataset.i;
    const show=()=>{const x=X(i);xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.style.display='';
      const rows=series.filter(se=>se.v[i]!=null).sort((a,b)=>b.v[i]-a.v[i]);
      const ev=(events||[]).find(e=>e.w===i+1);
      tip.innerHTML=`<b>${O.weeks[i]}차</b>${rows.length?rows.map(se=>`<div class="row"><span class="cdot" style="background:${se.color}"></span>${se.name}<b>${fmt.n(se.v[i])}</b></div>`).join(''):'아직 시작 전'}${ev?`<div style="margin-top:4px">📍 ${ev.label}</div>`:''}`;
      tip.style.left=Math.min(w-180,Math.max(0,x+12))+'px';tip.style.top=t+'px';tip.classList.add('show');};
    rc.addEventListener('mouseenter',show);rc.addEventListener('click',show);
    rc.addEventListener('mouseleave',()=>{tip.classList.remove('show');xh.style.display='none';});});
}

/* ---------- per-post bar chart ---------- */
function barChart(el,posts,color){
  const w=el.clientWidth,h=w<500?200:240,l=40,r=10,t=18,b=28,iw=w-l-r,ih=h-t-b,n=posts.length,gap=2,bw=Math.max(4,iw/n-gap);
  const mx=Math.max(.05,Math.ceil(Math.max(...posts.map(p=>p.eng))*100/5)*5/100),X=i=>l+i*(iw/n)+gap/2,Y=v=>t+ih-v/mx*ih,avg=M.avg(posts);
  const top=[...posts].sort((a,b)=>b.eng-a.eng).slice(0,3).map(p=>p.n);
  let s=`<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="게시물별 참여율, 평균 ${fmt.pct(avg)}">`;
  [0,mx/2,mx].forEach(v=>{s+=`<line class="grid" x1="${l}" x2="${w-r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${l-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`;});
  posts.forEach((p,i)=>{const x=X(i),y=Y(p.eng),hh=t+ih-y,rr=Math.min(4,bw/2,hh);
    s+=`<path class="bb" data-i="${i}" style="cursor:pointer" d="M${x},${t+ih}V${y+rr}Q${x},${y} ${x+rr},${y}H${x+bw-rr}Q${x+bw},${y} ${x+bw},${y+rr}V${t+ih}Z" fill="${top.includes(p.n)?color:'#4a4a66'}"/>`;
    if(w>=500||i%2===0)s+=`<text class="axis" x="${x+bw/2}" y="${h-10}" text-anchor="middle">${p.n}</text>`;});
  s+=`<line class="avg" x1="${l}" x2="${w-r}" y1="${Y(avg)}" y2="${Y(avg)}"/><text class="avgl" x="${l+6}" y="${Y(avg)-6}">평균 ${fmt.pct(avg)}</text></svg><div class="tip"></div>`;
  el.innerHTML=s;const tip=el.querySelector('.tip');
  el.querySelectorAll('.bb').forEach(b=>{const p=posts[+b.dataset.i];
    const show=()=>{tip.innerHTML=`<b>#${p.n} ${p.title}</b>${p.w}주차 · ${p.type}<br>조회 ${fmt.n(p.views)} · 참여율 <b style="display:inline;color:var(--accent)">${fmt.pct(p.eng)}</b>`;
      tip.style.left=Math.min(w-230,Math.max(0,X(+b.dataset.i)-100))+'px';tip.style.top=Math.max(0,Y(p.eng)-90)+'px';tip.classList.add('show');b.style.filter='brightness(1.3)';};
    b.addEventListener('mouseenter',show);b.addEventListener('click',show);b.addEventListener('mouseleave',()=>{tip.classList.remove('show');b.style.filter='';});});
}

/* ---------- blocks ---------- */
function kpis(list){return `<div class="kpis reveal" id="kpi">${list.map(k=>`<div class="kpi"><div class="lb">${k.lb}${demoTag}</div><div class="v">${k.v}</div><div class="d">${k.d}</div>${k.s?spark(k.s,k.col||'#ff5c8a'):''}</div>`).join('')}</div>`;}
function moneyBlock(ids){
  const inc=O.money.income.filter(x=>ids.includes(x.c)),exp=O.money.expense.filter(x=>view===ALL||ids.includes(x.c)||x.c==='all');
  const mx=Math.max(1,...inc.map(x=>x.amount),...exp.map(x=>x.amount));
  const ti=inc.reduce((s,x)=>s+x.amount,0),te=view===ALL?M.expense:0;
  const row=(x,e)=>`<div class="ln ${e?'exp':''}"><div>${x.src}<small>${x.c==='all'?'👥 공용':dot(x.c)+nameOf(x.c)} · ${x.note}</small></div><div class="amt">${e?'−':'+'}${fmt.won(x.amount)}</div><div class="mbar"><i style="width:${x.amount/mx*100}%;background:${e?'#6b3b48':x.c==='all'?'var(--grad)':colorOf(x.c)}"></i></div></div>`;
  const net=view===ALL?`<div class="net"><span>누적 순이익 (공용 비용 포함)</span><b>${M.net>=0?'+':''}${fmt.won(M.net)}</b></div>`
    :`<div class="net"><span>${nameOf(view)} 수입</span><b>+${fmt.won(ti)}</b></div><p class="note">공용 비용(도구 구독 등)은 '전체' 화면에서 합산해요.</p>`;
  return `<div class="card money reveal" id="money"><h3>수익</h3><p class="cap">${view===ALL?'캐릭터별 수입과 공용 지출':'이 캐릭터의 수입'}</p><div style="margin-top:6px">${inc.map(x=>row(x,0)).join('')||'<p class="note">아직 수입 없음</p>'}${view===ALL?O.money.expense.map(x=>row(x,1)).join(''):''}</div>${net}</div>`;
}
function schedBlock(){
  const items=O.schedule.filter(x=>view===ALL||x.c===view||x.c==='all');
  return `<div class="card reveal" id="plan"><h3>이번 주 업로드 계획</h3><p class="cap">✅ 완료 · 🟢 준비 · ✏️ 초안 · ⏳ 할 일</p><div class="week" style="margin-top:12px">${items.map(d=>`<div class="day ${d.st}"><span class="dn">${d.d}</span>${view===ALL?`<span class="who">${d.c==='all'?'👥':dot(d.c)} ${nameOf(d.c)}</span>`:''}<span class="tt">${d.t}</span><span class="st">${STI[d.st]}</span><span class="ty">${d.type}</span></div>`).join('')}</div></div>`;
}
let sortK='w',sortDir=-1;
function tableBlock(){return `<div class="card reveal" id="log"><div class="hd"><div><h3>게시물 전체 기록</h3><p class="cap">열 제목을 누르면 정렬돼요 · 분홍 줄은 참여율 상위 3개</p></div></div><div class="tbl-wrap"><table id="tbl"></table></div></div>`;}
function table(posts){
  const top=[...posts].sort((a,b)=>b.eng-a.eng).slice(0,3);
  const COLS=[...(view===ALL?[['c','캐릭터','l']]:[]),['n','#','l'],['title','제목','l'],['w','주차'],['type','형식','l'],['views','조회'],['likes','좋아요'],['comments','댓글'],['saves','저장'],['shares','공유'],['eng','참여율']];
  const arr=[...posts].sort((a,b)=>{const A=sortK==='c'?nameOf(a.c):a[sortK],B=sortK==='c'?nameOf(b.c):b[sortK];return (A>B?1:A<B?-1:0)*sortDir||(b.w-a.w);});
  const el=document.getElementById('tbl');
  el.innerHTML=`<thead><tr>${COLS.map(([k,lb,cl])=>`<th data-k="${k}" class="${cl||''} ${k===sortK?'on':''}">${lb}${k===sortK?(sortDir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead>
  <tbody>${arr.map(p=>`<tr class="${top.includes(p)?'top':''}">${view===ALL?`<td class="l"><span class="who-c">${dot(p.c)}${nameOf(p.c)}</span></td>`:''}<td class="l">${p.n}</td><td class="l t">${p.title}</td><td>${p.w}주</td><td class="l"><span class="typ">${p.type}</span></td><td>${fmt.n(p.views)}</td><td>${fmt.n(p.likes)}</td><td>${fmt.n(p.comments)}</td><td>${fmt.n(p.saves)}</td><td>${fmt.n(p.shares)}</td><td class="rt">${fmt.pct(p.eng)}</td></tr>`).join('')}</tbody>`;
  el.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.k;if(k===sortK)sortDir*=-1;else{sortK=k;sortDir=['c','title','type','n'].includes(k)?1:-1;}table(posts);}));
}

/* ---------- views ---------- */
function renderAll(){
  const cs=M.all,dF=weekSum(W-1)-weekSum(W-2);
  const counts={go:0,watch:0,stop:0};cs.forEach(c=>counts[c.verdict.k]++);
  const recent=M.allPosts.filter(p=>p.w>W-4),prev=M.allPosts.filter(p=>p.w<=W-4);
  const best=[...M.allPosts].sort((a,b)=>b.eng-a.eng)[0];
  const fastest=[...cs].sort((a,b)=>b.delta/(b.latest-b.delta||1)-a.delta/(a.latest-a.delta||1))[0];
  const scaleF=Math.max(...cs.map(c=>c.latest));
  document.getElementById('dash').innerHTML=`
  ${O.demo?`<div class="demo-banner reveal"><span>🧪</span><div><b>지금 보이는 숫자는 샘플(더미) 데이터예요.</b> 하나 쌤을 8주, 하도윤을 4주, 복단 여사를 3주 운영했다고 가정한 예시예요. 실제 운영을 시작하면 진짜 숫자로 바뀌어요.</div></div>`:''}
  ${kpis([
    {lb:'총 팔로워',v:fmt.n(M.totalFollowers),d:`이번 주 <b>+${fmt.n(dF)}</b> · ${cs.length}명 합계`,s:O.weeks.map((_,i)=>weekSum(i))},
    {lb:'운영 중인 캐릭터',v:cs.length+'명',d:`🟢 계속 ${counts.go} · 🟡 지켜보기 ${counts.watch} · 🔴 보류 후보 ${counts.stop}`},
    {lb:'평균 참여율 (최근 4주)',v:fmt.pct(M.avg(recent)),d:`이전 ${fmt.pct(M.avg(prev))} → <b class="${M.avg(recent)>=M.avg(prev)?'':'dn'}">${M.avg(recent)>=M.avg(prev)?'▲':'▼'} ${(Math.abs(M.avg(recent)-M.avg(prev))*100).toFixed(1)}%p</b>`},
    {lb:'누적 순이익',v:fmt.won(M.net),d:`수입 ${fmt.won(M.income)} − 지출 ${fmt.won(M.expense)}`}
  ])}
  <div class="card reveal" id="compare">
    <div class="hd"><div><h3>캐릭터 비교</h3><p class="cap">같은 기준으로 줄 세우기 · 줄을 누르면 그 캐릭터 화면으로 가요</p></div></div>
    <div class="lb-head"><span>캐릭터</span><span class="num">팔로워</span><span class="num">이번 주</span><span>최근 4주 참여율</span><span>판정</span><span class="num">수익</span></div>
    ${[...cs].sort((a,b)=>b.avgEng-a.avgEng).map(m=>{const c=charById(m.id);return `<div class="lbr" data-c="${m.id}" style="--c:${c.color}" tabindex="0" role="button" aria-label="${c.name} 자세히">
      <div class="who"><span class="av">${avatar(AV[m.id])}</span><div><b>${c.name}</b><span class="stg ${c.stage}" style="margin-top:2px">${stageOf(c.stage).ic} ${stageOf(c.stage).label} · ${m.weeksRun}주째</span></div></div>
      <div class="num fo"><b>${fmt.n(m.latest)}</b></div>
      <div class="num dl"><span class="up">+${fmt.n(m.delta)}</span></div>
      <div class="et"><div class="etrack"><span class="rail"></span><span class="tk w" style="left:calc((100% - 44px)*.35)"></span><span class="tk g" style="left:calc((100% - 44px)*.5)"></span><span class="fill" data-w="${Math.min(1,m.avgEng/.2)}"></span><span class="v">${fmt.pct(m.avgEng)}</span></div></div>
      <div class="vd"><span class="vchip ${m.verdict.k}">${m.verdict.ic} ${m.verdict.label}</span></div>
      <div class="num mo">${fmt.won(m.income)}</div></div>`;}).join('')}
    <div class="lb-foot"><span><i style="border-color:rgba(255,181,71,.7)"></i>7% 보류선</span><span><i style="border-color:rgba(61,220,151,.8)"></i>10% 합격선</span><span>막대 끝 = 20%</span></div>
  </div>
  <div class="row2" id="growth">
    <div class="card reveal"><div class="hd"><div><h3>팔로워 추이</h3><p class="cap">캐릭터별 주차 팔로워 · 그래프 위에 마우스를 올리면 숫자가 보여요</p></div>
      <div class="legend">${cs.map(m=>`<span><i style="background:${charById(m.id).color}"></i>${charById(m.id).name}</span>`).join('')}</div></div>
      <div class="chart" id="lineChart"></div></div>
    <div class="card reveal"><h3>이번 주 한눈에</h3><p class="cap">데이터에서 자동으로 뽑은 요약</p><div class="ins" style="margin-top:12px">
      <div class="in"><span class="e">📈</span><div><small>가장 빨리 크는 캐릭터</small><b>${charById(fastest.id).name}</b> · 이번 주 +${fmt.n(fastest.delta)}명 (${fmt.pct(fastest.delta/(fastest.latest-fastest.delta||1))})</div></div>
      <div class="in"><span class="e">🏆</span><div><small>이번 달 최고 게시물</small><b>${nameOf(best.c)} · ${best.title}</b><br>참여율 ${fmt.pct(best.eng)}</div></div>
      <div class="in"><span class="e">⚖️</span><div><small>판정</small>${cs.map(m=>`${m.verdict.ic} ${charById(m.id).name}`).join(' · ')}</div></div>
      <div class="in"><span class="e">👉</span><div><small>다음 액션</small>${cs.filter(m=>m.verdict.k==='stop').map(m=>charById(m.id).name).join(', ')||'없음'} 포맷 바꿔 2주 더 · 합격한 테스트 캐릭터는 집중 운영으로</div></div>
    </div></div>
  </div>
  <div class="row2b">${moneyBlock(M.ids)}${schedBlock()}</div>
  ${tableBlock()}
  <a class="next reveal" href="/reports/" style="margin-top:20px"><div><small>다음 챕터</small><b>04 리포트 — 주간 회고와 분석</b></div><span class="arr">→</span></a>`;
  lineChart(document.getElementById('lineChart'),cs.map(m=>({name:charById(m.id).name,color:charById(m.id).color,v:m.followers})),[]);
  table(M.allPosts);
  document.querySelectorAll('.lbr').forEach(r=>{const go=()=>{setView(r.dataset.c);scrollTo({top:0,behavior:'smooth'});};r.addEventListener('click',go);r.addEventListener('keydown',e=>{if(e.key==='Enter')go();});});
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.etrack .fill').forEach(f=>f.style.width=`calc((100% - 44px)*${f.dataset.w})`)));
}
function renderOne(id){
  const c=charById(id),m=M.char(id),posts=m.posts,W4=posts.filter(p=>p.w>W-4),P4=posts.filter(p=>p.w<=W-4);
  const reels=posts.filter(p=>p.type==='릴스'),cars=posts.filter(p=>p.type==='캐러셀');
  const sr=a=>a.length?a.reduce((s,p)=>s+p.saves,0)/a.reduce((s,p)=>s+p.views,0):0;
  const perWeek=O.weeks.map((_,i)=>posts.filter(p=>p.w===i+1).length);
  document.getElementById('dash').innerHTML=`
  ${O.demo?`<div class="demo-banner reveal"><span>🧪</span><div><b>샘플(더미) 데이터예요.</b> ${josa(c.name,'을','를')} ${m.weeksRun}주 운영했다고 가정한 예시예요.</div></div>`:''}
  <div class="toprow reveal"><span class="stg ${c.stage}">${stageOf(c.stage).ic} ${stageOf(c.stage).label}</span><span class="vchip ${m.verdict.k}">${m.verdict.ic} 판정: ${m.verdict.label}</span><span style="font-size:13px;color:var(--muted)">${m.start}주차 시작 · ${m.weeksRun}주째</span><a href="/characters/profile/?id=${id}">캐릭터 설정표 보기 →</a></div>
  ${kpis([
    {lb:'팔로워',v:fmt.n(m.latest),d:`지난주보다 <b>+${fmt.n(m.delta)}</b>`,s:m.followers,col:c.color},
    {lb:'게시물',v:posts.length+'개',d:`이번 주 <b>+${perWeek[W-1]}</b>개`,s:perWeek.map((_,i)=>perWeek.slice(0,i+1).reduce((a,b)=>a+b,0)),col:c.color},
    {lb:'최근 4주 참여율',v:fmt.pct(m.avgEng),d:P4.length?`이전 ${fmt.pct(M.avg(P4))} → <b class="${m.avgEng>=M.avg(P4)?'':'dn'}">${m.avgEng>=M.avg(P4)?'▲':'▼'} ${(Math.abs(m.avgEng-M.avg(P4))*100).toFixed(1)}%p</b>`:'시작한 지 4주 이내'},
    {lb:'수입',v:fmt.won(m.income),d:m.income?'누적':'아직 수입 없음'}
  ])}
  <div class="row2" id="growth">
    <div class="card reveal"><div class="hd"><div><h3>팔로워 추이</h3><p class="cap">주차별 팔로워 수 · 그래프 위에 마우스를 올리면 숫자가 보여요</p></div></div><div class="chart" id="lineChart"></div></div>
    <div class="card reveal"><h3>이번 주 한눈에</h3><p class="cap">데이터에서 자동으로 뽑은 요약</p><div class="ins" style="margin-top:12px">
      <div class="in"><span class="e">📈</span><div><small>팔로워 성장</small>이번 주 <b>+${fmt.n(m.delta)}명</b> (${fmt.pct(m.delta/(m.latest-m.delta||1))} 증가)</div></div>
      <div class="in"><span class="e">🏆</span><div><small>최고 게시물</small><b>#${m.best.n} ${m.best.title}</b><br>조회 ${fmt.k(m.best.views)} · 참여율 ${fmt.pct(m.best.eng)}</div></div>
      <div class="in"><span class="e">🔖</span><div><small>형식 비교</small>릴스 참여율 <b>${fmt.pct(M.avg(reels))}</b>${cars.length?` · 캐러셀 저장률 <b>${fmt.pct(sr(cars))}</b> (릴스 ${fmt.pct(sr(reels))})`:''}</div></div>
      <div class="in"><span class="e">👉</span><div><small>다음 액션</small>${m.verdict.k==='go'?'상위 게시물과 같은 포맷으로 후속편 만들기':m.verdict.k==='watch'?'저장이 많았던 포맷 비중 늘리기':'포맷을 바꿔 2주 더 테스트, 그래도 7% 미만이면 보류'}</div></div>
    </div></div>
  </div>
  <div class="card reveal" id="posts"><div class="hd"><div><h3>게시물별 참여율</h3><p class="cap">참여율 = (좋아요+댓글+저장+공유) ÷ 조회수 · 색 막대가 상위 3개</p></div></div><div class="chart" id="barChart"></div></div>
  <div class="row2b">${moneyBlock([id])}${schedBlock()}</div>
  ${tableBlock()}`;
  lineChart(document.getElementById('lineChart'),[{name:c.name,color:c.color,v:m.followers}],m.events);
  barChart(document.getElementById('barChart'),posts,c.color);
  table(posts);
}
function subnav(){
  const L=view===ALL?[['compare','캐릭터 비교'],['growth','팔로워 추이'],['money','수익'],['plan','업로드 계획'],['log','전체 기록']]:[['kpi','핵심 지표'],['growth','팔로워 추이'],['posts','게시물 반응'],['money','수익'],['plan','업로드 계획'],['log','전체 기록']];
  document.getElementById('subnav').innerHTML=L.map(([h,t])=>`<a href="#${h}">${t}</a>`).join('');
}
function render(){sortK='w';sortDir=-1;subnav();if(view===ALL)renderAll();else renderOne(view);watchReveal();}
switcher();render();
let rt,lw=innerWidth;addEventListener('resize',()=>{if(innerWidth===lw)return;lw=innerWidth;clearTimeout(rt);rt=setTimeout(render,200);});
</script>
</body>
</html>
