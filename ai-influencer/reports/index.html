<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리포트 · 회고와 분석 | AI.Influence</title>
<meta name="description" content="AI 인플루언서 운영 주간 리포트와 기획 리포트 모음.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:99px;border:1px solid var(--line2);background:var(--card);font-size:13.5px}
  .tab.on{border-color:var(--accent);background:rgba(255,92,138,.12)}
  .rlayout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
  @media(max-width:880px){.rlayout{grid-template-columns:1fr}}
  .rlist{display:grid;gap:10px;position:sticky;top:130px}
  @media(max-width:880px){.rlist{position:static;display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.rlist::-webkit-scrollbar{display:none}.ri{flex:0 0 260px}}
  .ri{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:.2s;position:relative}
  .ri:hover{border-color:var(--line2)}
  .ri.on{border-color:var(--accent);background:rgba(255,92,138,.07)}
  .ri .top{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
  .ri .kind{font-weight:900;color:var(--accent)}
  .ri .kind.plan{color:#b3a6ff}
  .ri b{font-size:14.5px;line-height:1.45;display:block}
  .ri .demo{margin-left:auto;font-size:10.5px;color:var(--warn);border:1px solid rgba(255,181,71,.4);border-radius:99px;padding:0 6px}
  .rdoc{padding:28px}
  @media(max-width:560px){.rdoc{padding:20px}}
  .rdoc .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .rdoc h2{font-size:clamp(22px,3vw,30px);font-weight:900;letter-spacing:-.8px;line-height:1.3}
  .rdoc .one{margin-top:12px;padding:14px 16px;border-left:3px solid var(--accent);background:rgba(255,92,138,.07);border-radius:0 12px 12px 0;font-size:15.5px}
  .rnums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
  @media(max-width:560px){.rnums{grid-template-columns:1fr}}
  .rn{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
  .rn small{color:var(--muted);font-size:12px;display:block}
  .rn b{font-size:24px;font-weight:900;display:block;line-height:1.25}
  .rn em{font-style:normal;font-size:12px;color:var(--ok)}
  .rsec{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  @media(max-width:700px){.rsec{grid-template-columns:1fr}}
  .rbox{border-radius:12px;border:1px solid var(--line);padding:14px 16px;background:var(--bg)}
  .rbox h4{font-size:14px;margin-bottom:8px}
  .rbox ul{list-style:none;display:grid;gap:6px;font-size:14px;color:#d6d6e2}
  .rbox li{padding-left:16px;position:relative}
  .rbox li::before{content:"•";position:absolute;left:2px;color:var(--dim)}
  .rbox.g{border-color:rgba(61,220,151,.3)}.rbox.g h4{color:var(--ok)}
  .rbox.b{border-color:rgba(255,107,107,.3)}.rbox.b h4{color:#ff9d9d}
  .rbox.l{border-color:rgba(123,97,255,.35)}.rbox.l h4{color:#b3a6ff}
  .rbox.n{grid-column:1/-1;border-color:rgba(255,92,138,.3)}.rbox.n h4{color:var(--accent)}
  .rbox.n li::before{content:"☐";color:var(--accent)}
  .rlink{display:inline-block;margin-top:16px;color:var(--accent);font-weight:700;font-size:14px}
  .cfil{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 16px;align-items:center}
  .cfil>span{font-size:13px;color:var(--muted);margin-right:2px}
  .cf{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid var(--line2);background:var(--card);font-size:13px;color:var(--muted)}
  .cf.on{border-color:var(--accent2);background:rgba(123,97,255,.18);color:var(--text)}
  .cf .av{width:24px;height:24px;border-radius:50%;overflow:hidden;display:inline-block;background:var(--card2)}
  .faces{display:flex;margin-top:8px}
  .faces span{width:22px;height:22px;border-radius:50%;overflow:hidden;border:2px solid var(--card);margin-left:-6px;background:var(--card2)}
  .faces span:first-child{margin-left:0}
  .who{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .who a{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;color:var(--muted)}
  .who a:hover{color:var(--text);border-color:var(--muted)}
  .who a .av{width:22px;height:22px;border-radius:50%;overflow:hidden;display:inline-block}
  .tmpl{margin-top:26px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
  .tmpl span.s{padding:5px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
</style>
</head>
<body data-chapter="reports">
<nav id="topnav"></nav>

<header class="page-head">
  <div class="wrap">
    <div class="crumb"><a href="/">홈</a>›<b>04 리포트</b></div>
    <h1>매주 쓰는 <span class="grad">회고와 분석</span></h1>
    <p class="lead">숫자만 쌓지 않고, 무엇이 왜 잘됐는지를 매주 한 장으로 남겨요. 나중에 이게 포트폴리오가 돼요.</p>
    <div class="pills" id="pills"></div>
  </div>
</header>

<div class="wrap" style="padding-bottom:72px">
  <div class="demo-banner reveal" style="margin-bottom:18px"><span>🧪</span><div><b>'샘플' 표시가 붙은 주간 리포트는 예시예요.</b> 운영 대시보드의 샘플 데이터를 바탕으로 쓴 가상 회고예요. 기획 리포트는 실제 조사 내용이에요.</div></div>
  <div class="tabs" id="tabs"><button class="tab on" data-f="all">전체</button><button class="tab" data-f="주간">주간 리포트</button><button class="tab" data-f="기획">기획 리포트</button></div>
  <div class="cfil" id="cfil"></div>
  <div class="rlayout">
    <div class="rlist" id="rlist"></div>
    <article class="card rdoc" id="rdoc" aria-live="polite"></article>
  </div>
  <div class="tmpl reveal">📝 리포트 구성:<span class="s">한 줄 요약</span>→<span class="s">숫자 3개</span>→<span class="s">잘된 것</span>→<span class="s">아쉬운 것</span>→<span class="s">배운 것</span>→<span class="s">다음 주 할 일</span></div>
  <a class="next reveal" href="/" style="margin-top:28px"><div><small>처음으로</small><b>홈 — 프로젝트 한눈에 보기</b></div><span class="arr">→</span></a>
</div>

<footer id="foot"></footer>

<script src="/characters/data.js"></script>
<script src="/reports/data.js"></script>
<script src="/assets/common.js"></script>
<script>
const R=REPORTS;let filter='all',cfilter='',cur=null;
const used=[...new Set(R.flatMap(r=>r.chars||[]))].filter(id=>charById(id));
const cfil=document.getElementById('cfil');
cfil.innerHTML=`<span>캐릭터:</span><button class="cf on" data-c="" style="padding-left:12px">전체</button>`+used.map(id=>`<button class="cf" data-c="${id}"><span class="av">${avatar(AV[id])}</span>${charById(id).name}</button>`).join('');
cfil.addEventListener('click',e=>{const b=e.target.closest('.cf');if(!b)return;cfilter=b.dataset.c;cfil.querySelectorAll('.cf').forEach(x=>x.classList.toggle('on',x===b));list();});
document.getElementById('pills').innerHTML=`<span class="pill">📄 리포트 ${R.length}개</span><span class="pill">🗓️ 주간 ${R.filter(r=>r.kind==='주간').length} · 기획 ${R.filter(r=>r.kind==='기획').length}</span>`;
function list(){
  const arr=R.filter(r=>(filter==='all'||r.kind===filter)&&(!cfilter||(r.chars||[]).includes(cfilter)));
  if(!arr.length){document.getElementById('rlist').innerHTML='<p class="note">조건에 맞는 리포트가 없어요.</p>';return;}
  document.getElementById('rlist').innerHTML=arr.map(r=>`<button class="ri ${r.id===cur?'on':''}" data-id="${r.id}"><span class="top"><span class="kind ${r.kind==='기획'?'plan':''}">${r.kind}</span>· ${r.week}${r.demo?'<span class="demo">샘플</span>':''}</span><b>${r.title}</b>${(r.chars||[]).length?`<span class="faces">${r.chars.filter(id=>charById(id)).map(id=>`<span>${avatar(AV[id])}</span>`).join('')}</span>`:''}</button>`).join('');
  if(!arr.find(r=>r.id===cur)&&arr[0])show(arr[0].id,false);
}
function show(id,scroll){
  const r=R.find(x=>x.id===id);if(!r)return;cur=id;
  const ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  const doc=document.getElementById('rdoc');
  doc.innerHTML=`<div class="meta"><span class="pill">${r.kind} 리포트</span><span class="pill">${r.week}</span>${r.demo?'<span class="pill demo">샘플</span>':'<span class="pill" style="color:var(--ok);border-color:rgba(61,220,151,.4)">실제</span>'}</div>
    <h2>${r.title}</h2><p class="one">${r.one}</p>
    ${(r.chars||[]).length?`<div class="who">${r.chars.filter(id=>charById(id)).map(id=>`<a href="/characters/profile/?id=${id}"><span class="av">${avatar(AV[id])}</span>${charById(id).name}</a>`).join('')}</div>`:''}
    <div class="rnums">${r.nums.map(n=>`<div class="rn"><small>${n.k}</small><b>${n.v}</b><em>${n.d}</em></div>`).join('')}</div>
    <div class="rsec">
      <div class="rbox g"><h4>👍 잘된 것</h4>${ul(r.good)}</div>
      <div class="rbox b"><h4>👎 아쉬운 것</h4>${ul(r.bad)}</div>
      <div class="rbox l" style="grid-column:1/-1"><h4>💡 배운 것</h4>${ul(r.learn)}</div>
      <div class="rbox n"><h4>👉 ${r.kind==='주간'?'다음 주 할 일':'다음 할 일'}</h4>${ul(r.next)}</div>
    </div>${r.link?`<a class="rlink" href="${r.link}">원문 보기 →</a>`:''}`;
  doc.classList.remove('swap');void doc.offsetWidth;doc.classList.add('swap');
  document.querySelectorAll('.ri').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  history.replaceState(null,'','#'+id);
  if(scroll&&innerWidth<880)doc.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('rlist').addEventListener('click',e=>{const b=e.target.closest('.ri');if(b)show(b.dataset.id,true);});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));list();});
const h=location.hash.slice(1);cur=R.find(r=>r.id===h)?h:R[0].id;list();show(cur,false);
</script>
</body>
</html>
