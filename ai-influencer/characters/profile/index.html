<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터 프로필 | AI.Influence</title>
<meta name="description" content="AI 인플루언서 캐릭터별 설정표와 운영 성과.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/style.css">
<style>
  /* ===== HERO ===== */
  .phero{padding:48px 0 88px;background:radial-gradient(ellipse 560px 360px at 20% -60px,var(--glow),transparent 100%)}
  .phtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:36px}
  .phtop .crumb{margin:0}
  .pg{display:flex;gap:8px}
  .pg a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 5px;border-radius:99px;border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--muted);transition:.2s}
  .pg a:last-child{padding:0 5px 0 14px}
  .pg a em{font-style:normal}
  .pg a:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
  .pg a span{width:30px;height:30px;border-radius:50%;overflow:hidden;display:inline-block}
  .ph{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:56px;align-items:center}
  .port{position:relative;aspect-ratio:4/4.6;border-radius:32px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.5)}
  .port .face{position:absolute;inset:0}
  .port .face img{object-position:50% 10%}
  .port .emo{position:absolute;right:18px;top:18px;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.75);box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .port .tagline{position:absolute;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;background:rgba(10,10,14,.86);font-size:14px;color:var(--muted)}
  .port .tagline b{color:#fff;font-size:15px}
  .pi .badges{display:flex;gap:8px;flex-wrap:wrap}
  .pi h1{font-size:clamp(46px,7vw,86px);font-weight:800;letter-spacing:-.055em;line-height:1.02;margin:18px 0 10px}
  .pi .hd{font-size:17px;color:var(--muted)}
  .pi .hd b{color:var(--accent)}
  .pi .con{font-size:clamp(21px,2.4vw,28px);font-weight:700;letter-spacing:-.035em;line-height:1.4;margin-top:26px;padding-left:18px;border-left:4px solid var(--c)}
  .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-top:30px;border-top:1px solid var(--line)}
  .facts div{padding:14px 0;border-bottom:1px solid var(--line)}
  .facts div:nth-child(odd){padding-right:16px}
  .facts small{display:block;font-size:13px;color:var(--dim);font-weight:600}
  .facts b{display:block;font-size:16.5px;font-weight:600;margin-top:2px}
  .trk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:28px}
  .trk div{font-size:13px;color:var(--dim);font-weight:600}
  .trk i{display:block;height:6px;border-radius:99px;background:var(--track);margin-bottom:8px}
  .trk .past i{background:rgba(255,255,255,.35)}
  .trk .cur{color:var(--text);font-weight:800}
  .trk .cur i{background:var(--grad);box-shadow:0 0 16px rgba(255,92,138,.5)}
  .trk.paused .cur i{background:var(--dim);box-shadow:none}
  .pi .btns{margin-top:30px}
  @media(max-width:900px){.ph{grid-template-columns:1fr;gap:32px}.port{max-width:440px;width:100%;margin:0 auto}}
  @media(max-width:560px){.phero{padding:28px 0 64px}.phtop{flex-direction:column;align-items:flex-start}.pg{width:100%}.pg a{flex:1;justify-content:space-between;min-width:0}.pg a em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.port{border-radius:26px}}

  /* ===== PERFORMANCE ===== */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .kpis div{padding:26px 22px 24px}
  .kpis div+div{border-left:1px solid var(--line)}
  .kpis small{display:block;font-size:14px;color:var(--dim);font-weight:600}
  .kpis b{display:block;font-size:clamp(32px,4vw,46px);font-weight:800;letter-spacing:-.045em;line-height:1.1;margin:6px 0 6px}
  .kpis em{font-style:normal;font-size:14px;font-weight:700;color:var(--ok)}
  .kpis em.m{color:var(--dim);font-weight:500}
  @media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpis div:nth-child(3){border-left:0}.kpis div:nth-child(n+3){border-top:1px solid var(--line)}.kpis div{padding:20px 14px}}
  .pgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-top:22px}
  @media(max-width:900px){.pgrid{grid-template-columns:1fr}}
  .chart{padding:26px 26px 18px;border-radius:26px;background:var(--card);border:1px solid var(--line)}
  .chart h3,.best h3{font-size:18px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
  .chart svg{display:block;width:100%;height:auto;margin-top:14px;overflow:visible}
  .chart path.ln{stroke-dasharray:2000;stroke-dashoffset:2000;transition:stroke-dashoffset 2s cubic-bezier(.3,.7,.2,1)}
  .chart.show path.ln{stroke-dashoffset:0}
  .best{display:flex;flex-direction:column;padding:26px;border-radius:26px;background:var(--card);border:1px solid var(--line)}
  .best .t{font-size:clamp(20px,2vw,24px);font-weight:800;letter-spacing:-.035em;line-height:1.35;margin:18px 0 20px}
  .best .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
  .best .row div{padding:14px;border-radius:16px;background:rgba(255,255,255,.04)}
  .best .row small{display:block;font-size:12.5px;color:var(--dim);font-weight:600}
  .best .row b{font-size:19px;font-weight:800;letter-spacing:-.03em}
  .best a{margin-top:18px;font-size:15px;font-weight:700;color:var(--muted)}
  .best a:hover{color:var(--text)}

  /* ===== BIBLE ===== */
  .comp{display:flex;align-items:center;gap:18px;margin-top:-18px;margin-bottom:40px;flex-wrap:wrap}
  .comp .ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(#ff5c8a calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;flex-shrink:0}
  .comp .ring b{width:50px;height:50px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:15px;font-weight:800}
  .comp p{font-size:16px;color:var(--muted)}
  .comp p b{color:var(--text)}
  .bl{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
  .bk{grid-column:span 3;padding:30px;border-radius:26px;background:var(--card);border:1px solid var(--line)}
  .bk.s2{grid-column:span 2}.bk.s4{grid-column:span 4}.bk.s6{grid-column:1/-1}
  @media(max-width:900px){.bl{grid-template-columns:1fr}.bk,.bk.s2,.bk.s4,.bk.s6{grid-column:1/-1}}
  @media(max-width:560px){.bk{padding:24px 20px}}
  .bk h3{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:800;color:var(--muted);letter-spacing:0}
  .bk h3 i{font-style:normal;font-size:18px}
  .bk .lead{font-size:clamp(19px,2vw,22px);font-weight:700;letter-spacing:-.03em;line-height:1.5;margin-top:14px}
  .bk p.sm{font-size:16px;color:var(--muted);margin-top:10px;line-height:1.6}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .tags span{font-size:16px;font-weight:600;padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .prompt{margin-top:16px;padding:18px 20px;border-radius:18px;background:#0b0b10;border:1px solid var(--line2);font-size:16px;font-weight:500;line-height:1.7;color:#e6e0ff}
  .copy{margin-top:12px;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);font-size:14px;font-weight:700;color:var(--muted);transition:.2s}
  .copy:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
  .chat{display:grid;gap:18px;margin-top:20px}
  .msg{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:end}
  .msg .f{width:44px;height:44px;border-radius:50%;overflow:hidden}
  .msg small{display:block;font-size:13px;color:var(--dim);font-weight:600;margin:0 0 6px 4px}
  .msg p{display:inline-block;padding:14px 18px;border-radius:22px 22px 22px 6px;background:var(--card2);border:1px solid var(--line2);font-size:17px;line-height:1.5}
  .eps{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-top:10px;counter-reset:ep}
  .eps li{counter-increment:ep;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
  .eps li::before{content:counter(ep,decimal-leading-zero);font-size:14px;font-weight:800;color:var(--accent)}
  @media(max-width:700px){.eps{grid-template-columns:1fr}}
  .no{list-style:none;display:grid;gap:12px;margin-top:16px}
  .no li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:16.5px;line-height:1.45}
  .no li::before{content:"✕";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,107,107,.14);color:#ff9d9d;font-size:12px;font-weight:900}
  .flow{display:flex;align-items:stretch;gap:0;margin-top:20px;flex-wrap:wrap;row-gap:12px}
  .flow .st{flex:1;min-width:150px;position:relative;padding:18px 20px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:16px;font-weight:700;line-height:1.4}
  .flow .st small{display:block;font-size:12.5px;color:var(--dim);font-weight:700;margin-bottom:6px}
  .flow .st.hot{background:rgba(255,181,71,.10);border-color:rgba(255,181,71,.45);color:#ffd18a}
  .flow .ar{display:grid;place-items:center;width:34px;color:var(--dim);font-weight:800;flex-shrink:0}
  @media(max-width:700px){.flow{flex-direction:column}.flow .ar{width:auto;height:22px;transform:rotate(90deg)}}
  .money{margin-top:18px;font-size:15.5px;color:var(--muted)}
  .money b{color:var(--text)}
  .todo{border-style:dashed;background:transparent}
  .tdl{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
  .tdl li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.035)}
  .tdl li i{font-style:normal;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:18px}
  .tdl b{display:block;font-size:16px}
  .tdl span{display:block;font-size:14px;color:var(--dim);margin-top:1px}
  @media(max-width:700px){.tdl{grid-template-columns:1fr}}

  /* ===== RELATED / NAV ===== */
  .rl{display:grid;gap:12px}
  .rl a{display:flex;gap:16px;align-items:center;padding:22px 24px;border-radius:22px;background:var(--card);border:1px solid var(--line);transition:.25s}
  .rl a:hover{border-color:var(--line2);transform:translateY(-3px)}
  .rl small{color:var(--dim);font-size:13.5px;display:block;font-weight:600}
  .rl b{font-size:18px;letter-spacing:-.03em}
  .rl .arr{margin-left:auto;font-size:22px;color:var(--muted)}
  .pn{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pn a{display:flex;align-items:center;gap:18px;padding:18px;border-radius:24px;background:var(--card);border:1px solid var(--line);transition:.25s}
  .pn a:hover{border-color:var(--line2);transform:translateY(-3px)}
  .pn a:last-child{flex-direction:row-reverse;text-align:right}
  .pn .f{width:72px;height:72px;border-radius:20px;overflow:hidden;flex-shrink:0}
  .pn small{display:block;font-size:13.5px;color:var(--dim);font-weight:600}
  .pn b{font-size:20px;letter-spacing:-.03em}
  .pn p{font-size:14px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  @media(max-width:700px){.pn{grid-template-columns:1fr}.pn a:last-child{flex-direction:row;text-align:left}}
  .nf{text-align:center;padding:120px 20px}
  .nf b{font-size:28px;display:block;margin-bottom:10px}
</style>
</head>
<body data-chapter="characters">
<nav id="topnav"></nav>
<main id="main"></main>
<footer id="foot"></footer>

<script src="/characters/data.js"></script>
<script src="/ops/data.js"></script>
<script src="/ops/metrics.js"></script>
<script src="/reports/data.js"></script>
<script src="/assets/common.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const c=charById(id),main=document.getElementById('main');
const LANG={ko:'한국어',en:'영어'};
if(!c){
  main.innerHTML=`<div class="wrap nf"><b>캐릭터를 찾을 수 없어요</b><p style="color:var(--muted)">주소가 바뀌었거나 아직 없는 캐릭터예요.</p><p style="margin-top:26px"><a class="btn primary" href="/characters/">로스터로 돌아가기</a></p></div>`;
}else{
  document.title=`${c.name} · 캐릭터 | AI.Influence`;
  const N=CHARACTERS.length,i=CHARACTERS.indexOf(c),prev=CHARACTERS[(i-1+N)%N],next=CHARACTERS[(i+1)%N];
  const m=window.M&&M.char(c.id),cp=completeness(c),col=c.color||'#b45cff';
  const has=v=>Array.isArray(v)?v.length:v!=null&&v!=='';
  const P=id=>`/characters/profile/?id=${id}`;

  /* stage track */
  const order=['idea','design','test','live'],si=order.indexOf(c.stage);
  const trk=`<div class="trk ${c.stage==='paused'?'paused':''}">${order.map((k,n)=>`<div class="${n<si?'past':''} ${n===si?'cur':''}"><i></i>${stageOf(k).label}</div>`).join('')}</div>`
    +(c.stage==='paused'?`<p class="note">지금은 <b style="color:var(--text)">보류</b> 중이에요. 설정은 그대로 남겨뒀어요.</p>`:'');

  /* ---------- performance ---------- */
  let perf='';
  if(m){
    const sm=innerWidth<600,W=sm?380:720,H=sm?230:230,L=4,R=W-4,T=sm?40:24,B=H-30,FS=sm?12:13;
    const f=m.followers,pts=f.map((v,k)=>({v,k})).filter(p=>p.v!=null),mx=Math.max(...pts.map(p=>p.v))*1.1;
    const x=k=>L+k/(f.length-1)*(R-L),y=v=>B-(v/mx)*(B-T);
    const d=pts.map((p,n)=>`${n?'L':'M'}${x(p.k).toFixed(1)},${y(p.v).toFixed(1)}`).join(' '),last=pts[pts.length-1];
    const grid=[0,.5,1].map(t=>`<line x1="${L}" x2="${R}" y1="${y(mx/1.1*t)}" y2="${y(mx/1.1*t)}" stroke="rgba(255,255,255,.06)"/>`).join('');
    const ev=(m.events||[]).map((e,n)=>{const px=x(e.w-1);return `<line x1="${px}" x2="${px}" y1="${T-8}" y2="${B}" stroke="rgba(255,181,71,.5)" stroke-dasharray="4 4"/><text x="${sm?px:px+6}" y="${sm?T-14-(n%2)*16:T+2}" fill="#ffb547" font-size="${FS}" font-weight="700" text-anchor="${sm?'middle':'start'}">${e.label}</text>`;}).join('');
    const xl=f.map((_,k)=>sm&&k%2&&k!==f.length-1?'':`<text x="${x(k)}" y="${H-6}" fill="#7d7d8c" font-size="${FS}" text-anchor="${k===0?'start':k===f.length-1?'end':'middle'}">${M.O.weeks[k]}</text>`).join('');
    const b=m.best;
    perf=`<section id="perf" style="padding-top:88px"><div class="wrap">
      <div class="sh plain reveal"><p class="eyebrow">운영 성과${c.demo?' · 샘플':''}</p><h2>${m.weeksRun}주 동안 <span class="grad">${fmt.n(m.latest)}명</span>이 모였어요</h2></div>
      <div class="kpis reveal">
        <div><small>팔로워</small><b data-count="${m.latest}">${fmt.n(m.latest)}</b>${m.delta>0?`<em>▲ ${fmt.n(m.delta)} 이번 주</em>`:''}</div>
        <div><small>최근 4주 참여율</small><b>${fmt.pct(m.avgEng)}</b><span class="vchip ${m.verdict.k}">${m.verdict.label}</span></div>
        <div><small>게시물</small><b data-count="${m.posts.length}" data-suffix="개">${m.posts.length}개</b><em class="m">저장률 ${fmt.pct(m.saveRate)}</em></div>
        <div><small>누적 수익</small><b>${fmt.won(m.income)}</b><em class="m">${m.income?'캐릭터 몫만':'아직 수익 없음'}</em></div>
      </div>
      <div class="pgrid">
        <div class="chart reveal" id="chart"><h3><span class="cdot" style="background:${col}"></span>주별 팔로워</h3>
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="주별 팔로워 ${pts.map(p=>p.v).join(', ')}">
            <defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".32"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
            ${grid}${ev}<path d="${d} L${x(last.k)},${B} L${x(pts[0].k)},${B} Z" fill="url(#ag)"/>
            <path class="ln" d="${d}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="${x(last.k)}" cy="${y(last.v)}" r="6.5" fill="${col}" stroke="#fff" stroke-width="3"/>${xl}</svg></div>
        <div class="best reveal d1"><h3>🏆 가장 반응 좋았던 편</h3><p class="t">${b.title}</p>
          <div class="row"><div><small>참여율</small><b>${fmt.pct(b.eng)}</b></div><div><small>조회</small><b>${fmt.k(b.views)}</b></div><div><small>저장</small><b>${fmt.n(b.saves)}</b></div></div>
          <a href="/ops/?c=${c.id}">운영 대시보드에서 전체 보기 →</a></div>
      </div>
    </div></section>`;
  }

  /* ---------- bible ---------- */
  const TODO=[];
  const blk=(cls,ic,title,body,todoText)=>{if(body!=null)return `<div class="bk ${cls} reveal"><h3><i>${ic}</i>${title}</h3>${body}</div>`;TODO.push({ic,title,todoText});return '';};
  const prompt=has(c.looks)?c.looks.join(', '):'';
  const B=[],span=(...v)=>{const n=v.filter(x=>has(x)).length;return n>=3?'s2':n===2?'s3':'s6';};
  const sA=span(c.personality,c.looks),sB=span(c.why,c.target,c.risk),sC=span(c.sidekick,c.avoid);
  B.push(blk(sA,'🧠','성격',has(c.personality)?`<div class="tags">${c.personality.map(x=>`<span>${x}</span>`).join('')}</div>`:null,'성격 키워드 3~5개를 정해요.'));
  B.push(blk(sA,'👀','외형 고정 키워드',has(c.looks)?`<p class="sm" style="margin-top:8px">이미지 만들 때 매번 그대로 붙여 넣어요. 그래야 같은 사람처럼 보여요.</p><div class="prompt" id="prompt">${prompt}</div><button class="copy" id="copy" type="button">복사하기</button>`:null,'매번 같은 얼굴로 보이게 할 키워드를 정해요.'));
  B.push(blk('s6','💬','말투',has(c.voice)?`<div class="chat">${c.voice.map(v=>`<div class="msg"><span class="f">${face(c.id,true)}</span><div><small>${v.n}</small><p>${v.t}</p></div></div>`).join('')}</div>`:null,'오프닝 · 핵심 한 줄 · 엔딩 대사를 정해요.'));
  B.push(blk(sB,'🎯','왜 이 캐릭터?',c.why?`<p class="lead">${c.why}</p>`:null,'조사에서 찾은 빈자리를 적어요.'));
  B.push(blk(sB,'👥','누가 볼까?',c.target?`<p class="lead">${c.target}</p>`:null,'보여줄 사람을 한 줄로 적어요.'));
  B.push(blk(sB,'⚠️','조심할 점',c.risk?`<p class="lead">${c.risk}</p>`:null,'만들 때 막힐 부분을 적어요.'));
  B.push(blk('s6','📺',`에피소드${has(c.episodes)?` ${c.episodes.length}편`:''}`,has(c.episodes)?`<ol class="eps">${c.episodes.map(e=>`<li>${e.replace(/^EP\.\d+\s*/,'')}</li>`).join('')}</ol>`:null,'첫 에피소드 3~10개를 적어요.'));
  B.push(blk(sC,'🐾','보조 캐릭터',has(c.sidekick)?`<p class="lead">${c.sidekick}</p>`:null,'동물·소품 같은 보조 캐릭터가 있으면 이야기가 쉬워져요.'));
  B.push(blk(sC,'🚫','하지 않는 것',has(c.avoid)?`<ul class="no">${c.avoid.map(x=>`<li>${x}</li>`).join('')}</ul>`:null,'선 넘지 않을 규칙을 정해요.'));
  const flow=has(c.moneyFlow)?`<div class="flow">${c.moneyFlow.map((x,k)=>`${k?'<span class="ar">→</span>':''}<div class="st ${x.includes('📦')?'hot':''}"><small>${k+1}단계</small>${x.replace('📦 ','')}</div>`).join('')}</div>`:'';
  B.push(blk('s6','💰','돈이 되는 흐름',(flow||c.money)?`${flow}${c.money?`<p class="money"><b>수익원 후보</b> · ${c.money}</p>`:''}`:null,'어떤 상품·협찬으로 돈을 벌지 적어요.'));

  const filled=B.filter(Boolean);
  if(TODO.length)filled.push(`<div class="bk s6 todo reveal"><h3><i>📝</i>아직 비어 있는 칸 ${TODO.length}개</h3><p class="sm">테스트 전에 채울 것들이에요. 한 줄씩만 정해도 돼요.</p>
    <ul class="tdl">${TODO.map(t=>`<li><i>${t.ic}</i><div><b>${t.title.replace(/ \d+편$/,'')}</b><span>${t.todoText}</span></div></li>`).join('')}</ul></div>`);
  const reps=(window.REPORTS||[]).filter(r=>(r.chars||[]).includes(c.id));
  const pnCard=(o,lbl)=>`<a href="${P(o.id)}"><span class="f">${face(o.id)}</span><div style="min-width:0"><small>${lbl}</small><b>${o.name}</b><p>${o.concept}</p></div></a>`;

  document.documentElement.style.setProperty('--c',col);
  document.documentElement.style.setProperty('--glow',col+'38');
  main.innerHTML=`
  <header class="phero"><div class="wrap">
    <div class="phtop"><div class="crumb"><a href="/">홈</a>›<a href="/characters/">캐릭터</a>›<b>${c.name}</b></div>
      <div class="pg"><a href="${P(prev.id)}" aria-label="이전 캐릭터 ${prev.name}"><span>${face(prev.id,true)}</span><em>← ${prev.name}</em></a><a href="${P(next.id)}" aria-label="다음 캐릭터 ${next.name}"><em>${next.name} →</em><span>${face(next.id,true)}</span></a></div></div>
    <div class="ph">
      <div class="port reveal">${face(c.id)}${c.emo?`<span class="emo">${c.emo}</span>`:''}<div class="tagline"><b>${c.name}</b><span>${c.handle||'계정 이름 미정'}${c.handle&&c.demo?' · 예시':''}</span></div></div>
      <div class="pi">
        <div class="badges">${stageBadge(c)}${c.niche?`<span class="pill">${c.niche}</span>`:''}${c.lang?`<span class="pill">${LANG[c.lang]}</span>`:''}</div>
        <h1>${c.name}</h1>
        <p class="hd">${c.age?c.age+'세 · ':''}${c.role||''}</p>
        <p class="con">${c.concept}</p>
        ${c.home||c.platform?`<div class="facts"><div><small>사는 곳</small><b>${c.home||'—'}</b></div><div><small>플랫폼</small><b>${c.platform||'—'}</b></div></div>`:''}
        ${trk}
        <div class="btns">${m?`<a class="btn primary" href="#perf">운영 성과 보기</a>`:''}<a class="btn ${m?'ghost':'primary'}" href="#bible">설정표 보기</a></div>
      </div>
    </div>
  </div></header>
  ${perf}
  <section id="bible" class="alt"><div class="wrap">
    <div class="sh plain reveal"><p class="eyebrow">캐릭터 설정표</p><h2>매번 같은 사람처럼 보이게,<br><span class="grad">이렇게 고정해요</span></h2></div>
    <div class="comp reveal"><span class="ring" style="--p:${cp.pct}"><b>${cp.pct}%</b></span><p>설정표 <b>${cp.n}/${cp.total}칸</b> 채움${cp.pct<80?` · 테스트로 넘어가려면 <b>80%</b>까지 채워야 해요`:' · 테스트 준비 완료'}</p></div>
    <div class="bl">${filled.join('')}</div>
  </div></section>
  ${reps.length?`<section style="padding-bottom:0"><div class="wrap"><div class="sh plain reveal"><p class="eyebrow">관련 리포트</p><h2>${josa(c.name,'이','가')} 나온 리포트</h2></div>
    <div class="rl reveal">${reps.map(r=>`<a href="/reports/#${r.id}"><div><small>${r.kind} · ${r.week}${r.demo?' · 샘플':''}</small><b>${r.title}</b></div><span class="arr">→</span></a>`).join('')}</div></div></section>`:''}
  <section><div class="wrap">
    <div class="pn reveal">${pnCard(prev,'← 이전 캐릭터')}${pnCard(next,'다음 캐릭터 →')}</div>
    <p style="text-align:center;margin-top:28px"><a class="btn ghost" href="/characters/">전체 로스터 ${N}명 보기</a></p>
  </div></section>`;

  const cb=document.getElementById('copy');
  if(cb)cb.addEventListener('click',()=>{const t=document.getElementById('prompt').textContent;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{cb.textContent='복사됨 ✓';setTimeout(()=>cb.textContent='복사하기',1600);}).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('prompt'));const s=getSelection();s.removeAllRanges();s.addRange(r);cb.textContent='선택됨 · ⌘C로 복사';});});
  const k=document.querySelector('.kpis');if(k)k.addEventListener('revealed',()=>k.querySelectorAll('[data-count]').forEach(countUp),{once:true});
  watchReveal();
}
</script>
</body>
</html>
