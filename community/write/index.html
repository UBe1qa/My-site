<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 · 마당</title>
<meta name="description" content="글 올리고, 사진 붙이고, 댓글 달아요. 이메일과 닉네임이면 1분 만에 가입하는 작은 커뮤니티, 마당.">
<meta name="robots" content="noindex">
<meta property="og:title" content="글쓰기 · 마당">
<meta property="og:description" content="글 올리고, 사진 붙이고, 댓글 달아요. 이메일과 닉네임이면 1분 만에 가입하는 작은 커뮤니티, 마당.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://glrziojqelmlsyepfimr.supabase.co" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
<script src="/assets/config.js" defer></script>
<script src="/assets/app.js" defer></script>
<script src="/assets/write.js" defer></script>
</head>
<body data-active="">
<main class="wrap narrow">
  <h1 class="page-title" id="w-title">글쓰기</h1>
  <p class="page-sub" id="w-sub">게시판을 고르고 제목과 내용을 써 주세요.</p>
  <form class="form" id="w-form" novalidate>
    <fieldset class="field">
      <legend class="legend">게시판</legend>
      <div class="seg" id="w-boards"></div>
    </fieldset>
    <label class="field">
      <span>제목</span>
      <input id="w-t" name="title" maxlength="80" autocomplete="off" placeholder="제목을 써 주세요">
      <span class="under"><span></span><span id="w-t-n">0/80</span></span>
    </label>
    <label class="field">
      <span>내용</span>
      <textarea id="w-c" name="content" maxlength="10000" placeholder="하고 싶은 이야기를 편하게 써 주세요"></textarea>
      <span class="under"><span>주소(링크)는 눌러 볼 수 있게 바뀌어요</span><span id="w-c-n">0/10,000</span></span>
    </label>
    <div class="field">
      <span class="legend">사진 <span class="hint" id="w-photo-n">0/5</span></span>
      <div class="previews" id="w-prev"></div>
      <span class="under"><span>큰 사진은 자동으로 줄여서 올려요</span></span>
      <input type="file" id="w-file" accept="image/*" multiple hidden>
    </div>
    <label class="check" id="w-notice-wrap" hidden><input type="checkbox" id="w-notice"><span>공지로 올리기 (운영자만 보여요)</span></label>
    <div class="msg error" id="w-msg" role="alert" hidden></div>
    <div class="form-actions">
      <a class="btn ghost" id="w-cancel" href="/">취소</a>
      <button class="btn primary" id="w-submit" type="submit">올리기</button>
    </div>
  </form>
</main>
</body>
</html>
