<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Sites</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b12;--card:#171724;--line:#26263a;--text:#ececf3;--muted:#9a9ab0;--accent:#ff5c8a;--accent2:#7b61ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;word-break:keep-all}
  main{width:100%;max-width:640px}
  h1{font-size:34px;font-weight:900;letter-spacing:-1px;margin-bottom:8px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{color:var(--muted);margin-bottom:32px}
  a.site{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:14px;color:inherit;text-decoration:none;transition:.2s}
  a.site:hover{border-color:var(--accent);transform:translateY(-2px)}
  a.site b{font-size:18px}
  a.site small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
  a.site i{font-style:normal;color:var(--accent);font-size:22px}
</style>
</head>
<body>
<main>
  <h1>My <span>Sites</span></h1>
  <p class="sub">만든 페이지 모음</p>
  <a class="site" href="/ai-influencer/"><div><b>🤖 AI 인플루언서로 돈 벌기</b><small>컨셉부터 수익화까지 5단계 로드맵</small></div><i>→</i></a>
  <a class="site" href="/higgsfield-guide/"><div><b>🎬 힉스필드 첫걸음 가이드</b><small>Higgsfield 처음 시작하기</small></div><i>→</i></a>
</main>
</body>
</html>
