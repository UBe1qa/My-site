<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;background:var(--paper);min-height:0}
.og-card{box-sizing:border-box;width:1200px;height:630px;padding:72px 84px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.og-brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;margin:0 0 36px}

.og-sub{font-size:28px;color:var(--ink-2);margin:26px 0 0}
.og-icons{display:grid;gap:26px}

</div><div class="og-icons"><img src="/img/owlight.webp" alt=""><img src="/img/setnote.webp" alt=""></div></div>
</body></html>
