<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="루틴을 저장하고, 세트마다 지난번 무게와 횟수를 보면서 기록하는 헬스 기록 앱">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0B09" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세트노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
/* Installable web build of index.html (scripts/build-web.mjs). SETNOTE_WEB turns on the install
   guide, the back-button handling and file backups; the claude.ai page never sets it.
   The saved theme is applied here so a dark choice doesn't flash light on launch. */
window.SETNOTE_WEB = true;
try { var t = localStorage.getItem('setnote:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>세트노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Palette: neutral ink/paper plus one volt accent. The accent is only ever a fill with --accent-ink on top
   (lime text on white is 1.3:1); accent-coloured text uses --accent-text instead. */
:root {
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --surface-2: #F2F3EF;
  --surface-3: #E7E9E3;
  --ink: #0F110E;
  --ink-2: #3B3F38;
  --muted: #6B7066;
  --line: #E4E6E0;
  --line-strong: #CDD1C8;
  --accent: #C8F135;
  --accent-ink: #0F110E;
  --accent-text: #4A6A00;
  --accent-soft: #EEF8CF;
  --done-soft: #F1F9D6;
  --inv: #0F110E;
  --inv-ink: #F4F6F0;
  --inv-soft: rgba(255,255,255,.12);
  --play-bg: #0F110E;
  --play-fg: #C8F135;
  --danger: #D92D20;
  --danger-soft: #FDECEA;
  --pr: #9A5B00;
  --pr-soft: #FFF3D6;
  --pr-fill: #FFC53D;
  --glass: rgba(255,255,255,.78);
  --scrim: rgba(10,12,9,.48);
  --shadow: 0 1px 2px rgba(16,18,14,.05), 0 10px 30px rgba(16,18,14,.08);
  --shadow-lg: 0 12px 40px rgba(16,18,14,.18);
  --font-num: "Barlow Condensed", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 22px;
  --tabbar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0A0B09; --surface: #151713; --surface-2: #1D201B; --surface-3: #272A23; --ink: #F3F5EF; --ink-2: #C9CDC3;
    --muted: #8F948A; --line: #242720; --line-strong: #363A31; --accent: #D4FF3A; --accent-ink: #0A0B09;
    --accent-text: #D4FF3A; --accent-soft: #232B0E; --done-soft: #1A2109; --inv: #272A23; --inv-ink: #F3F5EF;
    --inv-soft: rgba(255,255,255,.1); --play-bg: #D4FF3A; --play-fg: #0A0B09; --danger: #FF6B5E; --danger-soft: #3A1714;
    --pr: #FFC53D; --pr-soft: #33270C; --pr-fill: #FFC53D; --glass: rgba(29,32,27,.78);
    --scrim: rgba(0,0,0,.62); --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.35); --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0A0B09; --surface: #151713; --surface-2: #1D201B; --surface-3: #272A23; --ink: #F3F5EF; --ink-2: #C9CDC3;
  --muted: #8F948A; --line: #242720; --line-strong: #363A31; --accent: #D4FF3A; --accent-ink: #0A0B09;
  --accent-text: #D4FF3A; --accent-soft: #232B0E; --done-soft: #1A2109; --inv: #272A23; --inv-ink: #F3F5EF;
  --inv-soft: rgba(255,255,255,.1); --play-bg: #D4FF3A; --play-fg: #0A0B09; --danger: #FF6B5E; --danger-soft: #3A1714;
  --pr: #FFC53D; --pr-soft: #33270C; --pr-fill: #FFC53D; --glass: rgba(29,32,27,.78);
  --scrim: rgba(0,0,0,.62); --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.35); --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.5; padding-inline: 16px; word-break: keep-all; overflow-wrap: break-word;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; opacity: .4; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 20px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-fill { fill: currentColor; stroke: none; }

/* the page skeleton (claude.ai, and web/template.html the same way) already pads :root by the safe-area insets */
.app { max-width: 560px; margin: 0 auto; padding-block: 0 calc(var(--tabbar-h) + 124px); }
/* covers the status-bar strip above the sticky header so scrolled cards don't show through it on phones */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 15; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 10px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.logo { width: 28px; height: 28px; }
.logo .bg { fill: var(--play-bg); }
.logo .o { fill: none; stroke: var(--play-fg); stroke-width: 3.2; }
.logo .h { fill: var(--play-fg); }
.top-actions { display: flex; align-items: center; gap: 6px; }
.sync { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.sync .ic { width: 16px; height: 16px; }
.sync.cloud { color: var(--accent-text); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { background: var(--surface-3); }
.icon-btn.round { border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 10px; }
.icon-btn.sm .ic { width: 18px; height: 18px; }

.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-block: 8px 18px; }
.view-head p { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.view-head .btn { flex: none; white-space: nowrap; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.sub-h { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .01em; margin: 26px 4px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.empty { color: var(--muted); padding: 18px 4px; }
.stack { display: grid; gap: 10px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: var(--r-md); font-weight: 700; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink); text-align: center; transition: transform .12s ease, background-color .15s; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn .ic { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); box-shadow: none; color: var(--accent-ink); }
.btn-ink { background: var(--play-bg); box-shadow: none; color: var(--play-fg); }
.btn-soft { background: var(--surface-2); box-shadow: none; color: var(--ink-2); }
.btn-ghost { background: transparent; box-shadow: none; border: 1.5px dashed var(--line-strong); color: var(--ink-2); }
.btn-danger { background: var(--danger-soft); box-shadow: none; color: var(--danger); }
.btn-text { box-shadow: none; background: none; color: var(--muted); min-height: 40px; font-weight: 600; }
.btn-text.danger { color: var(--danger); }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.wide { width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* home: featured routine */
.hero { position: relative; overflow: hidden; background: var(--accent); color: var(--accent-ink); border-radius: 26px; padding: 18px 18px 16px; display: grid; gap: 4px; margin-bottom: 8px; }
.hero::after { content: ""; position: absolute; right: -46px; top: -46px; width: 170px; height: 170px; border-radius: 50%; border: 22px solid rgba(15,17,14,.07); pointer-events: none; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.hero-label { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(15,17,14,.1); }
.hero-when { font-weight: 600; opacity: .72; }
.hero-name { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin-top: 8px; text-align: left; overflow-wrap: anywhere; position: relative; z-index: 1; }
.hero-meta { display: flex; gap: 14px; font-size: 13.5px; font-weight: 600; opacity: .78; }
.hero-meta b { font-size: 18px; font-weight: 700; margin-right: 1px; }
.hero-ex { font-size: 13.5px; opacity: .78; margin-top: 2px; }
.hero-go { margin-top: 12px; height: 52px; border-radius: 16px; background: var(--hero-btn, #0F110E); color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 16px; position: relative; z-index: 1; transition: transform .12s ease; }
.hero-go:active { transform: scale(.98); }
.hero-go .ic { width: 18px; height: 18px; }

/* routine cards */
.rcard { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding-right: 14px; }
.rcard-main { flex: 1; min-width: 0; padding: 16px 4px 16px 18px; display: grid; gap: 3px; }
.rcard-title { font-size: 17.5px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; letter-spacing: -.01em; }
.rcard-meta { font-size: 13px; color: var(--muted); }
.rcard-ex { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; }
.play { width: 50px; height: 50px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--play-bg); color: var(--play-fg); transition: transform .12s ease; }
.play:active { transform: scale(.94); }
.play .ic { width: 20px; height: 20px; margin-left: 2px; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .01em; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.badge.pr { background: var(--pr-soft); color: var(--pr); }
.tpl { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 10px; }
.tpl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tpl-name { font-weight: 700; font-size: 17px; }
.tpl-list { font-size: 13.5px; color: var(--ink-2); }
.tpl-more { margin-top: 18px; }
.tpl-more > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; padding: 8px 4px; list-style: none; }
.tpl-more > summary::-webkit-details-marker { display: none; }
.tpl-more[open] > summary { margin-bottom: 8px; }
.intro { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 6px; margin-bottom: 14px; }
.intro b { font-size: 16.5px; }
.intro p { color: var(--ink-2); font-size: 14px; }
.intro .row2 { margin-top: 6px; }
.welcome { display: grid; gap: 10px; justify-items: start; padding: 6px 2px 18px; }
.welcome .logo { width: 52px; height: 52px; }
.welcome h2 { font-size: 24px; }
.welcome p { color: var(--ink-2); font-size: 14.5px; }
.after-list { display: grid; gap: 8px; margin-top: 12px; }

/* floating tab bar */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 10px); z-index: 20; width: min(420px, calc(100% - 32px)); border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); box-shadow: inset 0 0 0 1px var(--line), var(--shadow-lg); padding: 6px; }
.tabbar-in { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; height: calc(var(--tabbar-h) - 12px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 999px; font-size: 11.5px; color: var(--muted); font-weight: 600; text-align: center; transition: background-color .15s, color .15s; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* resume pill */
.pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + var(--tabbar-h) + 20px); z-index: 21; width: min(420px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 20px; background: var(--inv); color: var(--inv-ink); box-shadow: var(--shadow-lg); text-align: left; }
.pill-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 0 rgba(200,241,53,.6); animation: live 1.6s ease-out infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(200,241,53,.55); } 70%, 100% { box-shadow: 0 0 0 9px rgba(200,241,53,0); } }
.pill-txt { flex: 1; min-width: 0; display: grid; }
.pill-txt b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-txt span { font-size: 12.5px; opacity: .78; }
.pill-txt .num { font-size: 14px; font-weight: 600; }
.pill-go { flex: none; height: 40px; padding: 0 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; display: grid; place-items: center; }

/* exercise list */
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
.txt { height: 48px; border-radius: var(--r-md); border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; width: 100%; }
.txt:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ink); }
.search .txt { padding-left: 40px; }
.txt::placeholder { color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px 4px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }
.chip { flex: none; height: 36px; padding: 0 15px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--surface); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.exlist { display: grid; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.exrow { display: flex; gap: 12px; align-items: center; padding: 12px 16px 12px 12px; border-top: 1px solid var(--line); width: 100%; }
.exrow:first-child { border-top: 0; }
.exrow:active { background: var(--surface-2); }
.extile { width: 44px; height: 44px; border-radius: 13px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: -.02em; background: var(--surface-2); color: var(--ink-2); }
.extile[data-cat="가슴"] { background: #FFE4D6; color: #8A3A12; }
.extile[data-cat="등"] { background: #DCEAFF; color: #1D4B8F; }
.extile[data-cat="하체"] { background: #E3F5D6; color: #2F6A12; }
.extile[data-cat="어깨"] { background: #EFE3FF; color: #5B2E99; }
.extile[data-cat="팔"] { background: #FFF0C7; color: #7A5300; }
.extile[data-cat="코어"] { background: #D5F3EF; color: #145F57; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .extile[data-cat="가슴"] { background: #3A2217; color: #FFB48F; }
  :root:not([data-theme="light"]) .extile[data-cat="등"] { background: #182A45; color: #9CC3FF; }
  :root:not([data-theme="light"]) .extile[data-cat="하체"] { background: #1F3316; color: #A6E07C; }
  :root:not([data-theme="light"]) .extile[data-cat="어깨"] { background: #2C1D44; color: #CDA8FF; }
  :root:not([data-theme="light"]) .extile[data-cat="팔"] { background: #3A2E0E; color: #FFD66B; }
  :root:not([data-theme="light"]) .extile[data-cat="코어"] { background: #123430; color: #86E3D6; }
}
:root[data-theme="dark"] .extile[data-cat="가슴"] { background: #3A2217; color: #FFB48F; }
:root[data-theme="dark"] .extile[data-cat="등"] { background: #182A45; color: #9CC3FF; }
:root[data-theme="dark"] .extile[data-cat="하체"] { background: #1F3316; color: #A6E07C; }
:root[data-theme="dark"] .extile[data-cat="어깨"] { background: #2C1D44; color: #CDA8FF; }
:root[data-theme="dark"] .extile[data-cat="팔"] { background: #3A2E0E; color: #FFD66B; }
:root[data-theme="dark"] .extile[data-cat="코어"] { background: #123430; color: #86E3D6; }
.exrow-txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.exrow-name { font-weight: 600; }
.exrow-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.exrow-best { text-align: right; flex: none; display: grid; }
.exrow-best .num { font-size: 24px; font-weight: 700; line-height: 1.05; }
.exrow-best small { font-size: 11px; color: var(--muted); }
.last b { font-weight: 600; color: var(--ink-2); }
.last.none { color: var(--muted); }

/* history */
.week { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px 14px 14px; display: grid; gap: 16px; }
.week-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-inline: 4px; }
.wstat { display: grid; gap: 0; min-width: 0; }
.wstat .num { font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: -.01em; white-space: nowrap; }
.wstat .num em { font-style: normal; font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.wstat small { font-size: 12px; color: var(--muted); font-weight: 600; }
.week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wk { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }

function dayStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function weekStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
/* consecutive weeks (Mon–Sun) with at least one workout; an empty current week doesn't break it until it ends */
function weekStreak(mon) {
  const weeks = new Set(S.sessions.map(s => weekStart(s.endedAt)));
  const prev = w => { const d = new Date(w); d.setDate(d.getDate() - 7); return d.getTime(); };
  let w = weeks.has(mon) ? mon : prev(mon), n = 0;
  while (weeks.has(w)) { n++; w = prev(w); }
  return n;
}
function relDay(ts) {
  const n = Math.round((dayStart(Date.now()) - dayStart(ts)) / 864e5);
  if (n <= 0) return '오늘';
  if (n === 1) return '어제';
  if (n < 7) return n + '일 전';
  if (n < 30) return Math.floor(n / 7) + '주 전';
  if (n < 365) return Math.floor(n / 30) + '개월 전';
  return Math.floor(n / 365) + '년 전';
}
function fmtDate(ts) {
  const d = new Date(ts);
  const y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '년 ' : '';
  return `${y}${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
}
function fmtTime(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function fmtDur(ms) {
  const m = Math.max(1, Math.round(ms / 60000));
  if (m < 60) return m + '분';
  const h = Math.floor(m / 60);
  return h + '시간' + (m % 60 ? ' ' + (m % 60) + '분' : '');
}
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function fmtW(n) { if (n == null || !isFinite(n)) return ''; return String(Math.round(n * 100) / 100); }
function fmtInt(n) { return Math.round(n || 0).toLocaleString('ko-KR'); }
function round1(n) { return Math.round(n * 10) / 10; }
function num(v) {
  if (v == null) return null;
  const s = String(v).trim().replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) && n >= 0 && n < 10000 ? Math.round(n * 100) / 100 : null;
}
function int(v) {
  if (v == null) return null;
  const s = String(v).trim();
  if (!/^\d{1,4}$/.test(s)) return null;
  return parseInt(s, 10);
}
function firstInt(s) { const m = String(s || '').match(/\d+/); return m ? parseInt(m[0], 10) : null; }
function e1rm(w, r) { if (!w || !r) return 0; return r === 1 ? w : w * (1 + r / 30); }
function metric(sets) {

  for (const s of sets) { vol += (s.w || 0) * (s.r || 0); reps += s.r || 0; }

}

function exInfo(id, fallbackName) {

function mergeById(a, b) {
  const m = new Map();
  for (const x of [...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])]) if (x && x.id) m.set(x.id, x);
  return [...m.values()];
}
function allExercises() {
  const list = [...LIB, ...prof().custom];
  const seen = new Set(list.map(e => e.id));
  for (const [id, L] of idx().last) if (!seen.has(id)) { list.push({ id, name: L.ex.name || '이름 없는 운동', cat: '기타', bw: !!L.ex.bw }); seen.add(id); }
  return list;
}

/* index of last/best per exercise, rebuilt only when the sessions array changes */
let _idx = null, _idxRef = null;
function idx() {
  if (_idxRef === S.sessions && _idx) return _idx;
  const last = new Map(), best = new Map(), count = new Map(), routineLast = new Map();
  for (const s of S.sessions) {
    if (s.routineId && !routineLast.has(s.routineId)) routineLast.set(s.routineId, s.endedAt);
    for (const ex of (s.exercises || [])) {
      if (!ex.sets || !ex.sets.length) continue;
      if (!last.has(ex.exId)) last.set(ex.exId, { s, ex });
      count.set(ex.exId, (count.get(ex.exId) || 0) + 1);
      const b = best.get(ex.exId) || { e1: 0, maxW: 0, maxR: 0 };
      for (const st of ex.sets) {
        const e = e1rm(st.w, st.r);
        if (e > b.e1) { b.e1 = e; b.e1Set = st; }
        if ((st.w || 0) > b.maxW) { b.maxW = st.w; b.maxWR = st.r; }
        if ((st.r || 0) > b.maxR) b.maxR = st.r;
      }
      best.set(ex.exId, b);
    }
  }
  _idx = { last, best, count, routineLast };
  _idxRef = S.sessions;
  return _idx;
}

function wStr(w, bw) {
  if (w == null || w === 0) return bw ? '맨몸' : '—';
  return (bw ? '+' : '') + fmtW(w) + 'kg';
}
function setsStr(sets, bw) {
  if (!sets || !sets.length) return '';
  const w0 = sets[0].w ?? null;
  if (sets.every(s => (s.w ?? null) === w0)) return `${wStr(w0, bw)} × ${sets.map(s => s.r ?? '-').join(', ')}`;
  return sets.map(s => `${s.w ? (bw ? '+' : '') + fmtW(s.w) : (bw ? '맨몸' : '—')}×${s.r ?? '-'}`).join(' · ');
}

async function attempt(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 800); return fn(); }
    throw e;
  }
}

function cloudStore(db, uidv) {
  const base = db.doc('data/users/' + uidv + '/profile');
  const rCol = base.collection('routines');
  const sCol = base.collection('sessions');
  const aDoc = base.collection('state').doc('active');
  const queues = new Map();
  const unsubs = {};
  let dead = false;
  const run = (key, fn) => {
    if (dead) return Promise.resolve();
    const p = (queues.get(key) || Promise.resolve()).catch(() => {}).then(() => (dead ? undefined : attempt(fn)));
    queues.set(key, p);
    p.then(() => { S.wroteOk = true; }, onWriteError);
    return p;
  };
  const docData = d => ({ ...clone(d.data()), id: d.id });
  const fresh = m => !(m && m.fromCache);
  const syncKey = 'setnote:active-synced:' + uidv;
  const subs = {
    routines: () => rCol.onSnapshot(snap => setData('routines', snap.docs.filter(d => d.exists).map(docData), fresh(snap.metadata)), e => onSubError('routines', e)),
    sessions: () => sCol.orderBy('endedAt', 'desc').limit(1000).onSnapshot(snap => setData('sessions', snap.docs.filter(d => d.exists).map(docData), fresh(snap.metadata)), e => onSubError('sessions', e)),
    profile: () => base.onSnapshot(d => setData('profile', d.exists ? clone(d.data()) : {}, fresh(d.metadata)), e => onSubError('profile', e)),
  };
  const retried = {};
  function onSubError(which, e) {
    console.warn('subscription error', which, e);
    if (dead) return;
    if (e && e.code === 'revoked') { switchToLocal('클라우드 연결이 끊겼어요. 지금부터는 이 기기에만 저장돼요.'); return; }
    if (e && e.code === 'unavailable' && !retried[which]) {
      retried[which] = true;
      setTimeout(() => { if (!dead) unsubs[which] = subs[which](); }, 3000);
      return;
    }
    if (which !== 'profile') S.loaded[which] = true;
    toast('기록을 불러오지 못했어요. 새로고침해 보세요.');
    scheduleRender();
  }
  return {
    kind: 'cloud',
    start() { for (const k in subs) unsubs[k] = subs[k](); },
    async loadActive() {
      try { const d = await aDoc.get(); return d.exists ? clone(d.data()) : null; } catch { return undefined; }
    },
    saveRoutine: r => run('r/' + r.id, () => rCol.doc(r.id).set(clone(r))),
    deleteRoutine: id => run('r/' + id, () => rCol.doc(id).delete()),
    saveSession: s => run('s/' + s.id, () => sCol.doc(s.id).set(clone(s))),
    deleteSession: id => run('s/' + id, () => sCol.doc(id).delete()),
    saveProfile: () => { const body = clone(S.profile); return run('p', () => base.set(body)); },
    saveActive: a => {
      const body = a ? clone(a) : null;
      return run('a', () => body
        ? aDoc.set(body).then(() => { lsSet(syncKey, body.id); })
        : aDoc.delete().then(() => { lsDel(syncKey); }));
    },
    stop() { dead = true; for (const k in unsubs) { try { unsubs[k] && unsubs[k](); } catch {} } },
  };
}

function onWriteError(e) {
  console.warn('write failed', e);
  const code = e && e.code;
  if (store && store.kind === 'cloud' && code === 'invalid_argument' && !S.wroteOk) {
    if (S.uid) { lsSet('setnote:cloud-denied:' + S.uid, '1'); S.deniedUid = S.uid; }
    switchToLocal('이 링크에서는 계정에 저장할 권한이 없어서, 이 기기에만 저장할게요.');
    return;
  }
  if (code === 'revoked') { switchToLocal('클라우드 연결이 끊겼어요. 지금부터는 이 기기에만 저장돼요.'); return; }
  if (code === 'quota_exceeded') { toast('저장 공간이 가득 찼어요. 오래된 기록을 백업한 뒤 지워 주세요.'); return; }
  if (code === 'resource_exhausted') { toast('저장 요청이 너무 많아요. 잠시 후 다시 해 주세요.'); return; }
  toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.');
}

function switchToLocal(msg) {
  if (store && store.kind === 'local') return;
  if (store) store.stop();
  const prevMirror = S.active ? clone(S.active) : null;
  const oldMirror = mirrorKey(), oldOb = obKey();
  const pending = readOb();
  S.mode = 'local';
  S.uid = null;
  if (pending.length) S.sessions = sortSessions(mergeById(S.sessions, pending));
  store = localStore(false);
  store.start();
  if (oldMirror !== mirrorKey()) {
    const m = lsGet(oldMirror);
    if (!prevMirror && m && !lsGet(mirrorKey())) lsSet(mirrorKey(), m);
    lsDel(oldMirror);
  }
  if (oldOb !== obKey()) lsDel(oldOb);
  if (prevMirror) writeMirror(prevMirror);
  S.loaded.routines = true; S.loaded.sessions = true; S.loaded.profile = true;
  S.activeReady = true;
  S.localOnly = null;
  if (msg) toast(msg, 4200);
  scheduleRender();
}

function setData(kind, val, isFresh = true) {
  if (isFresh) S.fresh[kind] = true;
  if (kind === 'routines') { S.routines = sortRoutines(val.filter(r => r && r.id)); S.loaded.routines = true; }
  else if (kind === 'sessions') {
    const ob = readOb().filter(o => !val.some(x => x && x.id === o.id));
    S.sessions = sortSessions([...val, ...ob].filter(x => x && x.id));
    S.loaded.sessions = true;
    if (S.active && S.sessions.some(s => s.id === S.active.id)) {
      // this workout was already finished on another device
      S.active = null; S.workoutOpen = false; S.rest = null; clearMirror(); keepAwake(false);
    }
  } else if (kind === 'profile') { S.profile = val || {}; S.loaded.profile = true; }
  if (S.mode === 'cloud') checkLocalOnly();
  scheduleRender();
}

/* records kept only in this browser (from a visit where the account store was unavailable) */
function checkLocalOnly() {
  if (S.localOnly !== null || !S.fresh.routines || !S.fresh.sessions || !S.fresh.profile) return;
  const d = lsJSON('setnote:v1') || {};
  const rs = (Array.isArray(d.routines) ? d.routines : []).map(cleanRoutine).filter(r => r && !S.routines.some(x => x.id === r.id));
  const ss = (Array.isArray(d.sessions) ? d.sessions : []).map(cleanSession).filter(x => x && !S.sessions.some(y => y.id === x.id));
  const cs = (d.profile && Array.isArray(d.profile.custom) ? d.profile.custom : []).map(cleanCustom).filter(c => c && !prof().custom.some(x => x.id === c.id));
  S.localOnly = { rs, ss, cs, n: rs.length + ss.length + cs.length };
  if (lsGet('setnote:v1')) pruneV1({ r: S.routines.map(x => x.id), s: S.sessions.map(x => x.id), c: prof().custom.map(x => x.id) });
}
async function migrateLocal() {
  const L = S.localOnly;
  if (!L || !L.n || !store || store.kind !== 'cloud') return;
  S.migrateHidden = true;
  render();
  toast('계정으로 옮기는 중…', 60000);
  let fail = 0, csOk = !L.cs.length;
  const doneR = new Set(), doneS = new Set();
  if (L.cs.length) {
    S.profile = { ...S.profile, custom: mergeById(prof().custom, L.cs) };
    try { await store.saveProfile(); csOk = true; } catch { fail++; }
  }
  for (const r of L.rs) {
    if (store.kind !== 'cloud') break;
    if (!S.routines.some(x => x.id === r.id)) S.routines = sortRoutines([...S.routines, r]);
    try { await store.saveRoutine(r); doneR.add(r.id); } catch { fail++; }
    await sleep(60);
  }
  for (const x of L.ss) {
    if (store.kind !== 'cloud') break;
    if (!S.sessions.some(y => y.id === x.id)) S.sessions = sortSessions([...S.sessions, x]);
    try { await store.saveSession(x); doneS.add(x.id); } catch { fail++; }
    await sleep(60);
  }
  if (store.kind === 'cloud') {
    const d = lsJSON('setnote:v1') || {};
    d.routines = (Array.isArray(d.routines) ? d.routines : []).filter(r => !(r && doneR.has(r.id)));
    d.sessions = (Array.isArray(d.sessions) ? d.sessions : []).filter(x => !(x && doneS.has(x.id)));
    if (csOk && d.profile && typeof d.profile === 'object') d.profile.custom = [];
    lsSet('setnote:v1', JSON.stringify(d));
    S.localOnly = null;
    checkLocalOnly();
  }
  if (store.kind === 'cloud') toast(fail ? `${fail}개는 옮기지 못했어요. 나중에 다시 시도해 주세요.` : '계정으로 모두 옮겼어요', 3600);
  render();
}
function migrateBanner() {
  const L = S.localOnly;
  if (S.mode !== 'cloud' || !L || !L.n || S.migrateHidden) return '';
  const parts = [];
  if (L.rs.length) parts.push(`루틴 ${L.rs.length}개`);
  if (L.ss.length) parts.push(`운동 기록 ${L.ss.length}개`);
  if (L.cs.length) parts.push(`직접 만든 운동 ${L.cs.length}개`);
  return `<div class="intro"><b>이 브라우저에만 저장된 ${parts.join(', ')}가 있어요</b><p>계정으로 옮기면 다른 기기에서도 보이고, ‘지난번’ 기록에도 반영돼요.</p><div class="row2"><button class="btn btn-sm" data-act="migrate-hide">나중에</button><button class="btn btn-sm btn-primary" data-act="migrate">계정으로 옮기기</button></div></div>`;
}

/* active workout persistence: mirror immediately, cloud debounced */
let actTimer = null;
function touchActive() {
  if (!S.active) return;
  S.active.updatedAt = Date.now();
  writeMirror(S.active);
  clearTimeout(actTimer);
  actTimer = setTimeout(flushActive, 900);
}
function flushActive() {
  clearTimeout(actTimer); actTimer = null;
  if (store && store.kind === 'cloud' && S.active) store.saveActive(S.active);
}
function clearActiveEverywhere() {
  clearTimeout(actTimer); actTimer = null;
  clearMirror();
  if (store && store.kind === 'cloud') store.saveActive(null);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && actTimer) flushActive();
  if (document.visibilityState === 'visible' && S.active && S.workoutOpen) keepAwake(true);
});
window.addEventListener('pagehide', () => { if (actTimer) flushActive(); });

/* ---------- boot ---------- */
function use(name) {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') return Promise.resolve(null);
  try { return Promise.resolve(C.use(name)).catch(() => null); } catch { return Promise.resolve(null); }
}
function validActive(a) { return a && typeof a === 'object' && Array.isArray(a.exercises) && typeof a.startedAt === 'number' && typeof a.id === 'string'; }

async function boot() {
  render();
  const [db, user] = await Promise.all([use('db'), use('user')]);
  let uidv = null;
  if (user) { try { uidv = await user.id(); } catch { uidv = null; } }
  if (db && uidv && !lsGet('setnote:cloud-denied:' + uidv)) {
    S.uid = uidv; S.mode = 'cloud';
    store = cloudStore(db, uidv);
  } else {
    if (db && uidv) S.deniedUid = uidv;
    S.mode = 'local';
    store = localStore(true);
  }
  store.start();
  const ob = readOb();
  if (ob.length) { S.sessions = sortSessions(mergeById(S.sessions, ob)); if (store.kind === 'cloud') resendOutbox(); else ob.forEach(sendSession); }
  let mirror = lsJSON(mirrorKey());
  const localMirror = S.mode === 'cloud' ? lsJSON('setnote:active:local') : null;
  const remote = await store.loadActive();
  if (store.kind === 'cloud' && remote === null && mirror && lsGet('setnote:active-synced:' + S.uid) === mirror.id) {
    // finished or discarded on another device after this one last saved it
    clearMirror(); lsDel('setnote:active-synced:' + S.uid); mirror = null;
  }
  const cands = [mirror, remote, localMirror].filter(validActive);
  cands.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const pick = cands[0];
  const v1 = lsJSON('setnote:v1');
  const savedIds = new Set([...S.sessions, ...readOb(), ...(v1 && Array.isArray(v1.sessions) ? v1.sessions : [])].map(x => x && x.id));
  if (!S.active && pick && !savedIds.has(pick.id)) {
    S.active = pick;
    if (pick === localMirror) { lsDel('setnote:active:local'); touchActive(); }
    else writeMirror(pick);
  }
  S.activeReady = true;
  render();
}
window.addEventListener('online', resendOutbox);

/* ---------- rendering ---------- */
let pendingRender = false, rafId = 0, lastSheetKey = '', sheetChangedAt = -1e9, rendering = false;
const isTyping = () => { const a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.type !== 'file'; };
function scheduleRender() {
  if (isTyping()) { pendingRender = true; return; }
  if (!rafId) rafId = requestAnimationFrame(() => { rafId = 0; render(); });
}
document.addEventListener('focusout', () => {
  if (!pendingRender || rendering) return;
  setTimeout(() => { if (pendingRender && !isTyping()) { pendingRender = false; render(); } }, 0);
});

function render() {
  pendingRender = false;
  const ae = document.activeElement;
  const fid = ae && ae.id;
  let s0 = null, s1 = null;
  if (fid && isTyping()) { try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch {} }
  const woEl = $('#wo');
  const woScroll = woEl ? woEl.scrollTop : null;
  const shBody = $('.sheet-body');
  const shScroll = shBody ? shBody.scrollTop : 0;

  const top = topSheet();
  const key = top ? S.sheets.length + ':' + top.kind + ':' + (top.id || '') : '';
  rendering = true;
  try {
    $('#main').innerHTML = headerHtml() + viewHtml();
    const tb = $('#tabbar');
    tb.innerHTML = tabbarHtml();
    tb.hidden = !!(S.active && S.workoutOpen);
    $('#pill-root').innerHTML = S.active && !S.workoutOpen ? pillHtml() : '';
    $('#wo-root').innerHTML = S.active && S.workoutOpen ? workoutHtml() : '';
    $('#sheet-root').innerHTML = top ? sheetHtml(top) : '';
  } finally { rendering = false; }
  const nwo = $('#wo');
  if (nwo && woScroll != null) nwo.scrollTop = woScroll;
  const nsb = $('.sheet-body');
  if (nsb && key === lastSheetKey) nsb.scrollTop = shScroll;
  if (key !== lastSheetKey) sheetChangedAt = performance.now();
  lastSheetKey = key;
  S.sheetEnter = false;
  S.pop = null;

  if (fid) {
    const el = document.getElementById(fid);
    if (el && el !== document.activeElement) {
      try { el.focus({ preventScroll: true }); if (s0 != null && el.setSelectionRange) el.setSelectionRange(s0, s1); } catch {}
    }
  }
  document.body.classList.toggle('lock', !!(S.active && S.workoutOpen) || S.sheets.length > 0);
  syncBackGuard();
  tickUi();
}

function headerHtml() {

  if (!S.routines.some(r => rl.has(r.id))) return null;
  let pick = null, pickT = Infinity;
  for (const r of S.routines) { const t = rl.has(r.id) ? rl.get(r.id) : -1; if (t < pickT) { pickT = t; pick = r.id; } }

    <div class="search">${I('search')}<input id="ex-q" class="txt" type="search" data-field="ex-q" placeholder="운동 이름 검색 (예: 벤치, 스쿼트)" value="${esc(S.exQ)}" autocomplete="off" enterkeyhint="search"></div>
    <div class="chips" role="group" aria-label="부위">${['전체', ...CATS].map(c => `<button class="chip" data-act="ex-cat" data-cat="${c}" aria-pressed="${S.exCat === c}">${c}</button>`).join('')}</div>

/* history tab */
function historyView() {
  const head = `<div class="view-head"><div><h1>기록</h1><p>끝낸 운동이 날짜별로 쌓여요</p></div></div>`;
  if (!S.loaded.sessions) return head + '<p class="empty">기록을 불러오는 중…</p>';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const days = new Map();
  for (const s of S.sessions) { const k = dayKey(s.endedAt); days.set(k, (days.get(k) || 0) + 1); }
  let wkCount = 0, wkVol = 0;
  for (const s of S.sessions) if (s.endedAt >= mon.getTime()) { wkCount++; wkVol += s.volume || 0; }
  const cells = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const on = days.has(dayKey(d.getTime()));
    const isToday = d.getTime() === today.getTime();
    cells.push(`<div class="wk${on ? ' on' : ''}${isToday ? ' today' : ''}"><span>${DOW[d.getDay()]}</span><span class="wk-dot">${d.getDate()}</span></div>`);
  }
  const streak = weekStreak(mon.getTime());
  const week = `<div class="week"><div class="week-sum">
      <div class="wstat"><span class="num">${wkCount}<em>회</em></span><small>이번 주 운동</small></div>
      <div class="wstat"><span class="num">${fmtInt(wkVol)}<em>kg</em></span><small>이번 주 볼륨</small></div>
      <div class="wstat"><span class="num">${streak}<em>주</em></span><small>연속 운동</small></div>
    </div><div class="week-days">${cells.join('')}</div></div>`;
  if (!S.sessions.length) return head + migrateBanner() + week + `<p class="empty">아직 기록이 없어요. 루틴 탭에서 운동을 시작하고, 끝나면 ‘완료’를 눌러 저장하세요.</p>`;
  let html = '', curMonth = '';
  const groups = new Map();
  for (const s of S.sessions) { const d = new Date(s.endedAt); const k = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월'; groups.set(k, (groups.get(k) || 0) + 1); }
  for (const s of S.sessions) {
    const d = new Date(s.endedAt); const k = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월';
    if (k !== curMonth) { if (curMonth) html += '</div>'; curMonth = k; html += `<h3 class="month-h"><span>${k}</span><span>${groups.get(k)}회</span></h3><div class="stack">`; }
    const exs = s.exercises || [];
    html += `<button class="scard" data-act="open-session" data-id="${esc(s.id)}">
      <span class="scard-date" aria-hidden="true"><b>${d.getDate()}</b><small>${DOW[d.getDay()]}</small></span><span class="sr">${esc(fmtDate(s.endedAt))}</span>
      <span class="scard-main">
        <span class="scard-top"><span class="scard-title">${esc(s.routineName || '자유 운동')}</span><span class="scard-when">${relDay(s.endedAt)}</span></span>
        <span class="scard-stats"><span><span class="num">${fmtDur((s.endedAt || 0) - (s.startedAt || 0))}</span></span><span><span class="num">${s.setCount || 0}</span>세트</span><span><span class="num">${fmtInt(s.volume)}</span>kg</span></span>
        <span class="scard-ex">${esc(exs.map(e => `${e.name} ${e.sets.length}`).join(' · '))}</span>
      </span>
    </button>`;
  }
  if (curMonth) html += '</div>';
  return head + migrateBanner() + week + html;
}

/* workout */
function pillHtml() {
  const a = S.active;
  const sub = S.rest ? `휴식 <span id="pill-time" class="num">${fmtClock((S.rest.end - Date.now()) / 1000)}</span> 남음` : `진행 중 · <span id="pill-time" class="num">${fmtClock((Date.now() - a.startedAt) / 1000)}</span>`;
  return `<button class="pill" data-act="wo-open"><span class="pill-dot" aria-hidden="true"></span><span class="pill-txt"><b>${esc(a.routineName || '자유 운동')}</b><span>${sub}</span></span><span class="pill-go">이어서 하기</span></button>`;
}
function findEx(u) { return S.active && S.active.exercises.find(e => e.u === u); }
/* value a set logs when ✓ is tapped with empty inputs:
   follow last time's set-by-set numbers, unless today's earlier sets moved away from them */
function fillFor(ex, i) {
  const L = idx().last.get(ex.exId);
  const ls = L ? L.ex.sets : [];
  const tail = ls.length ? ls[ls.length - 1] : null;
  const tW = ex.target && ex.target.weight != null ? ex.target.weight : null;
  const tR = firstInt(ex.target && ex.target.reps);
  let effW = null, effR = null;
  for (let j = 0; ; j++) {
    const prev = ls[j] || null;
    let w;
    if (j === 0) w = prev ? prev.w : tail ? tail.w : tW;
    else if (prev && ls[j - 1] && (ls[j - 1].w ?? null) === effW) w = prev.w;
    else w = effW;
    const r = prev ? prev.r : effR != null ? effR : tail ? tail.r : tR;
    if (j >= i || j >= ex.sets.length) return { prev: ls[i] || null, w: w ?? null, r: r ?? null };
    const st = ex.sets[j];
    const typedW = String(st.w ?? '').trim() !== '' ? num(st.w) : null;
    effW = typedW != null ? typedW : (w ?? null);
    effR = int(st.r) > 0 ? int(st.r) : (r ?? null);
  }
}
function placeholders(ex, i) {
  const f = fillFor(ex, i);
  return {
    w: f.w != null ? (ex.bw && f.w === 0 ? '0' : fmtW(f.w)) : (ex.bw ? '맨몸' : 'kg'),
    r: f.r != null ? String(f.r) : (ex.target && ex.target.reps ? String(ex.target.reps) : '회'),
  };
}
function validDone(ex, s) {
  return !!s.done && int(s.r) > 0 && (String(s.w).trim() === '' ? !!ex.bw : num(s.w) != null);
}
function progressHtml(ex) {
  const L = idx().last.get(ex.exId);
  const done = ex.sets.filter(s => validDone(ex, s)).map(s => ({ w: num(s.w), r: int(s.r) }));
  if (!done.length || !L) return '';
  const cur = metric(done), prev = metric(L.ex.sets);
  if (cur.vol > 0 && prev.vol > 0) {
    const d = cur.vol - prev.vol;
    return `<span class="prog${d > 0 ? ' up' : ''}">볼륨 <b class="num">${fmtInt(cur.vol)}</b> / 지난번 ${fmtInt(prev.vol)}kg${d > 0 ? ` · <b>+${fmtInt(d)}kg</b>` : ''}</span>`;
  }
  const d = cur.reps - prev.reps;
  return `<span class="prog${d > 0 ? ' up' : ''}">총 <b class="num">${cur.reps}</b>회 / 지난번 ${prev.reps}회${d > 0 ? ` · <b>+${d}회</b>` : ''}</span>`;
}
function exCardHtml(ex, k, n) {
  const L = idx().last.get(ex.exId);
  const lastLine = L
    ? `<span class="tag acc">지난번</span><span>${relDay(L.s.endedAt)}</span>`
    : `<span class="tag">첫 기록</span><span>이번이 첫 기록이에요</span>`;
  const target = ex.target ? `<span class="muted">· 목표 ${ex.target.sets}세트 × ${esc(ex.target.reps || '-')}회${ex.target.weight != null ? ' · ' + fmtW(ex.target.weight) + 'kg' : ''}</span>` : '';
  const rows = ex.sets.map((st, i) => {
    const f = fillFor(ex, i);
    const ph = st.done ? { w: ex.bw ? '맨몸' : '', r: '' } : placeholders(ex, i);
    const p = f.prev;
    const prevTxt = p ? `${p.w ? (ex.bw ? '+' : '') + fmtW(p.w) : (ex.bw ? '맨몸' : '—')}×${p.r ?? '-'}` : '—';
    const prevHtml = prevTxt.replace('×', '<wbr>×');
    return `<div class="set${st.done ? ' done' : ''}${S.pop === ex.u + ':' + i ? ' pop' : ''}">
      <span class="set-n">${i + 1}</span>
      <button class="set-prev" data-act="wo-copy-prev" data-u="${ex.u}" data-i="${i}" ${p ? '' : 'disabled'} aria-label="${p ? '지난번 값 ' + prevTxt + ' 넣기' : '지난번 기록 없음'}">${prevHtml}</button>
      <input id="w-${ex.u}-${i}" class="num-in" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-field="w" data-u="${ex.u}" data-i="${i}" value="${esc(st.w)}" placeholder="${esc(ph.w)}" aria-label="${i + 1}세트 무게 kg">
      <input id="r-${ex.u}-${i}" class="num-in" inputmode="numeric" enterkeyhint="done" autocomplete="off" data-field="r" data-u="${ex.u}" data-i="${i}" value="${esc(st.r)}" placeholder="${esc(ph.r)}" aria-label="${i + 1}세트 횟수">
      <button class="set-check" data-act="wo-check" data-u="${ex.u}" data-i="${i}" aria-pressed="${!!st.done}" aria-label="${i + 1}세트 완료">${I('check')}</button>
    </div>`;
  }).join('');
  const allDone = ex.sets.length > 0 && ex.sets.every(s => s.done);
  return `<section class="excard${allDone ? ' all-done' : ''}">
    <div class="excard-head">
      <span class="ex-idx num" aria-hidden="true">${k + 1}</span>
      <button class="excard-name" data-act="open-ex" data-id="${esc(ex.exId)}">${esc(ex.name)}</button>
      <div class="excard-tools">
        <button class="icon-btn sm" data-act="wo-move" data-u="${ex.u}" data-dir="-1" ${k === 0 ? 'disabled' : ''} aria-label="위로">${I('up')}</button>
        <button class="icon-btn sm" data-act="wo-move" data-u="${ex.u}" data-dir="1" ${k === n - 1 ? 'disabled' : ''} aria-label="아래로">${I('dn')}</button>
        <button class="icon-btn sm" data-act="wo-remove-ex" data-u="${ex.u}" aria-label="${esc(ex.name)} 빼기">${I('x')}</button>
      </div>
    </div>
    <div class="excard-last">${lastLine}${target}</div>
    <div class="sets">
      <div class="set-h"><span>세트</span><span>지난번</span><span>kg</span><span>회</span><span></span></div>
      ${rows}
    </div>
    <div class="excard-foot">
      <div class="btns"><button class="btn btn-sm btn-soft" data-act="wo-add-set" data-u="${ex.u}">${I('plus')}세트 추가</button>${ex.sets.length > 1 ? `<button class="btn btn-sm btn-text" data-act="wo-del-set" data-u="${ex.u}" aria-label="마지막 세트 빼기">${I('minus')}세트 빼기</button>` : ''}</div>
      ${progressHtml(ex)}
    </div>
  </section>`;
}
function workoutHtml() {
  const a = S.active;
  const total = a.exercises.reduce((t, e) => t + e.sets.length, 0);
  const done = a.exercises.reduce((t, e) => t + e.sets.filter(s => s.done).length, 0);
  const vol = a.exercises.reduce((v, e) => v + metric(e.sets.filter(s => validDone(e, s)).map(s => ({ w: num(s.w), r: int(s.r) }))).vol, 0);
  const body = a.exercises.length
    ? a.exercises.map((e, k) => exCardHtml(e, k, a.exercises.length)).join('')
    : `<div class="wo-empty">아직 운동이 없어요.<br>아래 ‘운동 추가’를 눌러 오늘 할 운동을 고르세요.</div>`;
  return `<div class="wo" id="wo" role="dialog" aria-label="운동 기록 중">
    <header class="wo-head"><div class="wo-head-in">
      <button class="icon-btn" data-act="wo-minimize" aria-label="접어두기">${I('down')}</button>
      <div class="wo-title"><div class="wo-name">${esc(a.routineName || '자유 운동')}</div><div class="wo-sub">${fmtTime(a.startedAt)} 시작</div></div>
      <button class="btn btn-primary btn-sm" data-act="wo-finish">완료</button>
    </div>
    <div class="wo-stats">
      <div class="wo-stat"><span id="wo-elapsed" class="num">${fmtClock((Date.now() - a.startedAt) / 1000)}</span><small>운동 시간</small></div>
      <div class="wo-stat"><span class="num">${fmtInt(vol)}<em>kg</em></span><small>볼륨</small></div>
      <div class="wo-stat"><span class="num">${done}<em>/${total}</em></span><small>세트</small></div>
    </div>
    <div class="wo-bar" role="progressbar" aria-label="완료한 세트" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div>
    </header>
    <div class="wo-body">
      ${body}
      <button class="btn btn-ghost wide" data-act="wo-add-ex">${I('plus')}운동 추가</button>
      <button class="btn btn-text danger wide" data-act="wo-discard">이 운동 취소하기</button>
    </div>
    <div class="rest" id="rest" ${S.rest ? '' : 'hidden'}>
      <div class="rest-prog" id="rest-prog"></div>
      <div class="rest-in">
        <div><div class="rest-label">휴식</div><div class="rest-time num" id="rest-time">0:00</div></div>
        <div class="rest-btns"><button data-act="rest-adj" data-d="-15" aria-label="15초 줄이기">−15</button><button data-act="rest-adj" data-d="15" aria-label="15초 늘리기">+15</button><button data-act="rest-skip">건너뛰기</button></div>
      </div>
    </div>
  </div>`;
}

/* ---------- sheets ---------- */
const topSheet = () => S.sheets[S.sheets.length - 1];
function pushSheet(s) { S.sheets.push(s); S.sheetEnter = true; render(); }
function popSheet() { S.sheets.pop(); render(); }
function confirmSheet(o) { pushSheet({ kind: 'confirm', ...o }); }

function sheetHtml(t) {
  const f = SHEETS[t.kind];
  if (!f) return '';
  const { title, body, foot } = f(t);
  return `<div class="backdrop" data-act="sheet-bg"></div>
    <div class="sheet${S.sheetEnter ? ' enter' : ''}" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head"><h2 id="sheet-title">${title}</h2><button class="icon-btn" data-act="sheet-close" aria-label="닫기">${I('x')}</button></div>
      <div class="sheet-body">${body}</div>
      ${foot ? `<div class="sheet-foot">${foot}</div>` : ''}
    </div>`;
}

const SHEETS = {
  confirm: t => ({
    title: esc(t.title),
    body: `<p class="confirm-msg">${esc(t.msg)}</p>`,
    foot: `<div class="row2">${t.alt ? `<button class="btn" data-act="${t.alt.act}">${esc(t.alt.label)}</button>` : `<button class="btn" data-act="sheet-close">취소</button>`}<button class="btn ${t.danger ? 'btn-danger' : 'btn-primary'}" data-act="confirm-ok">${esc(t.ok)}</button></div>`,
  }),

  routine: t => {
    const r = S.routines.find(x => x.id === t.id);
    if (!r) return { title: '루틴', body: '<p class="empty">삭제된 루틴이에요.</p>' };
    const last = idx().routineLast.get(r.id);
    const list = (r.exercises || []).map(e => {
      const info = exInfo(e.exId);
      return `<li><button class="rd-ex" data-act="open-ex" data-id="${esc(e.exId)}">
        <span class="rd-top"><span class="rd-name">${esc(info.name)}</span><span class="rd-target">${e.sets}세트 × ${esc(e.reps || '-')}회${e.weight != null ? ' · ' + fmtW(e.weight) + 'kg' : ''}</span></span>
        <span class="rd-last">${lastHtml(e.exId)}</span></button></li>`;
    }).join('');
    return {
      title: esc(r.name),
      body: `${r.note ? `<p class="muted" style="margin-bottom:6px">${esc(r.note)}</p>` : ''}
        <p class="kv">마지막으로 한 날: <b>${last ? fmtDate(last) + ' · ' + relDay(last) : '아직 안 해봤어요'}</b></p>
        <ol class="rd-list">${list}</ol>`,
      foot: `<button class="btn btn-primary wide" data-act="start-routine" data-id="${esc(r.id)}">${I('play')}이 루틴으로 운동 시작</button>
        <div class="row3"><button class="btn btn-sm" data-act="edit-routine" data-id="${esc(r.id)}">${I('edit')}편집</button><button class="btn btn-sm" data-act="dup-routine" data-id="${esc(r.id)}">${I('copy')}복제</button><button class="btn btn-sm btn-danger" data-act="del-routine" data-id="${esc(r.id)}">${I('trash')}삭제</button></div>`,
    };
  },

  editor: t => {
    const d = t.draft;
    const n = d.exercises.length;
    const rows = d.exercises.map((e, i) => {
      const info = exInfo(e.exId);
      return `<div class="ed-row">
        <div class="ed-top"><span class="ed-name">${esc(info.name)}</span>
          <span class="ed-tools"><button class="icon-btn sm" data-act="ed-move" data-i="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="위로">${I('up')}</button><button class="icon-btn sm" data-act="ed-move" data-i="${i}" data-dir="1" ${i === n - 1 ? 'disabled' : ''} aria-label="아래로">${I('dn')}</button><button class="icon-btn sm" data-act="ed-remove" data-i="${i}" aria-label="${esc(info.name)} 빼기">${I('x')}</button></span></div>
        <div class="ed-last">지난번 · ${lastHtml(e.exId)}</div>
        <div class="ed-fields">
          <span class="stepper"><button data-act="ed-sets" data-i="${i}" data-d="-1" aria-label="세트 줄이기">${I('minus')}</button><span class="num">${e.sets}</span><small>세트</small><button data-act="ed-sets" data-i="${i}" data-d="1" aria-label="세트 늘리기">${I('plus')}</button></span>
          <label class="mini"><input id="ed-reps-${i}" data-field="ed-reps" data-i="${i}" value="${esc(e.reps ?? '')}" placeholder="8-12" maxlength="10" autocomplete="off" aria-label="${esc(info.name)} 목표 횟수"><small>회</small></label>
          <label class="mini"><input id="ed-w-${i}" data-field="ed-w" data-i="${i}" value="${esc(e.weight ?? '')}" placeholder="—" inputmode="decimal" autocomplete="off" aria-label="${esc(info.name)} 목표 무게"><small>kg (선택)</small></label>
        </div>
      </div>`;
    }).join('');
    return {
      title: d.id ? '루틴 편집' : '새 루틴',
      body: `<label class="field"><span>루틴 이름</span><input id="ed-name" class="txt" data-field="ed-name" value="${esc(d.name)}" maxlength="40" placeholder="예: 상체 A, 월요일 하체" autocomplete="off"></label>
        <label class="field"><span>메모 (선택)</span><input id="ed-note" class="txt" data-field="ed-note" value="${esc(d.note || '')}" maxlength="80" placeholder="예: 가슴 · 삼두" autocomplete="off"></label>
        <div class="field" style="margin-bottom:6px"><span>운동 ${n ? n + '개' : ''}</span></div>
        ${n ? `<div class="ed-list">${rows}</div>` : '<p class="empty" style="padding-top:0">아직 운동이 없어요. 아래 버튼으로 추가하세요.</p>'}
        <button class="btn btn-ghost wide" data-act="ed-add">${I('plus')}운동 추가</button>`,
      foot: `<div class="row2"><button class="btn" data-act="sheet-close">취소</button><button class="btn btn-primary" data-act="ed-save">저장</button></div>`,
    };
  },

  picker: p => {
    const n = p.sel.length;
    return {
      title: p.target === 'editor' ? '루틴에 넣을 운동' : '운동 추가',
      body: `<div class="search">${I('search')}<input id="pk-q" class="txt" type="search" data-field="pk-q" placeholder="운동 이름 검색 (예: 벤치)" value="${esc(p.q)}" autocomplete="off" enterkeyhint="search"></div>
        <div class="chips" role="group" aria-label="부위">${['전체', ...CATS].map(c => `<button class="chip" data-act="pk-cat" data-cat="${c}" aria-pressed="${p.cat === c}">${c}</button>`).join('')}</div>
        <div id="pk-list" style="margin-top:6px">${pickerListHtml(p)}</div>`,
      foot: `<button class="btn btn-primary wide" data-act="pk-done" id="pk-done" ${n ? '' : 'disabled'}>${n ? n + '개 추가하기' : '추가할 운동을 고르세요'}</button>`,
    };
  },

  ex: t => {
    const info = exInfo(t.id, idx().last.get(t.id)?.ex.name);
    const hist = S.sessions.map(s => ({ s, ex: (s.exercises || []).find(e => e.exId === t.id) })).filter(h => h.ex && h.ex.sets.length);
    if (!hist.length) {
      return { title: esc(info.name), body: `<p class="muted">${esc(info.cat)}</p><p class="empty">아직 기록이 없어요. 루틴에 넣고 한 번 해 보면 여기에 쌓여요.</p>` };
    }
    const b = idx().best.get(t.id) || {};

function topEditor() { for (let i = S.sheets.length - 1; i >= 0; i--) if (S.sheets[i].kind === 'editor') return S.sheets[i]; return null; }

function sparkline(pts) {
  const W = 320, H = 132, pl = 6, pr = 66, pt = 14, pb = 24;
  const vs = pts.map(p => p.v);
  const vmax = Math.max(...vs), vmin = Math.min(...vs);
  let hi = vmax, lo = vmin;
  if (hi - lo < 1) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.12; hi += pad; lo -= pad;
  const n = pts.length;
  const x = i => pl + (i * (W - pl - pr)) / (n - 1);
  const y = v => pt + ((hi - v) * (H - pt - pb)) / (hi - lo);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `M${x(0).toFixed(1)},${(H - pb).toFixed(1)} L${line.split(' ').join(' L')} L${x(n - 1).toFixed(1)},${(H - pb).toFixed(1)} Z`;
  const lastV = pts[n - 1].v;
  const yMax = y(vmax), yMin = y(vmin), yLast = y(lastV);
  const labels = [`<text class="sp-txt hi" x="${W - pr + 8}" y="${(yLast + 4).toFixed(1)}">${fmtW(round1(lastV))}</text>`];
  if (Math.abs(yMax - yLast) > 14) labels.push(`<text class="sp-txt" x="${W - pr + 8}" y="${(yMax + 4).toFixed(1)}">최고 ${fmtW(round1(vmax))}</text>`);
  if (Math.abs(yMin - yLast) > 14 && Math.abs(yMin - yMax) > 14) labels.push(`<text class="sp-txt" x="${W - pr + 8}" y="${(yMin + 4).toFixed(1)}">${fmtW(round1(vmin))}</text>`);
  const d0 = new Date(pts[0].t), d1 = new Date(pts[n - 1].t);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 ${n}번 기록 추이, 마지막 ${fmtW(round1(lastV))}">
    <line class="sp-grid" x1="${pl}" x2="${W - pr}" y1="${yMax.toFixed(1)}" y2="${yMax.toFixed(1)}"/>
    <line class="sp-grid" x1="${pl}" x2="${W - pr}" y1="${yMin.toFixed(1)}" y2="${yMin.toFixed(1)}"/>
    <path class="sp-area" d="${area}" opacity=".7"/>
    <polyline class="sp-line" points="${line}"/>
    <circle class="sp-dot" cx="${x(n - 1).toFixed(1)}" cy="${yLast.toFixed(1)}" r="4.5"/>
    ${labels.join('')}
    <text class="sp-txt" x="${pl}" y="${H - 6}">${d0.getMonth() + 1}/${d0.getDate()}</text>
    <text class="sp-txt" x="${W - pr}" y="${H - 6}" text-anchor="end">${d1.getMonth() + 1}/${d1.getDate()}</text>
  </svg>`;
}

/* ---------- workout logic ---------- */
function mkWoEx(exId, t) {
  const info = exInfo(exId, t && t.name);
  const L = idx().last.get(exId);
  const n = clamp((t && t.sets) || (L ? L.ex.sets.length : 0) || 3, 1, 20);
  const target = t && (t.reps || t.weight != null) ? { sets: t.sets || n, reps: t.reps || '', weight: t.weight ?? null } : null;
  return { u: uid(), exId, name: info.name, bw: !!info.bw, target, sets: Array.from({ length: n }, () => ({ w: '', r: '', done: false })) };
}
function guardStart(fn) {
  if (!S.activeReady) { toast('아직 불러오는 중이에요. 잠시만요.'); return; }
  if (!S.active) { fn(); return; }
  confirmSheet({
    title: '진행 중인 운동이 있어요',
    msg: `‘${S.active.routineName || '자유 운동'}’ 운동이 아직 진행 중이에요. 이어서 할까요, 아니면 지금 운동을 버리고 새로 시작할까요?`,
    ok: '버리고 새로 시작', danger: true,
    alt: { label: '이어서 하기', act: 'resume-active' },
    onOk: () => { discardWorkout(true); fn(); },
  });
}
function startWorkout(name, routineId, items) {
  S.active = { id: uid(), routineId: routineId || null, routineName: name || '자유 운동', startedAt: Date.now(), updatedAt: Date.now(), exercises: items.map(it => mkWoEx(it.exId, it)) };
  S.sheets = []; S.workoutOpen = true; S.rest = null;
  touchActive(); flushActive();
  keepAwake(true);
  render();
  const wo = $('#wo'); if (wo) wo.scrollTop = 0;
}
function discardWorkout(silent) {
  S.active = null; S.workoutOpen = false; S.rest = null;
  clearActiveEverywhere();
  keepAwake(false);
  if (!silent) { S.sheets = []; render(); toast('운동을 취소했어요'); }
}
function checkSet(u, i) {
  ensureAudio();
  const ex = findEx(u); if (!ex) return;
  const st = ex.sets[i]; if (!st) return;
  if (st.done) { st.done = false; touchActive(); render(); return; }
  const f = fillFor(ex, i);
  const wTxt = String(st.w).trim(), rTxt = String(st.r).trim();
  const w = wTxt === '' ? f.w : num(wTxt);
  const r = rTxt === '' ? f.r : int(rTxt);
  if (wTxt !== '' && w == null) { toast('무게는 숫자로 입력해 주세요 (예: 62.5)'); focusField('w', u, i); return; }
  if (w == null && !ex.bw) { toast('무게를 입력해 주세요'); focusField('w', u, i); return; }
  if (r == null || r <= 0) { toast(rTxt !== '' ? '횟수는 숫자로 입력해 주세요' : '몇 회 했는지 입력해 주세요'); focusField('r', u, i); return; }
  st.w = w == null ? '' : fmtW(w);
  st.r = String(r);
  st.cw = st.w; st.cr = st.r;
  st.done = true;
  S.pop = u + ':' + i;
  const all = S.active.exercises.every(e => e.sets.every(s => s.done));
  if (all) { S.rest = null; toast('모든 세트 완료! 위의 ‘완료’를 눌러 저장하세요', 3200); }
  else { const sec = prof().rest; S.rest = { end: Date.now() + sec * 1000, total: sec * 1000 }; }
  touchActive();
  render();
}
function focusField(kind, u, i) { const el = document.getElementById(`${kind}-${u}-${i}`); if (el) { el.focus(); try { el.select(); } catch {} } }
function refreshPlaceholders(ex) {
  ex.sets.forEach((st, i) => {
    if (st.done) return;
    const ph = placeholders(ex, i);
    const w = document.getElementById(`w-${ex.u}-${i}`), r = document.getElementById(`r-${ex.u}-${i}`);
    if (w) w.placeholder = ph.w;
    if (r) r.placeholder = ph.r;
  });
}
function routineChanged(a, r) {
  const x = a.exercises.map(e => e.exId + ':' + e.sets.length).join('|');
  const y = (r.exercises || []).map(e => e.exId + ':' + e.sets).join('|');
  return x !== y;
}
function commonReps(e) {
  const counts = new Map();
  for (const s of e.sets) { const r = int(s.r); if (r) counts.set(r, (counts.get(r) || 0) + 1); }
  let best = null, bc = 0;
  for (const [r, c] of counts) if (c > bc) { best = r; bc = c; }
  return best;
}
function finishWorkout(upd) {
  const a = S.active; if (!a) return;
  const before = idx();
  const exs = a.exercises.map(e => ({ exId: e.exId, name: e.name, bw: !!e.bw, sets: e.sets.filter(s => validDone(e, s)).map(s => ({ w: num(s.w), r: int(s.r) })) })).filter(e => e.sets.length);
  if (!exs.length) return;
  const now = Date.now();
  const m = exs.reduce((acc, e) => { const k = metric(e.sets); acc.vol += k.vol; acc.n += e.sets.length; return acc; }, { vol: 0, n: 0 });
  const session = { id: a.id, routineId: a.routineId || null, routineName: a.routineName || '자유 운동', startedAt: a.startedAt, endedAt: now, exercises: exs, volume: Math.round(m.vol * 10) / 10, setCount: m.n };
  const prs = [], cmp = [];
  for (const e of exs) {
    const b = before.best.get(e.exId);
    const top = Math.max(...e.sets.map(s => e1rm(s.w, s.r)));
    if (!e.bw && b && b.e1 > 0 && top > b.e1 + 0.05) prs.push({ name: e.name, from: b.e1, to: top });
    const L = before.last.get(e.exId);
    const cur = metric(e.sets);
    if (!L) { cmp.push({ name: e.name, txt: '첫 기록', up: false }); continue; }
    const prev = metric(L.ex.sets);
    if (cur.vol > 0 && prev.vol > 0) {
      const d = cur.vol - prev.vol;
      cmp.push({ name: e.name, txt: d > 0 ? `+${fmtInt(d)}kg` : d < 0 ? `${fmtInt(d)}kg` : '지난번과 같음', up: d > 0, dn: d < 0 });
    } else {
      const d = cur.reps - prev.reps;
      cmp.push({ name: e.name, txt: d > 0 ? `+${d}회` : d < 0 ? `${d}회` : '지난번과 같음', up: d > 0, dn: d < 0 });
    }
  }
  S.sessions = sortSessions([session, ...S.sessions.filter(s => s.id !== session.id)]);
  const r = a.routineId && S.routines.find(x => x.id === a.routineId);
  if (upd && r) {
    const r2 = clone(r);
    r2.exercises = a.exercises.map(e => {
      const old = (r.exercises || []).find(x => x.exId === e.exId);
      return { exId: e.exId, sets: clamp(e.sets.length, 1, 20), reps: (old && old.reps) || String(commonReps(e) || 10), weight: old && old.weight != null ? old.weight : null };
    });
    r2.updatedAt = now;
    S.routines = sortRoutines(S.routines.map(x => x.id === r.id ? r2 : x));
    store.saveRoutine(r2);
  }
  const queued = writeOb([...readOb().filter(x => x.id !== session.id), session]);
  lastSendErr = null;
  const sent = sendSession(session);
  S.active = null; S.workoutOpen = false; S.rest = null;
  clearTimeout(actTimer); actTimer = null; clearMirror();
  sent.then(ok => {
    if (ok && !S.active && store.kind === 'cloud') store.saveActive(null);
    if (!ok && queued && store.kind === 'cloud' && !['quota_exceeded', 'invalid_argument', 'revoked'].includes(lastSendErr)) {
      toast('기록을 아직 계정에 올리지 못했어요. 이 기기에 보관해 두고 다시 올릴게요.', 4200);
    }
  });
  keepAwake(false);
  S.tab = 'history'; lsSet('setnote:tab', 'history');
  S.sheets = [{ kind: 'done', session, prs, cmp }];
  S.sheetEnter = true;
  render();
  window.scrollTo(0, 0);
}

/* ---------- rest timer, wake lock, sound ---------- */
let actx = null, wakeLock = null;
function ensureAudio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch {}
}
function beep() {
  if (!actx) return;
  try {
    const t0 = actx.currentTime;
    [0, 0.22].forEach(off => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0 + off);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.16);
      o.connect(g).connect(actx.destination);
      o.start(t0 + off); o.stop(t0 + off + 0.18);
    });
  } catch {}
}
async function keepAwake(on) {
  try {
    if (on) {
      if (wakeLock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch { wakeLock = null; }
}
function restDone() {
  if (prof().sound) beep();
  try { navigator.vibrate && navigator.vibrate([180, 90, 180]); } catch {}
  toast('휴식 끝! 다음 세트 가요', 2600);
}
function tickUi() {
  if (S.rest && S.rest.end - Date.now() <= 0) { S.rest = null; restDone(); const pr = $('#pill-root'); if (pr && S.active && !S.workoutOpen) pr.innerHTML = pillHtml(); }
  if (S.active) {
    const el = $('#wo-elapsed'); if (el) el.textContent = fmtClock((Date.now() - S.active.startedAt) / 1000);
    const pl = $('#pill-time');
    if (pl) pl.textContent = S.rest ? fmtClock((S.rest.end - Date.now()) / 1000) : fmtClock((Date.now() - S.active.startedAt) / 1000);
  }
  const rest = $('#rest');
  if (rest) {
    rest.hidden = !S.rest;
    if (S.rest) {
      const left = S.rest.end - Date.now();
      $('#rest-time').textContent = fmtClock(Math.ceil(left / 1000));
      $('#rest-prog').style.width = clamp(100 - (left / S.rest.total) * 100, 0, 100) + '%';
    }
  }
}
setInterval(tickUi, 250);

/* ---------- theme, install, back button ---------- */
/* The claude.ai host may set :root[data-theme] itself. "시스템" hands the attribute back to it,
   and a host change while the user picked light/dark is overridden again. The web build has no host. */
const THEMES = [['system', '시스템'], ['light', '밝게'], ['dark', '어둡게']];
const rootEl = document.documentElement;
let hostTheme = window.SETNOTE_WEB ? null : rootEl.getAttribute('data-theme'), ownTheme;
function themePref() { const v = lsGet('setnote:theme'); return v === 'light' || v === 'dark' ? v : 'system'; }
function applyTheme() {
  const pref = themePref();
  ownTheme = pref === 'system' ? hostTheme : pref;
  if (ownTheme) rootEl.setAttribute('data-theme', ownTheme); else rootEl.removeAttribute('data-theme');
  /* status bar colour in the installed app follows the chosen theme, not only the phone's */
  const bg = getComputedStyle(rootEl).getPropertyValue('--bg').trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    if (m.dataset.sys == null) m.dataset.sys = m.content;
    m.content = pref === 'system' ? m.dataset.sys : bg;
  });
}
new MutationObserver(() => {
  const cur = rootEl.getAttribute('data-theme');
  if (cur === ownTheme) return;
  hostTheme = cur;
  applyTheme();
}).observe(rootEl, { attributes: true, attributeFilter: ['data-theme'] });

/* Android back button in the web build: one history entry stands for "a sheet or the workout is open",
