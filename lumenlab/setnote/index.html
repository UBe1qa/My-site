/* ---------- backup ---------- */
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
async function doExport() {
  const data = { app: 'setnote', version: 1, exportedAt: new Date().toISOString(), routines: S.routines, sessions: S.sessions, profile: S.profile };
  const json = JSON.stringify(data, null, 2);
  const filename = `setnote-backup-${ymd(new Date())}.json`;
  if (isWeb()) {
    /* phones: the share sheet lets people keep the file in Files, Drive or a chat; share must run
       before any await or Safari drops the tap. Chrome only shares some file types, so JSON falls to download. */
    try {
      const file = new File([json], filename, { type: 'application/json' });
      if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: '세트노트 백업' });
        toast('백업 파일을 보냈어요');
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      toast('백업 파일을 저장했어요');
      return;
    } catch {}
  }
  const dl = await use('downloads');
  if (dl) {
    try { await dl.save({ filename, data: json }); toast('백업 파일을 저장했어요'); return; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') return;
      if (c === 'rate_limited') { toast('잠시 후 다시 눌러 주세요'); return; }
    }
  }
  pushSheet({ kind: 'exportText', json });
}
function cleanRoutine(r) {
  if (!r || typeof r !== 'object' || typeof r.id !== 'string' || !ID_RE.test(r.id) || !Array.isArray(r.exercises)) return null;
  return {
    id: r.id, name: String(r.name || '루틴').slice(0, 40), note: String(r.note || '').slice(0, 80),
    exercises: r.exercises.filter(e => e && typeof e.exId === 'string' && ID_RE.test(e.exId)).slice(0, 40).map(e => ({ exId: e.exId, sets: clamp(parseInt(e.sets, 10) || 3, 1, 20), reps: String(e.reps ?? '10').slice(0, 10), weight: num(e.weight) })),
    createdAt: Number(r.createdAt) || Date.now(), updatedAt: Number(r.updatedAt) || Date.now(),
  };
}
function cleanSession(s) {
  if (!s || typeof s !== 'object' || typeof s.id !== 'string' || !ID_RE.test(s.id) || !Array.isArray(s.exercises) || !isFinite(Number(s.endedAt))) return null;
  const exs = s.exercises.filter(e => e && typeof e.exId === 'string' && ID_RE.test(e.exId) && Array.isArray(e.sets)).slice(0, 40).map(e => ({
    exId: e.exId, name: String(e.name || exInfo(e.exId).name).slice(0, 40), bw: !!e.bw,
    sets: e.sets.slice(0, 50).map(st => ({ w: num(st && st.w), r: int(st && st.r) || 0 })).filter(st => st.r > 0),
  })).filter(e => e.sets.length);
  if (!exs.length) return null;
  const m = exs.reduce((a, e) => { const k = metric(e.sets); a.vol += k.vol; a.n += e.sets.length; return a; }, { vol: 0, n: 0 });
  const endedAt = Number(s.endedAt);
  const startedAt = isFinite(Number(s.startedAt)) && Number(s.startedAt) <= endedAt ? Number(s.startedAt) : endedAt;
  return { id: s.id, routineId: typeof s.routineId === 'string' && ID_RE.test(s.routineId) ? s.routineId : null, routineName: String(s.routineName || '자유 운동').slice(0, 40), startedAt, endedAt, exercises: exs, volume: Math.round(m.vol * 10) / 10, setCount: m.n };
}
function cleanCustom(c) {
  if (!c || typeof c.id !== 'string' || !ID_RE.test(c.id) || !c.name) return null;
  return { id: c.id, name: String(c.name).slice(0, 40), cat: CATS.includes(c.cat) ? c.cat : '기타', bw: !!c.bw };
}
function readImport(file) {
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { toast('파일이 너무 커요'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    let d;
    try { d = JSON.parse(String(fr.result)); } catch { toast('백업 파일을 읽지 못했어요. 세트노트에서 내보낸 JSON 파일인지 확인해 주세요.', 3600); return; }
    const rs = (Array.isArray(d && d.routines) ? d.routines : []).map(cleanRoutine).filter(Boolean);
    const ss = (Array.isArray(d && d.sessions) ? d.sessions : []).map(cleanSession).filter(Boolean);
    const cust = (d && d.profile && Array.isArray(d.profile.custom) ? d.profile.custom : []).map(cleanCustom).filter(Boolean);
    if (!rs.length && !ss.length && !cust.length) { toast('가져올 루틴이나 기록이 없어요'); return; }
    confirmSheet({
      title: '백업 가져오기',
      msg: `루틴 ${rs.length}개, 운동 기록 ${ss.length}개${cust.length ? `, 직접 만든 운동 ${cust.length}개` : ''}를 가져올까요? 같은 항목이 이미 있으면 백업 내용으로 바뀌어요.`,
      ok: '가져오기',
      onOk: () => importData(rs, ss, cust),
    });
  };
  fr.onerror = () => toast('파일을 읽지 못했어요');
  fr.readAsText(file);
}
async function importData(rs, ss, cust) {
  if (cust.length && !profileReady()) return;
  const rIds = new Set(rs.map(r => r.id)), sIds = new Set(ss.map(s => s.id));
  S.routines = sortRoutines([...S.routines.filter(r => !rIds.has(r.id)), ...rs]);
  S.sessions = sortSessions([...S.sessions.filter(s => !sIds.has(s.id)), ...ss]);
  if (cust.length) {
    const have = new Map(prof().custom.map(c => [c.id, c]));
    cust.forEach(c => have.set(c.id, c));
    S.profile = { ...S.profile, custom: [...have.values()] };
  }
  S.sheets = [];
  render();
  if (store.kind === 'local') { await store.saveProfile(); toast('백업을 가져왔어요'); return; }
  toast('백업을 저장하는 중…', 60000);
  let fail = 0, n = 0;
  const total = rs.length + ss.length + (cust.length ? 1 : 0);
  const step = async fn => {
    try { await fn(); } catch { fail++; }
    n++;
    if (n % 15 === 0) toast(`백업 저장 중… ${n}/${total}`, 60000);
    await sleep(60);
  };
  if (cust.length) await step(() => store.saveProfile());
  for (const r of rs) { if (store.kind !== 'cloud') break; await step(() => store.saveRoutine(r)); }
  for (const s of ss) { if (store.kind !== 'cloud') break; await step(() => store.saveSession(s)); }
  if (store.kind === 'local') { await store.saveProfile(); toast('백업을 이 기기에 저장했어요'); return; }
  toast(fail ? `${total - fail}개 저장, ${fail}개는 저장하지 못했어요` : '백업을 모두 가져왔어요', 3600);
}

/* ---------- actions ---------- */
const A = {
  tab: d => { S.tab = d.tab; lsSet('setnote:tab', d.tab); render(); window.scrollTo(0, 0); },
  settings: () => pushSheet({ kind: 'settings' }),
  'sheet-close': () => popSheet(),
  'sheet-bg': () => { const t = topSheet(); if (t && !['editor', 'finish', 'picker'].includes(t.kind)) popSheet(); },
  'confirm-ok': () => { const t = topSheet(); S.sheets.pop(); if (t && t.onOk) t.onOk(); render(); },
  migrate: () => migrateLocal(),
  'migrate-hide': () => { S.migrateHidden = true; render(); },
  'retry-cloud': () => { if (S.deniedUid) lsDel('setnote:cloud-denied:' + S.deniedUid); S.deniedUid = null; toast('페이지를 새로고침하면 계정 저장을 다시 시도해요', 3600); render(); },
  'resume-active': () => { S.sheets = []; S.workoutOpen = true; keepAwake(true); render(); },

  'new-routine': () => pushSheet({ kind: 'editor', draft: { id: null, name: '', note: '', exercises: [] } }),
  'open-routine': d => pushSheet({ kind: 'routine', id: d.id }),
  'start-routine': d => { const r = S.routines.find(x => x.id === d.id); if (r) guardStart(() => startWorkout(r.name, r.id, r.exercises || [])); },
  'start-empty': () => guardStart(() => startWorkout('자유 운동', null, [])),
  'tpl-save': d => saveTemplate(d.key, false),
  'tpl-start': d => saveTemplate(d.key, true),
  'edit-routine': d => { const r = S.routines.find(x => x.id === d.id); if (r) pushSheet({ kind: 'editor', draft: clone(r) }); },
  'dup-routine': d => {
    const r = S.routines.find(x => x.id === d.id); if (!r) return;
    const now = Date.now();
    const c = { ...clone(r), id: uid(), name: (r.name + ' 복사').slice(0, 40), createdAt: now, updatedAt: now };
    S.routines = sortRoutines([...S.routines, c]);
    store.saveRoutine(c);
    S.sheets = S.sheets.filter(s => !(s.kind === 'routine' && s.id === r.id));
    S.sheets.push({ kind: 'routine', id: c.id });
    toast(`‘${c.name}’ 루틴을 만들었어요`);
    render();
  },
  'del-routine': d => {
    const r = S.routines.find(x => x.id === d.id); if (!r) return;
    confirmSheet({
      title: '루틴 삭제', msg: `‘${r.name}’ 루틴을 삭제할까요? 지금까지의 운동 기록은 그대로 남아요.`, ok: '삭제', danger: true,
      onOk: () => { S.routines = S.routines.filter(x => x.id !== r.id); store.deleteRoutine(r.id); if (S.mode === 'cloud') pruneV1({ r: [r.id] }); S.sheets = S.sheets.filter(s => !(s.kind === 'routine' && s.id === r.id)); toast('루틴을 삭제했어요'); },
    });
  },

  'ed-add': () => pushSheet({ kind: 'picker', target: 'editor', sel: [], q: '', cat: '전체', creating: false }),
  'ed-move': d => { const ed = topSheet(); const a = ed.draft.exercises; const i = +d.i, j = i + (+d.dir); if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; render(); },
  'ed-remove': d => { const ed = topSheet(); ed.draft.exercises.splice(+d.i, 1); render(); },
  'ed-sets': d => { const ed = topSheet(); const e = ed.draft.exercises[+d.i]; if (!e) return; e.sets = clamp((parseInt(e.sets, 10) || 3) + (+d.d), 1, 20); render(); },
  'ed-save': () => saveDraft(),

  'pk-cat': d => { const p = topSheet(); p.cat = d.cat; render(); },
  'pk-toggle': d => { const p = topSheet(); const k = p.sel.indexOf(d.id); if (k >= 0) p.sel.splice(k, 1); else p.sel.push(d.id); render(); },
  'pk-create': () => { const p = topSheet(); p.creating = true; render(); },
  'pk-create-cat': d => { const p = topSheet(); createCustom(p.q, d.cat); },
  'pk-done': () => applyPicker(),

  'ex-cat': d => { S.exCat = d.cat; render(); },
  'open-ex': d => pushSheet({ kind: 'ex', id: d.id }),

  'open-session': d => pushSheet({ kind: 'session', id: d.id }),
  'del-session': d => {
    const s = S.sessions.find(x => x.id === d.id); if (!s) return;
    confirmSheet({
      title: '기록 삭제', msg: `${fmtDate(s.endedAt)} ‘${s.routineName || '자유 운동'}’ 기록을 삭제할까요? 되돌릴 수 없어요.`, ok: '삭제', danger: true,
      onOk: () => { S.sessions = S.sessions.filter(x => x.id !== s.id); writeOb(readOb().filter(x => x.id !== s.id)); store.deleteSession(s.id); if (S.mode === 'cloud') pruneV1({ s: [s.id] }); S.sheets = S.sheets.filter(x => !(x.kind === 'session' && x.id === s.id)); toast('기록을 삭제했어요'); },
    });
  },
  'repeat-session': d => {
    const s = S.sessions.find(x => x.id === d.id); if (!s) return;
    const r = s.routineId && S.routines.find(x => x.id === s.routineId);
    guardStart(() => startWorkout(s.routineName, r ? r.id : null, (s.exercises || []).map(e => {
      const re = r && (r.exercises || []).find(x => x.exId === e.exId);
      return { exId: e.exId, name: e.name, sets: e.sets.length, reps: re ? re.reps : '', weight: re ? re.weight : null };
    })));
  },

  'wo-open': () => { S.workoutOpen = true; keepAwake(true); render(); },
  'wo-minimize': () => { S.workoutOpen = false; flushActive(); render(); },
  'wo-check': d => checkSet(d.u, +d.i),
  'wo-copy-prev': d => {
    const ex = findEx(d.u); if (!ex) return;
    const st = ex.sets[+d.i]; const p = fillFor(ex, +d.i).prev; if (!st || !p) return;
    st.w = p.w == null ? '' : fmtW(p.w); st.r = p.r == null ? '' : String(p.r);
    touchActive(); render();
  },
  'wo-add-set': d => {
    const ex = findEx(d.u); if (!ex) return;
    if (ex.sets.length >= 30) { toast('세트는 30개까지 넣을 수 있어요'); return; }
    ex.sets.push({ w: '', r: '', done: false }); touchActive(); render();
  },
  'wo-del-set': d => { const ex = findEx(d.u); if (!ex || ex.sets.length <= 1) return; ex.sets.pop(); touchActive(); render(); },
  'wo-move': d => {
    const a = S.active.exercises; const i = a.findIndex(e => e.u === d.u); const j = i + (+d.dir);
    if (i < 0 || j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]]; touchActive(); render();
  },
  'wo-remove-ex': d => {
    const ex = findEx(d.u); if (!ex) return;
    const rm = () => { S.active.exercises = S.active.exercises.filter(e => e.u !== d.u); touchActive(); };
    if (ex.sets.some(s => s.done)) confirmSheet({ title: '운동 빼기', msg: `‘${ex.name}’에 완료한 세트가 있어요. 빼면 이 운동의 오늘 기록이 사라져요.`, ok: '빼기', danger: true, onOk: rm });
    else { rm(); render(); }
  },
  'wo-add-ex': () => pushSheet({ kind: 'picker', target: 'workout', sel: [], q: '', cat: '전체', creating: false }),
  'wo-finish': () => { flushActive(); pushSheet({ kind: 'finish', upd: false }); },
  'wo-discard': () => confirmSheet({ title: '운동 취소', msg: '지금까지 입력한 세트가 모두 사라져요. 취소할까요?', ok: '운동 취소', danger: true, onOk: () => discardWorkout(false) }),
  'wo-discard-now': () => discardWorkout(false),
  'fin-toggle': () => { const t = topSheet(); t.upd = !t.upd; render(); },
  'fin-save': () => { const t = topSheet(); finishWorkout(!!(t && t.upd)); },
  'rest-adj': d => {
    if (!S.rest) return;
    const delta = (+d.d) * 1000;
    S.rest.end += delta;
    S.rest.total = Math.max(1000, S.rest.total + delta);
    tickUi();
  },
  'rest-skip': () => { S.rest = null; tickUi(); },

  'set-rest': d => { if (!profileReady()) return; S.profile = { ...S.profile, rest: +d.v }; store.saveProfile(); render(); },
  'set-sound': () => { if (!profileReady()) return; ensureAudio(); S.profile = { ...S.profile, sound: !prof().sound }; store.saveProfile(); render(); },
  'del-custom': d => {
    const c = prof().custom.find(x => x.id === d.id); if (!c) return;
    if (!profileReady()) return;
    confirmSheet({
      title: '운동 삭제', msg: `‘${c.name}’을(를) 목록에서 지울까요? 이미 저장된 기록은 남아요.`, ok: '삭제', danger: true,
      onOk: () => { S.profile = { ...S.profile, custom: prof().custom.filter(x => x.id !== c.id) }; store.saveProfile(); if (S.mode === 'cloud') pruneV1({ c: [c.id] }); },
    });
  },
  export: () => doExport(),
  'set-theme': d => { if (d.v === 'light' || d.v === 'dark') lsSet('setnote:theme', d.v); else lsDel('setnote:theme'); applyTheme(); render(); },
  install: () => doInstall(),
  'install-hide': () => { lsSet('setnote:install-hide', '1'); render(); },
  'copy-export': () => {
    const box = $('#export-box'); if (!box) return;
    const text = box.value;
    const fallback = () => { box.focus(); box.select(); toast('선택된 내용을 복사하세요'); };
    try {
      navigator.clipboard.writeText(text).then(() => toast('복사했어요'), fallback);
    } catch { fallback(); }
  },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (!fn) return;
  e.preventDefault();
  if (performance.now() - sheetChangedAt < 350) return;
  if (!store && !['tab', 'settings', 'sheet-close', 'sheet-bg', 'ex-cat', 'open-ex', 'open-routine', 'open-session', 'set-theme', 'install', 'install-hide'].includes(t.dataset.act)) { toast('아직 불러오는 중이에요. 잠시만요.'); return; }
  fn(t.dataset, t, e);
});

const FIELDS = {
  'ex-q': el => { S.exQ = el.value; const l = $('#ex-list'); if (l) l.innerHTML = exListHtml(); },
  'pk-q': el => {
    const p = topSheet(); if (!p || p.kind !== 'picker') return;
    p.q = el.value; p.creating = false;
    const l = $('#pk-list'); if (l) l.innerHTML = pickerListHtml(p);
  },
  w: el => { const ex = findEx(el.dataset.u); if (!ex) return; const st = ex.sets[+el.dataset.i]; if (!st) return; st.w = el.value; touchActive(); refreshPlaceholders(ex); },
  r: el => { const ex = findEx(el.dataset.u); if (!ex) return; const st = ex.sets[+el.dataset.i]; if (!st) return; st.r = el.value; touchActive(); refreshPlaceholders(ex); },
  'ed-name': el => { const ed = topSheet(); if (ed && ed.kind === 'editor') ed.draft.name = el.value; },
  'ed-note': el => { const ed = topSheet(); if (ed && ed.kind === 'editor') ed.draft.note = el.value; },
  'ed-reps': el => { const ed = topSheet(); const e = ed && ed.kind === 'editor' && ed.draft.exercises[+el.dataset.i]; if (e) e.reps = el.value; },
  'ed-w': el => { const ed = topSheet(); const e = ed && ed.kind === 'editor' && ed.draft.exercises[+el.dataset.i]; if (e) e.weight = el.value; },
};
document.addEventListener('input', e => {
  const el = e.target;
  const f = el.dataset && el.dataset.field;
  if (f && FIELDS[f]) FIELDS[f](el);
});
/* a completed set keeps a valid value: blank or bad edits revert to what was checked */
document.addEventListener('focusout', e => {
  if (rendering) return;
  const el = e.target, f = el.dataset && el.dataset.field;
  if (f !== 'w' && f !== 'r') return;
  const ex = findEx(el.dataset.u), st = ex && ex.sets[+el.dataset.i];
  if (!st || !st.done) return;
  const okW = v => (String(v ?? '').trim() === '' ? !!ex.bw : num(v) != null);
  const bad = f === 'r' ? !(int(st.r) > 0) : !okW(st.w);
  if (bad) {
    if (f === 'r' && int(st.cr) > 0) st.r = st.cr;
    else if (f === 'w' && st.cw != null && okW(st.cw)) st.w = st.cw;
    else st.done = false;
    toast(st.done ? '빈 값은 저장할 수 없어서 원래 값으로 되돌렸어요' : '값이 비어 있어서 체크를 해제했어요');
  } else if (f === 'w') { st.w = String(st.w).trim() === '' ? '' : fmtW(num(st.w)); st.cw = st.w; }
  else { st.r = String(int(st.r)); st.cr = st.r; }
  el.value = f === 'r' ? st.r : st.w;
  touchActive();
  setTimeout(() => { if (isTyping()) pendingRender = true; else scheduleRender(); }, 0);
});
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'imp-file') { readImport(e.target.files && e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && (el.dataset.field === 'w' || el.dataset.field === 'r')) {
    e.preventDefault();
    if (el.dataset.field === 'w') focusField('r', el.dataset.u, el.dataset.i);
    else {
      const ex = findEx(el.dataset.u), st = ex && ex.sets[+el.dataset.i];
      el.blur();
      if (st && !st.done) checkSet(el.dataset.u, +el.dataset.i);
    }
    return;
  }
  if (e.key === 'Enter' && el.dataset && el.dataset.field === 'pk-q') { e.preventDefault(); el.blur(); return; }
  if (e.key === 'Escape' && S.sheets.length) { e.preventDefault(); popSheet(); }
});

applyTheme();
boot();
})();
</script>

</body>
</html>
