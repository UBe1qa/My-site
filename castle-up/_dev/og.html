<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/site.css">
<!-- 공유 사진 1200×630: 노을 + 층마다 영웅이 선 탑 + 그 위를 덮는 화염 드래곤 + 로고 + 짧은 한 줄. bash _dev/check.sh og 로 찍는다. -->
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;position:relative;background:var(--hero-end)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(43,16,70,.9) 0%,rgba(58,22,80,.62) 38%,rgba(58,22,80,0) 64%),linear-gradient(0deg,rgba(58,22,80,.55),transparent 30%)}
.l{position:absolute;left:64px;top:56px;width:560px;z-index:3}
.l img{width:330px;filter:drop-shadow(0 8px 16px rgba(30,8,40,.55))}
.l .brand-text{font-size:92px;padding:30px 0 0}
.l h1{margin-top:26px;font-size:54px;white-space:nowrap;line-height:1.12;color:#fff;text-shadow:0 4px 0 rgba(58,22,80,.85),0 8px 20px rgba(30,8,50,.6)}
.boss-og{position:absolute;right:30px;top:70px;height:500px;width:auto;max-width:none;filter:drop-shadow(0 14px 22px rgba(60,10,0,.5))}
.tw.tw-og{position:absolute;left:640px;bottom:0;width:200px;--room:100px;z-index:2}
.hud{top:28px;right:44px;width:260px}
.hud-name{font-size:30px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="i-ice" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol></svg>
<img class="bg" src="/img/bg-autumn.webp" alt=""><div class="shade"></div>
<img class="boss-og" src="/img/b-dragon.webp" alt="">
<div class="hud" style="position:absolute"><b class="hud-name" id="bn"></b><span class="hud-weak" style="--c:var(--ice)"><svg viewBox="0 0 24 24"><use href="#i-ice"/></svg><span id="bw"></span></span><span class="hp"><i style="transform:scaleX(.62)"></i></span></div>
<div class="tw tw-og"><div class="tw-roof"><i class="tw-flag" style="animation:none"></i></div>
  <ul class="tw-rooms">
    <li class="room" style="--rc:#C27BFF"><span class="win"></span><img src="/img/h-angel.webp" alt=""></li>
    <li class="room" style="--rc:#5FB4FF"><span class="win"></span><img src="/img/h-frost-witch.webp" alt=""></li>
    <li class="room" style="--rc:#C9CED8"><span class="win"></span><img src="/img/h-archer.webp" alt=""></li>
  </ul><div class="tw-base"></div></div>
<div class="l" id="l"></div>
<script>var l=location.hash.slice(1)||'ko';
document.getElementById('l').innerHTML=l=='ko'?'<img src="/img/logo-ko.webp" alt=""><h1 style="font-size:68px">켜 두면, 골드로<br>성이 자라요</h1>':'<span class="brand-text">Castle Up!</span><h1>Leave it on.<br>Gold grows your castle.</h1>';
document.getElementById('bn').textContent=l=='ko'?'화염 드래곤':'Flame Dragon';
document.getElementById('bw').textContent=l=='ko'?'약점 얼음':'Weak to Ice';</script></body></html>
