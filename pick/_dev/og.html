<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#f1f3f2;font-family:"Pretendard Variable",Pretendard,sans-serif;color:#1b2026;overflow:hidden;position:relative}
.w{position:absolute;left:-70px;top:-65px;width:760px;height:760px}
.t{position:absolute;left:700px;top:0;bottom:0;right:60px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.b{display:flex;align-items:center;gap:16px;font-weight:800;font-size:44px;letter-spacing:-.02em}
h1{margin:0;font-size:68px;line-height:1.12;letter-spacing:-.035em;font-weight:800}
p{margin:0;font-size:30px;line-height:1.4;color:#444c56;font-weight:500}
.ic{display:none}.ic svg{display:block}
body.icon{width:180px;height:180px;background:#fff}body.icon>*{display:none}body.icon .ic{display:grid;place-items:center;width:180px;height:180px}
</style></head><body>
<svg class="w" viewBox="-380 -380 760 760" id="w"></svg>
<div class="t"><div class="b"><svg width="62" height="58" viewBox="0 0 28 26"><circle cx="12" cy="13" r="8.5" fill="none" stroke="#1b2026" stroke-width="5.5" stroke-dasharray="11.75 1.6" transform="rotate(-39.6 12 13)"/><path d="M18.55 7.58A8.5 8.5 0 0 1 18.55 18.42" fill="none" stroke="#ffd04a" stroke-width="5.5"/><path d="M28 13l-9.4-4.6v9.2z" fill="#e23a3f"/></svg><span id="brand"></span></div><h1 id="h"></h1><p id="s"></p></div>
<div class="ic"><svg width="150" height="150" viewBox="0 0 32 32"><circle cx="14" cy="16" r="10" fill="none" stroke="#1b2026" stroke-width="6.4" stroke-dasharray="13.9 1.8" transform="rotate(-39.8 14 16)"/><path d="M21.68 9.6A10 10 0 0 1 21.68 22.4" fill="none" stroke="#ffd04a" stroke-width="6.4"/><path d="M32 16l-10.8-5.3v10.6z" fill="#e23a3f"/></svg></div>
<script>
const q = new URLSearchParams(location.search); const ko = q.get('lang') === 'ko';
if (q.get('icon')) document.body.className = 'icon';
const names = ko ? ['민준', '서연', '지호', '유나', '도윤', '하린', '서준', '채원'] : ['Olivia', 'Noah', 'Emma', 'Liam', 'Ava', 'Mason', 'Sophia', 'Lucas'];
const cols = ['#ffd04a', '#7cc4f4', '#86dba8', '#b9a7f6', '#ffb968', '#5fd0cf', '#c2e56b', '#94a9f8'];
const NS = 'http://www.w3.org/2000/svg'; const w = document.getElementById('w'); const R = 350; const a = Math.PI / 4; const rot = -a / 2;
const mk = (t, o) => { const e = document.createElementNS(NS, t); for (const k in o) e.setAttribute(k, o[k]); w.append(e); return e; };
mk('circle', { r: 372, fill: '#fff' });
names.forEach((n, i) => { const s = i * a + rot, e = s + a; mk('path', { d: `M0 0L${R * Math.cos(s)} ${R * Math.sin(s)}A${R} ${R} 0 0 1 ${R * Math.cos(e)} ${R * Math.sin(e)}Z`, fill: cols[i], stroke: '#fff', 'stroke-width': 4, opacity: i === 0 ? 1 : .3 });
  const mid = s + a / 2; const flip = Math.cos(mid) < -1e-9; const tx = mk('text', { x: flip ? -R * .86 : R * .86, y: 0, 'text-anchor': flip ? 'start' : 'end', 'dominant-baseline': 'central', 'font-size': 44, 'font-weight': 700, fill: '#1b2026', opacity: i === 0 ? 1 : .35, transform: `rotate(${(mid + (flip ? Math.PI : 0)) * 180 / Math.PI})` }); tx.textContent = n; });
mk('circle', { r: 96, fill: '#fff' }); mk('circle', { r: 86, fill: '#e23a3f' });
mk('path', { d: 'M318 0 388 -28Q398 -31 398 -20V20Q398 31 388 28Z', fill: '#e23a3f' });
document.getElementById('brand').textContent = ko ? '공평뽑기' : 'Pickboard';
document.getElementById('h').innerHTML = ko ? '돌림판<br>사다리타기<br>제비뽑기' : 'Wheel, ladder,<br>name picker';
document.getElementById('s').innerHTML = ko ? '인원 제한 없이 뽑고<br>결과는 링크로 다시 보기' : 'No entry limit.<br>A link replays the same result.';
</script></body></html>
